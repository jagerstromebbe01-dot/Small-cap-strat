id: HYP-075
date_registered: '2026-08-12'
title: "Positionstak på HYP-072 - symmetrisk trimning av positioner som mer än tredubblats"
universe: "N/A - samma engine/signal som HYP-072:s deltest A (full_ls),
  oförändrad. Ingen ny small-cap-signal, inget nytt universum."
small_cap_definition: "N/A - se HYP-072:s redan låsta definition, oförändrad."
data_range: "Samma period som HYP-072 (2010-01-01 till 2024-12-31 huvudperiod
  + genuin OOS-2025), samma SEC filings-index (data/cache/sec_filing_index.jsonl)."
pass_fail_criterion: >
  MEKANISM (låst, inga fria parametrar kvar att välja):

  Bygger direkt på HYP-072:s redan låsta klassificering ("aktiv shelf-
  användare" / "ren") och samma månatliga ombalansering (deltest A:s
  full_ls-läge, dollarneutralt 50/50 long/kort). Ingen ändring av VILKA
  namn som väljs eller VARFÖR - bara en tillagd, symmetrisk regel för
  HUR STOR en redan öppnad position tillåts bli innan nästa ombalansering.

  NY REGEL (kontrolleras VARJE handelsdag, utöver den befintliga
  månatliga ombalanseringen): för varje öppen position (long eller
  kort), jämför dagens marknadsvärde (long) respektive skuldvärde
  (kort) mot värdet vid SENASTE entry eller senaste trimning (det som
  inträffat sist). Om det aktuella värdet är >= 3,0x det referensvärdet
  (positionen har mer än TREDUBBLATS i storlek sedan den senast
  sattes), TRIMMA positionen nästa handelsdag tillbaka till EXAKT sitt
  ursprungliga dollarvärde vid den senaste entryn/trimningen (sälj
  överskottet för long, minska skuldnotionalen i motsvarande grad för
  kort), med Corwin-Schultz-spread på trim-transaktionen. En trimmad
  position kan trimmas igen om den återigen tredubblas räknat från sitt
  NYA (redan trimmade) referensvärde - ingen gräns på antal trimningar
  per position.

  Tröskeln 3,0x är vald för att vara tillräckligt hög att INTE klippa
  vanlig, sund avkastningsspridning i en likaviktad small-cap-korg, men
  tillräckligt låg att fånga just den typ av extrem, enskild
  koncentration (10-170x) som redan identifierats i HYP-072:s
  robusthetsgranskning.

  MOTORKRAV: identiska med HYP-072 (samma tre grundfixar, samma
  borrow_cost 3%/år, samma Corwin-Schultz-spread, samma ADV-kapacitetsspärr).

  PASS KRÄVER ALLA FYRA, PÅ DEN AVGÖRANDE $100k-NIVÅN (rapporteras för
  alla tre kapitalnivåer):
  1. Sharpe (huvudperiod) >= 0,55 (standardgolvet).
  2. MaxDD INTE sämre än -50% (standardtaket).
  3. Sharpe med HELA kalenderåret 2020 exkluderat >= 0,4894 (HYP-072:s
     EGEN redan uppmätta ex-2020-Sharpe vid $100k, se dess registerpost)
     - testar om regeln bevarar eller förbättrar prestandan i "normala"
     år, inte bara de extrema.
  4. Kurtosis för den dagliga avkastningsserien (hela huvudperioden,
     $100k) < 366,2 (HYP-072:s EGEN redan uppmätta baskurtosis) - ett
     DIREKT test att koncentrationsrisken faktiskt minskat, inte bara
     påstås ha gjort det.

  FAIL om något villkor faller vid $100k.

  OBLIGATORISK DISCLOSURE (icke-gating): antal trimningar totalt och per
  kapitalnivå, andel av trimningarna som gällde long- respektive
  kortbenet, samt Sharpe/MaxDD/kurtosis-jämförelse rad för rad mot
  HYP-072:s redan rapporterade tal (inte bara villkor 3-4:s tröskelvärden).

  Diagnostiskt syfte: testar om en ren storlekshanteringsregel (ingen
  ändring av signalen) kan bevara HYP-072:s redan starka MaxDD och
  låga korrelation mot befintlig portfölj samtidigt som den gör
  avkastningen mindre beroende av enstaka extrema positioner.
status: passed   # pre-registered -> tested -> passed/failed
