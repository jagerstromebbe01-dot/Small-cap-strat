  omfattande skrapning av historiska ogonblicksbilder (t.ex. via
  Wayback Machine), vilket INTE ar den "billiga, offentliga data"-
  premiss hypotesen byggdes pa.

  SLUTSATS: kandidaten forkastas INTE for att mekanismen ar dalig -
