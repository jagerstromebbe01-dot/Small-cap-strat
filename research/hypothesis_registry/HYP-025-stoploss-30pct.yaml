  volatila small-cap-namn dar enskilda blow-ups vager tyngre) och vara
  ungefar neutral-till-svagt-skadlig vid HOG kapitalniva (dar
  kapacitetsspärren redan tvingar in mer likvida, mindre extrema namn -
  stop-lossen har mindre genuint att skydda mot dar, och kostnaden av
  falska larm vager relativt tyngre). Detta ar en ANNAN, mer
  finkornig variant av samma grundinsikt som HYP-018 och HYP-022 redan
