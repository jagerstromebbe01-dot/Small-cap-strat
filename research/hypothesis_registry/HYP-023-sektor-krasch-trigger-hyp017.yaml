result_summary: >
  PASSED - ALLA TRE villkor haller PA ALLA TRE kapitalnivaer. Detta ar
  den ANDRA godkanda hypotesen i projektets historia (efter HYP-017
  sjalv; HYP-021 passerade ocksa men var statistiskt oskiljbar fran
  HYP-017 och raknades inte som en verklig forbattring).

  Villkor 1 (Sharpe >= 0.55): 0.72/0.75/0.72 - PASS, i praktiken
  OFORANDRAT fran HYP-017:s 0.72/0.75/0.72 (marginella skillnader,
  ingen meningsfull forandring i kärnavkastningen).

  Villkor 2 (MaxDD inte samre an HYP-017): -25.46%/-19.29%/-13.16% mot
  HYP-017:s -26.96%/-19.77%/-13.39% - PASS pa ALLA TRE, till skillnad
  fran HYP-022 (statiskt tak) som FÖLL har vid $1M/$10M. Forbattringen
  ar TYDLIG vid $100k (1.5pp) men TUNN vid $1M (0.48pp) och $10M
  (0.23pp) - tekniskt en forbattring, men marginell vid de tva hogre
  nivaerna. Detta ska INTE overtolkas som ett stort MaxDD-genombrott pa
  $1M/$10M - det viktiga ar att mekanismen INTE FORSAMRAR nagot dar,
  vilket var exakt vad HYP-022 gjorde.

  Villkor 3 (mars 2023 mindre negativ an -14.8%): -14.0%/-8.2%/-2.3% -
  PASS pa alla tre, med en TYDLIG och VAXANDE forbattring vid hogre
  kapitalnivaer (kapacitetsspärren tvingar redan in mer likvida,
  mindre bankkoncentrerade namn vid hoga nivaer, sa den dynamiska
  triggern far mindre kvar att skydda mot ju hogre kapitalnivan ar).

  MEKANISMEN FUNGERADE SOM AVSETT: 8 distinkta sektor-trigger-episoder
  over 2011-2024 (2011-08-05, 2011-08-17, 2020-02-28, 2020-03-05,
  2020-05-13, 2020-06-22, 2023-03-13, 2023-05-12) - INTE ett brusigt,
  konstant-triggande monster trots den kanda risken att en small-cap-
  bankkomposit kan vara mer volatil an SPY (flaggad i pass_fail_criterion
  som en accepterad risk, INTE fixad i efterhand). 2023-03-13 (SVB/
  Signature Bank) OCH 2023-05-12 (troligen First Republic-kollapsen,
  en andra vag av samma kris) ar bada med - bekraftar att mekanismen
  faktiskt griper in under malhandelsen, tva ganger.

  VARFOR DEN DYNAMISKA MEKANISMEN LYCKAS DAR HYP-022:s STATISKA TAK
  FALLERADE: HYP-022 tog bort bankexponering PERMANENT, vilket kostade
  portfoljen banksektorns stabiliserande roll under lugna perioder
  (2022 rantehojningar gynnade bankmarginaler anda fram till SVB-
  kollapsen). Denna mekanism, som ENDAST griper in nar bankkompositens
  egen 10-dagarsrorelse faktiskt indikerar akut stress, behaller
  bankexponeringen under normala/gynnsamma perioder och skar bara ner
  under bekraftad stress - samma princip som redan gjorde SPY-overlayen
  battre an en langsam trailing-beta-hedge i HYP-015->017.

  ROBUSTHET (innan detta rapporterades): sharpe_excl_best_trade forblir
  0.665/0.699/0.714 - alla fortfarande over 0.55-golvet aven utan den
  enskilt basta traden, sa resultatet ar INTE en artefakt av en
  dominerande outlier.

