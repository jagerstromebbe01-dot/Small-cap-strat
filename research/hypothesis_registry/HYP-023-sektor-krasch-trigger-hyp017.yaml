  (INTE fixad i efterhand om den materialiserar sig): en small-cap-bankkomposit kan ha annan (troligen
  hogre) naturlig volatilitet an SPY, vilket kan gora att triggern gar av oftare/brusigare an
  SPY-overlayen - detta redovisas som en kand begransning i resultatet, INTE nagot som justeras bort.

  MOTORKRAV (samma tre som HYP-015/016/017/022, redan byggda i strategies/common/): snappade
