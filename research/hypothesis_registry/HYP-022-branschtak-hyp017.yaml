pass_fail_criterion: 'Identisk bas som HYP-017 (idiosynkratisk volatilitet, lagsta decilen, kvartalsvis
  ombalansering, SPY-krasch-overlay OFORANDRAD - samma 10-dagars/-10%/40%-mekanism - samma friktion/hedge/
  kapacitetsspärr, samma tre motorfixar). Enda tillagget: ett TAK pa bank-/finanssektorns andel av
  portfoljen vid varje ombalanseringstillfalle, riktat direkt mot den diagnostiserade branschkoncentrationen
  (27.3% av handlade tickers mot 7.0% i basuniversumet).

  Sektorklassificering (INTE valfri, samma metod som avslojade fyndet): en tickers namn (fran
  data/cache/smallcap_classification.jsonl) matchas mot nyckelorden bancorp, savings, bank, thrift,
  financial, trust (case-insensitive substring). Detta ar en grov men REPRODUCERBAR klassificering -
  INTE en GICS-sektorkod, men samma metod som redan anvandes for att identifiera 27.3%-fyndet.

  Tak, exakt specificerat (INTE fritt, INTE anpassat efter resultat): 2x bank-/finanssektorns andel i
  HELA small-cap-basuniversumet (7.0%), avrundat till 15%. Denna logik (proportionellt tak relativt
  faktisk marknadssammansattning, valt INNAN nagon backtest av denna hypotes kors) ar vald for att vara
  oberoende av vad som rakar bevara Sharpe eller dampa marsdrawdown 2023 bast - INGEN alternativ
  trosklelniva har testats eller kommer testas under denna hypotes.

  Implementation (mekanisk, vid varje kvartalsvis decil-ombalansering): kandidater sorteras liksom
  tidigare efter LAGST idiosynkratisk vol forst. Malantalet namn (n_top, samma DECILE_FRACTION-logik som
  HYP-017) ar OFORANDRAT. Bank-/finansnamn accepteras i turordning SA LANGE antalet redan valda
  bank-/finansnamn understiger floor(n_top * 0.15) - en bankkandidat som skulle bryta mot taket hoppas
  over (och ersatts LANGRE NER i kon av nasta icke-bank- ELLER, om bankkvoten annu inte ar fylld,
  nasta bank-kandidat). Icke-bank-kandidater paverkas inte av taket. Eftersom positioner ar ungefar
  lika-dollar-viktade vid ingang (oforandrat fran HYP-017) approximerar ett antalsbaserat tak pa
  floor(n_top * 0.15) namn ett dollarviktat tak pa ~15% av portfoljen.

  MOTORKRAV (samma tre som HYP-015/016/017, redan byggda i strategies/common/): snappade
  ombalanseringsdatum, adjusted_close genomgaende, flag_implausible_liquidity().

  PASS kraver ALLA fyra:
  1. Sharpe (efter friktion) >= 0.55 pa SAMTLIGA tre kapitalnivaer (100k/1M/10M) - samma golv som
     HYP-017/018.
  2. Maxdrawdown INTE samre (inte mer negativ) an HYP-017:s EGET redan uppnadda resultat pa SAMMA
     kapitalniva (100k: -26.96%, 1M: -19.77%, 10M: -13.39%) - svagare krav an HYP-018:s "strikt battre",
     eftersom syftet har ar att tappa en SPECIFIK, redan diagnostiserad sarbarhet (bankkoncentration),
     inte nodvandigtvis forbattra en headline-MaxDD som domineras av en helt annan handelse (covid).
  3. Bank-/finanssektorns andel av handlade namn vid VARJE ENSKILD ombalanseringsdag <= 15% - verifieras
     DIREKT ur portfoljloggen/holdings vid varje ombalansering, inte ett skattat medeltal over tid. Detta
     ar i praktiken en mekanisk verifiering att implementationen faktiskt gor det den ska, snarare an ett
     forvantat "upptackt" resultat.
  4. Mars 2023-episoden (2023-02-01 till 2023-05-01) visar en MINDRE NEGATIV avkastning an HYP-017:s
     egna -14.8% vid $100k-nivan. Detta ar INTE en efterhandsanpassad tackningsgaranti - det ar en
     direkt, mekaniskt forvantad konsekvens av minskad bankexponering (mindre bankexponering -> mindre
     skada av en bankspecifik kris) och fungerar som en verifiering att atgarden faktiskt gor det den ar
     avsedd for, INTE ett sokt facit-tal versionerat i efterhand (jfr HYP-017:s egen
     "lamna-en-kris-ute"-sjalvkritik: detta villkor testar EXAKT den handelse atgarden riktar sig mot,
     till skillnad fran ett godtyckligt urval).
  FAIL om nagon niva/nagot villkor faller.

  Diagnostiskt syfte: testar om en enkel, strukturell portfoljkonstruktionsbegransning (branschtak) kan
  tamja en KAND, mekanisk bieffekt av lagvolatilitets-/idio-vol-siktning (overexponering mot reglerade,
  stabila sektorer) utan att forstora den underliggande edgen - till skillnad fran HYP-018 som testade
  ett REAKTIVT, per-position-riktat verktyg (stop-loss) mot ett annat, separat diagnostiserat problem
  (enskilda-namn-forluster utan bred SPY-nedgang) och misslyckades i aggregat pa grund av for mycket
  brus fran falska larm. Denna hypotes ar strukturell/preventiv snarare an reaktiv, och riktad mot en
  ANNAN rotorsak (sektorkoncentration, inte otillracklig reaktionshastighet).'
