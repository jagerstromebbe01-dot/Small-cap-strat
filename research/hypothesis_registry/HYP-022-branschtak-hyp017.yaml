result_summary: >
  FAILED - villkor 1 (Sharpe >= 0.55), 3 (bankandel <= 15%) och 4
  (mars 2023 mindre negativ an -14.8%) haller på ALLA tre kapitalnivåer,
  MEN villkor 2 (MaxDD inte samre an HYP-017:s eget resultat pa SAMMA
  kapitalniva) FALLER pa 2 av 3 nivaer: $1M -22.6% (mot HYP-017:s
  -19.77%, en verklig FORSAMRING) och $10M -15.4% (mot HYP-017:s -13.39%,
  ocksa en forsamring). Bara $100k klarar villkor 2 (-25.7% mot -26.96%).
  Kriteriet kravde forbattring/oforsamring pa SAMTLIGA tre nivaer, sa
  hypotesen ar FAILED trots att Sharpe faktiskt STEG pa alla tre nivaer
  (0.75/0.77/0.65 mot HYP-017:s 0.72/0.75/0.72) och trots att den
  SPECIFIKA mars 2023-episoden blev mindre skadlig pa alla tre nivaer
  (-13.4%/-11.7%/-6.5% mot -14.8%).

  MEKANISMEN FUNGERAR EXAKT SOM AVSEDD FOR MALFALLET: bankandelen ligger
  exakt vid 15%-taket vid varje ombalansering pa alla tre nivaer (villkor
  3), och mars 2023-episoden - den handelse hypotesen konkret riktades
  mot - forbattras mätbart pa alla tre nivaer (villkor 4). Detta ar INTE
  ett implementationsfel.

  VARFOR DET ANDA MISSLYCKAS I AGGREGAT PA 2 AV 3 NIVAER (diagnos,
  innan detta rapporterades som FAIL): headline-MaxDD:n pa $1M och $10M
  kommer INTE fran mars 2023 i HYP-017:s egen korning - de kommer fran
  helt ANDRA episoder (covid 2020-01-03/2020-04-06 vid $1M, USA:s
  skuldtakskris 2011-07-08/2011-10-04 vid $10M). Genom att kapa
  bankexponeringen tvingas urvalet in i ANDRA, icke-bank lagvolatila
  namn under HELA backtestperioden - inte bara under mars 2023. Vid $1M
  blir foljden att en LANGRE, tidigare ICKE-dominerande episod
  (2022-01-13 till 2023-05-17, en bredare 2022 rantehojnings-bjornmarknad
  som ravar in i sjalva bankkrisen) nu blir den NYA varsta episoden med
  -22.6%, vilket overtar covid-episodens tidigare -19.77% som HYP-017:s
  headline-MaxDD. Vid $10M blir Dec 2018-saljoffret (2018-09-21 till
  2018-12-26, helt orelaterat till banker) den nya varsta episoden med
  -15.4%, vilket overtar HYP-017:s 2011-skuldtakskris-episod pa -13.39%.

  TOLKNING: bankaktier var, utanfor det akuta mars 2023-SVB-chock-
  fonstret, en KALLA TILL STABILITET under storre delen av 2022 (hogre
  rantor gynnade bankernas rantenetto anda fram till SVB-kollapsen) -
  inte bara en riskkalla. Att kapa bankexponeringen tog bort den
  stabiliteten under RESTEN av en lang bjornmarknadsepisod for att
  minska skadan i ETT akut sub-fonster, med ett NETTO-negativt utfall pa
  full-episod-MaxDD vid $1M/$10M. Detta ar en genuin avvagning, INTE ett
  tecken pa felaktig implementation - jfr HYP-018 dar stop-loss-
  mekanismen ocksa fungerade exakt som diagnostiserad for malfallet men
  anda inte rackte i aggregat, fast av en annan orsak (falska larm dar,
  har en forlorad diversifieringskalla).

  ROBUSTHET (innan detta rapporterades): sharpe_excl_best_trade forblir
  0.698/0.711/0.639 - alla fortfarande over 0.55-golvet aven utan den
  enskilt basta traden, sa Sharpe-forbattringen ar INTE en artefakt av
  en dominerande outlier.

  SLUTSATS FOR HYP-017:s KVARSTAENDE SARBARHET: branschkoncentrationen
  ar fortfarande OLOST for HYP-017 sjalv (som forblir referensen, K
  oforandrad dar). Ett enkelt strukturellt tak raknar inte som en fri
  lunch har - det byter en KAND, akut, sektorspecifik risk (mars 2023)
  mot en mer diffus forlust av diversifiering under lugnare perioder.
  Framtida atgarder mot samma sarbarhet (om de nagonsin testas) bor
  overvaga nagot mer riktat an ett statiskt tak - t.ex. en
  sektorspecifik krasch-trigger (analogt med SPY-overlayen men pa ett
  regionbanksindex) i stallet for en permanent begransning - men det
  skulle krava sin egen, oberoende pre-registrerade hypotes.
