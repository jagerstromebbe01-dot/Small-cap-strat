# LÅST 2026-07-30 av CEO i chatt, innan denna hypotes sätts pre-registered
# eller nagon backtest kors. Uppfoljare till HYP-017 (SPY-krasch-overlay
# pa idiosynkratisk vol, PASSED, K=16, fortfarande referensimplementationen
# efter HYP-018/021). Riktad mot den ALLVARLIGA, redan diagnostiserade
# svagheten fran HYP-017:s skeptiska granskning 2026-07-30 (se
# HYP-017-yaml:ns senaste result_summary-uppdatering): 27.3% av alla 696
# nagonsin handlade tickers ar bank-/finansrelaterade (mot 7.0% i hela
# small-cap-basuniversumet, ~4x overrepresentation) - en KAND, dokumenterad
# mekanisk sidoeffekt av lagvolatilitets-/idio-vol-siktning (reglerade
# banker/sparbanker har typiskt stabila, lagvolatila kurser), INTE en
# ad hoc-regel uppfunnen for att undvika en specifik handelse. Detta gav
# ett konkret, redan observerat skadefall: amerikanska regionbankskrisen
# mars 2023 (SVB/Signature Bank) - portfoljen -14.8% (2023-02-01 till
# 2023-05-01, $100k-nivan) medan SPY var +1.5% samma period - krasch-
# overlayen (bevakar bara SPY) triggade aldrig, eftersom kraschen var
# sektorspecifik, inte marknadsbred. Se konversationen 2026-07-30 for
# full motivering och diskussion (inkl. extern konsultation) om varfor
# atgarden bedoms vara strukturellt/ex-ante motiverad och inte en
# facit-anpassad patch.
# status: pre-registered -> tested -> passed/failed

