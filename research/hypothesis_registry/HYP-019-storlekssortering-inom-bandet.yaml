result_summary: >
  FAILED, decisively, pa alla tre kapitalnivaer. Sharpe 0.23/0.23/0.24 -
  langt under 0.55-tröskeln, och lagst DSR (0.08/0.08/0.10) av alla
  hypoteser testade denna session. MaxDD ar det VARSTA av alla hypoteser
  hittills testade i hela projektet: -77.9%/-68.6%/-45.0% (jamfor HYP-012
  momentum -68% till -76%, och HYP-014/015 lagvol/idio-vol -30% till
  -48%). Storlek I SIG, som ren signal inom det redan small-cap-
  klassificerade bandet, bar alltsa INTE en tydlig egen edge - snarare
  extrem svansrisk utan motsvarande kompensation. Tolkning: de allra
  minsta bolagen inom $100M-$2B-bandet ar sannolikt dominerade av
  nödlidande-risk (distress), illikviditet och forcerad-forsaljnings-/
  avnoterings-risk snarare an av en ren kapacitetsbegransningsfordel -
  kapacitetsmekanismen (Berk & Green 2004) verkar INTE ge nettopositiv,
  exploaterbar edge nar den testas sa har direkt, atminstone inte utan
  ytterligare riskhantering (som redan visat sig svar att fa ratt for
  andra signaler, se HYP-016/018).

  VIKTIG KAND DATABEGRANSNING (upptackt vid granskning av utstickande
  trades - paverkar INTE FAIL-slutsatsen har, men bor noteras for
  framtida arbete): sharpe_excl_best_trade swingar KRAFTIGT vid $1M
  (0.23 -> -0.14, dvs blir NEGATIV utan den enskilt basta traden) - den
  traden ar ANNU en ESSA-artefakt (+29 682% pa en trade, 2012-12-31).
  Radata visar att ESSA hade en TREDJE, tidigare okand permanent
  felaktig prisregim (december 2012 - februari 2013, pris ~$3000 mot
  normalt ~$10, sannolikt ANNU en leverantors-tickerkollision) UTOVER
  de tva redan dokumenterade fallen (sporadiska helgdags-relaterade
  enstaka-dagshopp 2011-2023, och den permanenta regimen fran
  2023-12-15). Varken flag_implausible_liquidity() (dollarvolymen i
  detta 2012-fallet ar hog i pris men LAG i volym, under
  implausibilitetstroskeln) eller clean_price_matrix()s lokala-median-
  filter (den falska regimen varade over en manad, lang nog att dominera
  sitt eget 21-dagarsfonster och darfor tolkas som en "akta"
  omvardering) fangade detta. ESSA har nu bekraftat orsakat problem i
  MINST TRE separata hypoteser (HYP-014, HYP-015/017, HYP-019) via minst
  TRE distinkta undermonster som befintliga statistiska filter bara
  delvis fangar. REKOMMENDATION: overvag ett explicit ticker-uteslutnings-
  register (deny-list) for kant problematiska tickers som ESSA, som ett
  komplement till de statistiska filtren - inte utfort har, flaggat for
  separat uppfoljning.
