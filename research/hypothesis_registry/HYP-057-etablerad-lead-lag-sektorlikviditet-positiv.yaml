pass_fail_criterion: >
  MEKANISM (låst, inga fria parametrar - IDENTISK med HYP-055:s
  ledare/följare-konstruktion, ENDAST signalriktningen omvänd):

  LEDARE/FÖLJARE-UPPDELNING: exakt som HYP-055 - per SIC-branschgrupp,
  varje vecka, rangordna eligible-namn efter 60-dagars genomsnittlig
  dollarvolym. Översta tredjedelen = "ledare", nedersta tredjedelen =
  "följare". Endast branscher med minst 6 eligible namn deltar.

  SIGNAL (OMVÄND mot HYP-055): ledarkorgens 5-dagars trailing-avkastning
  jämförs mot sin egen rullande 2-års fördelning:
  - Ledarkorgens 5-dagarsavkastning i ÖVERSTA KVINTILEN (>= 80:e
    percentilen) → KÖP följarkorgen (POSITIV spridning - HYP-055
    KORTADE här) kommande 5 handelsdagar.
  - Ledarkorgens 5-dagarsavkastning i NEDERSTA KVINTILEN (<= 20:e
    percentilen) → KORTA följarkorgen (HYP-055 KÖPTE här) kommande
    5 handelsdagar.
  - Annars: ingen position.

  Allt annat (branschkombination, ombalansering, motorkrav, friktion)
  IDENTISKT med HYP-055 - se dess registerpost för fullständiga detaljer
  om SIC-klassificering, likaviktning och normalisering.

  PASS KRÄVER, PÅ DEN AVGÖRANDE $100k-NIVÅN (rapporteras för alla tre):
  1. Sharpe (efter friktion) >= 0.55.
  2. MaxDD INTE sämre än -50% (samma explicita tak som HYP-055 - även
     om detta är den etablerade, mer sannolikt genuina riktningen,
     behålls samma säkerhetsmarginal tills motsatsen är bevisad).

  FAIL om något villkor faller vid $100k.

  OBLIGATORISK DISCLOSURE (icke-gating): samma statistik som HYP-055
  (andel veckor med kvalificerande bransch, andel med trigger) för
  direkt jämförbarhet mellan de två riktningarna.

  Diagnostiskt syfte: isolerar om det är signalRIKTNINGEN (positiv vs
  negativ spridning) som avgör utfallet, inte branschuppdelnings-
  metoden i sig - HYP-055:s postmortem antydde att positiv spridning
  kan dominera i detta universum (bred, jämn förlust snarare än en
  enskild bugg), detta testar den hypotesen direkt istället för att
  bara spekulera om den i efterhand.
