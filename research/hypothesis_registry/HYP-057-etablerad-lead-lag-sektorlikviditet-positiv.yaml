  ra Sharpe.

  MEKANISMEN EXERCERADES GENUINT - triggerdiagnostiken ar IDENTISK med
  HYP-055:s (822 veckor utvarderade, 97.8% hade minst en kvalificerande
  bransch, 81.3% av veckorna hade minst en trigger, 5664 triggers
  totalt over 47 SIC-huvudgrupper) eftersom mekaniken ateranvands
  ordagrant - ENDA skillnaden ar att triggerns RIKTNING ar omvand:
  HYP-057 fick n_long_triggers=2778/n_short_triggers=2886, EXAKT
  spegelvant mot HYP-055:s n_long_triggers=2886/n_short_triggers=2778
  (samma veckor, samma branscher, bara motsatt kop/salj-etikett).
  Verifierat via scripts/diagnostic_hyp057_sanity_check.py - detta ar
  INTE en oavsiktlig kopiering av HYP-055:s kod utan en genuin
  spegelvandning.

  OBLIGATORISK UTREDNING (samma disciplin som HYP-042/049/050/055):
  vid $100k avslutades 4867 positioner, 56.9% forlorande. Bara 0.062%
  (3 st) forlorade mer an 50% av sin egen notional pa en enskild
  5-dagars-hallperiod (varsta enskilda -101.19%, foljt av -59.88% och
  -52.26%) - forlusten ar BRED OCH JAMN over hela perioden, INTE en
  enskild exploderad position som forklarar resultatet. Till skillnad
  fran HYP-055 (dar long/kort var nastan identiska, -1.71%/-1.94%) syns
  har en tydligare riktningsasymmetri: kortbenet (n=2539) hade snitt
  nettoavkastning -0.81%/position mot langbenets (n=2328) -0.14%/
  position - kortbenets 3%/ars borrow cost bidrar rimligen till denna
  skillnad.

  DIREKT JAMFORELSE MOT HYP-055 (hela syftet med detta test - isolera
  RIKTNINGENS effekt fran den delade branschuppdelningsmetoden):
  HYP-057 FAILAR PA BADA LASTA VILLKOR, PRECIS SOM HYP-055, men TYDLIGT
  MINDRE KATASTROFALT pa varje enskilt matt:
    - Sharpe: HYP-057 -1.24 till -1.42 mot HYP-055 -2.74 till -3.00
      (ungefar halva den negativa magnituden).
    - MaxDD: HYP-057 -96.3% till -99.5% mot HYP-055 -99.98% till -99.99%
      (fortfarande extremt, men inte total utplaning vid $10M).
    - OOS-2025 (informativt, ej gating): HYP-057 TYDLIGT POSITIVT -
      Sharpe 0.884/0.884/0.897, avkastning +37.6%/+37.6%/+37.3% - rakt
      motsatt HYP-055:s NEGATIVA OOS (Sharpe -1.60/-1.37/-1.90,
      avkastning -37.7%/-32.5%/-51.0%).

  DIAGNOS: resultatet ar konsistent med att den ETABLERADE, POSITIVA/
  samstammiga lead-lag-riktningen (Lo & MacKinlay 1990; Cohen &
  Frazzini 2008 - foljare tenderar att gora SAMMA sak som ledarna, bara
  fordrojt) ligger NARMARE den genuina mekanismen i detta small-cap-
  universum an HYP-055:s negativa/substituerande hypotes - HYP-057
  forlorar mindre och har ett klart battre (positivt) OOS-ar. MEN
  ingendera riktning ger nagot i narheten av ett passerande resultat i
  huvudperioden 2010-2024: bada FAILAR pa bada lasta villkor. Den mest
  sannolika tolkningen ar att en verklig, svag positiv spridningseffekt
  finns (OOS-2025 antyder detta), men att den 5-dagars-hallperiodens
  dubbelriktade friktion (Corwin-Schultz-spread pa bade entry och exit,
  3%/ars borrow pa kortbenet) systematiskt ater upp en signal som ar
  for svag/brusig for att overleva rundtursfriktionen i huvudperioden -
  inte en riktningsbugg och inte en no-op.

  HYP-047 forblir referensimplementationen, oforandrad. Femte
  oberoende datapunkt i registret (efter HYP-013/042/050/055) om att
  mekaniska sektor-/lead-lag-baserade small-cap-konstruktioner av denna
  typ inte genererar exploaterbar edge efter friktion i detta
  universum - men den forsta dar riktningen tydligt paverkar
  ALLVARLIGHETSGRADEN av misslyckandet, inte bara dess forekomst.
