result_summary: >
  FAILED - PA BADA villkoren, PA ALLA TRE nivaer.

  Villkor 1 (Sharpe >= 0.55): 0.51/0.54/0.55 - MISSAR golvet pa alla tre
  nivaer (aven $10M, 0.5499, missar med en hars bredd). Klart svagare an
  HYP-023:s egna 0.72/0.75/0.72.

  Villkor 2 (MaxDD inte samre an HYP-023:s -25.46%/-19.29%/-13.16%):
  FAIL PA ALLA TRE NIVAER, och forsamringen VAXER dramatiskt med
  kapitalniva: -28.54% (100k, 3.08pp samre), -28.50% (1M, 9.21pp
  samre), -26.71% (10M, 13.55pp samre - MER AN DUBBELT sa daligt som
  HYP-023:s egna -13.16%). Detta ar motsatt monster mot vad
  motiveringen (mildra kapitalnivaberoende risk) hoppades pa.

  OBLIGATORISK DIAGNOSTIK (scripts/attribution.py HYP-036) - mekanismen
  GJORDE vad den var avsedd att gora: SIC 60-overexponeringen (statliga
  affarsbanker) foll fran HYP-023:s 5.6x till 1.3x/1.2x/0.8x -
  koncentrationen ar I PRAKTIKEN ELIMINERAD (till och med underrepresenterad
  vid $10M). MEN detta loste INTE huvudproblemet - Sharpe/MaxDD blev
  SAMRE, inte battre. Detta ar ett viktigt, tydligt EXEMPEL pa
  attributionsverktygets egna varningsklausul (se kriteriet): ett
  tekniskt uppnatt diagnostiskt mal (mindre koncentration) garanterar
  INTE ett battre resultat.

  DIAGNOS (varfor mekanismen gjorde det VARRE, inte battre): samma
  lardom som redan visad av HYP-022 (statiskt bank-tak, FAILED med
  SAMRE MaxDD an baslinjen) - bankexponeringen fyllde en STABILISERANDE
  roll i HYP-023, inte bara en riskkalla. Genom att tvinga fram minst 1
  namn per narvarande SIC-sektor (aven tunna/volatila sektorer) okade
  sektorneutral rankning antalet innehav kraftigt (2991 trades mot
  HYP-023:s 2253) och forskot exponeringen mot fler lakemedels-/
  mjukvaru-/halvledarenamn - sektorer med sannolikt HOGRE egen
  volatilitet an de globalt "vassaste" lagvol-namnen HYP-023 annars
  valde. Faktorregressionen bekraftar en STRUKTURELL forandring:
  MOM-loadingen blev STARKT SIGNIFIKANT NEGATIV (t=-5.2 till -6.1, mot
  HYP-023:s ej signifikanta t=-0.86 till -1.77) - denna variant fangar
  omedvetet mer forlorar-momentum-exponering, en riskfaktor detta
  projekt redan visat vara farlig (HYP-012/016/030, tre oberoende
  momentum-misslyckanden). Friktionsdraget okade ocksa markant (0.42pp/
  trade mot HYP-023:s 0.34pp) - fler, mindre positioner kostar mer i
  aggregat.

  ROBUSTHET: Alfat forblir faktiskt SIGNIFIKANT (13.3%/13.6%/12.1% arligt,
  t=3.07-3.20, R²=0.22) - sharpe_excl_best_trade ligger nara headline-
  Sharpen (0.50/0.53/0.55) sa resultatet ar INTE en enskild-trade-artefakt.
  DSR vid K=35: 0.42/0.46/0.48 - svagt, konsistent med FAIL men inte
  ren brus.

  SLUTSATS: HYP-023 forblir referensimplementationen OFORANDRAD.
  Sektorneutral rankning skapade PRECIS den minskade branschkoncentration
  den var avsedd att skapa - men avslojade darmed att koncentrationen
  sjalv INTE var den huvudsakliga orsaken till HYP-023:s OOS-svaghet.
  Bankexponeringen ar en FEATURE, inte en BUG, i just denna strategi -
  tredje oberoende bekraftelsen av detta (HYP-022 statiskt tak, HYP-023:s
  egen sektor-krasch-trigger som MEDVETET behaller bankexponering under
  lugna perioder, och nu detta). Framtida forsok att "lösa" bank-
  koncentrationen bor granska denna slutsats noga innan de foreslas.
