result_summary: >
  FAILED på samtliga tre kapitalnivåer. Sharpe utan friktion (-0.18 till
  -0.21) fortfarande djupt negativ, långt under 0.55-tröskeln - HYP-008:s
  misslyckande berodde alltså INTE primärt på friktionskostnader (som bara
  flyttade Sharpe fran -0.41/-0.45 till -0.17/-0.21). Diagnostik efter
  testet (ej en del av kriteriet): trade-nivån visar faktiskt en svagt
  POSITIV kant i isolation (profit factor 1.19, vinstandel 51.8%, 758
  target-utgångar mot 269 stop-utgångar) - men arlig portföljavkastning
  stannar pa +0.34% (under 2% riskfri ränta), sannolikt pa grund av lag
  kapitalanvändning (~73 trades/år över upp till 12 platser) snarare an
  att signalen saknar all prediktiv formaga. SPY-hedgen uteslöts separat
  som orsak (Sharpe nästan identisk med/utan hedge: -0.181 vs -0.174).
  Se strategies/HYP-009/diagnostics/ for hedge-ablationen.
