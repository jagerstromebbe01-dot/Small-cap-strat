pass_fail_criterion: 'Identisk bas som HYP-012/016 (12-1-manaders momentum - kumulativ avkastning over
  12 manader, EXKLUSIVE senaste manaden, Jegadeesh & Titman 1993 - gar lang i TOPPDECILEN, manatlig
  ombalansering (ME), samma friktion/SPY-beta-hedge/kapacitetsspärr som HYP-008). INGEN
  volatilitetsskalning av bruttoexponeringen (HYP-016:s mekanism, redan FAILED - fullinvesterad
  exponering varje manad, som HYP-012). Enda tillagget: en krasch-trigger BYGGD PA MOMENTUM-
  RANKNINGENS EGEN BOTTENDECIL (forlorarna), INTE SPY och INTE portfoljens egen volatilitet.

  Bottendecil-komposit (INTE valfri, samma likaviktade metod som HYP-021/023:s kompositfaktorer):
  likaviktat medelvarde av dagliga avkastningar over BOTTENDECILEN av samma manads momentum-rankning
  (de 10% med LAGST 12-1-manaders momentum bland manadens eligible-universum) - byggs om varje
  manad i takt med ombalanseringen, anvander ALDRIG framtida rankningsdata.

  Trigger, exakt specificerad (INTE fri, ateranvander SPY-overlayens redan lasta magnitud fran
  HYP-017 for konsistens - INTE en ny, ej motiverad siffra): om bottendecil-kompositens EGNA
  kumulativa avkastning over de senaste 10 handelsdagarna OVERSTIGER +10% (en kraftig rebound hos
  tidigare forlorare - MOTSATT RIKTNING mot SPY-overlayens nedgangstrigger, men SAMMA magnitud och
  fonster), skars momentumpositionerna ner till 40% av dagens varde (pro rata, samma friktion som en
  vanlig exit), EN gang per sammanhangande episod. Ateruppbyggnad sker INTE automatiskt - forst vid
  nasta ordinarie manatliga ombalansering (samma asymmetri som SPY-overlayen i HYP-017).

  MOTORKRAV (LOCKAT, samma tre som HYP-015/016/017 - se HYP-016:s granskning 2026-07-29 som
  identifierade dessa defekter): snappade ombalanseringsdatum (strategies/common/rebalancing.py),
  adjusted_close genomgaende (signal OCH positionsvardering), flag_implausible_liquidity()
  (max_market_cap=2_000_000_000, window=20, multiplier=1.0).

  PASS kraver BADA (samma tva som HYP-016, samma motivering - MaxDD-villkoret ar INTE godtyckligt
  utan den direkta, forhandsspecificerade testen mot HYP-012:s dokumenterade -72%/-78%-felorsak):
  1. Sharpe (efter friktion) >= 0.55 pa SAMTLIGA tre kapitalnivaer.
  2. Maxdrawdown battre (mindre negativ) an -50% pa SAMTLIGA tre kapitalnivaer.
  FAIL om nagon niva faller under nagotdera villkoret.

  YTTERLIGARE, INFORMATIONSMASSIGT KRAV (INTE del av PASS/FAIL, men OBLIGATORISKT att rapportera
  oavsett utfall): berakna och logga korrelationen mellan denna strategis dagliga avkastningsserie
  och HYP-023:s dagliga avkastningsserie over den overlappande backtestperioden - forbereder for en
  eventuell FRAMTIDA, separat och oberoende pre-registrerad kombinationshypotes (spec avsnitt 5b),
  men UTGOR INTE ett beslut att kombinera dem och kostar ingen egen K.

  Diagnostiskt syfte: HYP-012 hade en svagt positiv (INTE stark - se hederlig kalibrering ovan) ra
  Sharpe men kraschade pa maxdrawdown - en kand "momentum crash"-signatur (Daniel & Moskowitz 2016).
  HYP-016 testade om att skala EXPONERINGEN mot portfoljens EGEN volatilitet racker - det gjorde det
  inte. Denna hypotes testar en ANNAN mekanism ur SAMMA studie: kraschen drivs specifikt av att
  TIDIGARE FORLORARE studsar kraftigt (inte av generell marknadsnedgang eller forhojd portfoljvol) -
  en riktad trigger pa just den signaturen, i stallet for en generisk risk-proxy, kan tamja
  svansrisken dar de tva tidigare forsoken misslyckades.'
