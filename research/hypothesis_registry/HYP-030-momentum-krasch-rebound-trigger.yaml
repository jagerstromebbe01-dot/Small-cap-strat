result_summary: >
  FAILED, KRAFTIGT - villkor 1 (Sharpe >= 0.55) missas med bred marginal
  (0.02/0.04/-0.20, i praktiken noll eller negativt), och villkor 2
  (MaxDD battre an -50%) missas ANNU KRAFTIGARE: -86.0%/-83.0%/-74.2% -
  INTE bara ett misslyckande att forbattra, utan STRIKT SAMRE an
  HYP-016:s egen ODIAGNOSTISERADE oskalade baslinje (-78.0%/-76.2%/
  -71.3%, se HYP-016:s registrering). Triggern gjorde saken TYDLIGT
  varre, inte bara "ingen forbattring".

  DIAGNOS (innan detta rapporterades som FAIL): bottendecil-forlorar-
  kompositen triggade 80 GANGER over 2011-2024 (4-14 ganger PER AR,
  spritt over ALLA 14 ar - inte koncentrerat till kanda kris-/rebound-
  perioder). Jamfor med SPY-overlayens 5 episoder (HYP-017) eller
  sektor-triggerns 8 episoder (HYP-023) over SAMMA period. Detta
  bekraftar den KANDA, ACCEPTERADE RISKEN som redan flaggades i
  pass_fail_criterion INNAN testet kordes: en small-cap-forlorar-
  komposit har naturligt mycket hogre volatilitet an SPY eller en
  bank-/finanssektorkomposit (bottendecilen av momentum ar per
  definition redan pressade, ofta distressade, "penny-stock"-liknande
  bolag dar tillfalliga studsar pa +10%/10 dagar ar RUTIN, inte
  sallsynta krascher). Mekanismen mater alltsa i praktiken vanligt
  small-cap-brus, inte genuina Daniel & Moskowitz-kraschrebound-
  handelser - och genererade 9422 trades (mot HYP-016:s baslinje pa
  betydligt farre), vilket i sig kostar friktion vid varje falskt larm.

  ROBUSTHET: sharpe_excl_best_trade forblir -0.01/0.01/-0.20 -
  i praktiken oforandrat, sa det svaga/negativa resultatet ar INTE en
  saknad enskild-trade-artefakt utan ett systematiskt fenomen.

  INFORMATIONSMASSIGT (krav i kriteriet, INTE del av PASS/FAIL):
  korrelation mot HYP-023:s avkastningsserie ar 0.24/0.23/0.46 - mattlig
  positiv korrelation, INTE lag. Aven om denna hypotes hade klarat
  Sharpe/MaxDD-golvet hade den alltsa inte varit en sarskilt stark
  diversifieringskandidat mot HYP-023 - ytterligare ett skal att inte
  prioritera en framtida kombinationshypotes har.

  SLUTSATS: den riktade mekanismen (Daniel & Moskowitz forlorar-rebound-
  signatur, till skillnad fran HYP-016:s generella vol-skalning) var
  mekaniskt val motiverad men den PRAKTISKA IMPLEMENTATIONEN (en likaviktad
  bottendecil-komposit som trigger-kalla) ar for brusig for small-cap for
  att fungera som avsett. En framtida forsok (om nagot) skulle behova en
  mindre brusig proxy for "genuin kraschrebound" - t.ex. ett krav pa
  SAMTIDIG bred marknadsuppgang (SPY) UTOVER forlorar-kompositens egen
  rorelse, for att skilja en riktig markandsbred rebound fran rutinmassig
  small-cap-volatilitet - men det kraver sin egen, nya, oberoende
  pre-registrerade hypotes, inte en efterhandsjustering av denna. HYP-023
  forblir referensimplementationen. Momentum-familjen (HYP-012/016/030)
  har nu tre oberoende misslyckade forsok och bor betraktas som stangd
  om inte en fundamentalt annorlunda mekanism foreslas.
