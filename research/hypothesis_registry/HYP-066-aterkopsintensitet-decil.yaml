small_cap_definition: "small-cap, $100M-$2B börsvärde, EODHD All-World -
  identisk med HYP-017/023/037:s redan låsta definition."
data_range: "2010-01-01 till 2024-12-31 huvudperiod + genuin OOS-2025."
pass_fail_criterion: >
  MEKANISM (låst, inga fria parametrar kvar att välja):

  Motor: HYP-024:s redan validerade backtest-motor (data-sanering,
  adjusted_close, flag_implausible_liquidity, snap_rebalance_dates,
  SPY-beta-hedge, friktion via corwin_schultz_spread + borrow_cost,
  kapacitetsspärr ADV*10%) - INGEN ny motor byggd, ren signalersättning.

  SIGNAL: buyback_intensity(ticker, datum) = senaste FILADE 10-K:s
  årliga $ återköpt (PaymentsForRepurchaseOfCommonStock, två reservtaggar
  vid saknad primärtagg) / aktuellt marknadsvärde vid ombalanserings-
  datumet (pris × senast filade aktieantal, forward-fyllt). Bara namn med
  STRIKT POSITIVT värde (dvs faktiskt genomfört återköp) är kvalificerade
  för decilen - namn utan återköpsdata eller med värde <=0 exkluderas
  helt från urvalet den perioden (inte tvingas in med värde 0).

  Kvartalsvis ombalansering (samma snappade datum som resten av
  registret). Toppdecilen (10%) av kvalificerande namn, likaviktat.

  INGEN bank-/finansexklusion (till skillnad från HYP-024, vars
  operating-margin-signal inte var jämförbar för banker/REITs - $
  återköpt/marknadsvärde ÄR en jämförbar kvot oavsett sektor, en
  medveten skillnad mot HYP-024:s motor, redovisad här explicit).

  PASS KRÄVER, PÅ DEN AVGÖRANDE $100k-NIVÅN (huvudperioden 2010-2024,
  friktionskorrekt):
  1. Sharpe >= 0,55.

  FAIL om villkoret faller vid $100k-nivån.

  MaxDD rapporteras INFORMATIVT (icke-gating, samma konvention som
  HYP-024/033). Alla tre kapitalnivåer testas och rapporteras. OOS-2025
  körs och rapporteras.

  Diagnostiskt syfte: testar en genuint ny mekanismtyp (bolagets eget
  kapitalallokeringsbeslut, INTE insiderköp/HYP-035 eller någon redan
  testad prisbaserad/redovisningsbaserad signal) - well-dokumenterad
  akademisk anomali (open market repurchase-litteraturen, Ikenberry/
  Lakonishok/Vermaelen-traditionen) aldrig testad i detta universum.
