result_summary: >
  FAILED RENT PA DEN AVGORANDE $100k-NIVAN (enda gating-villkoret,
  Sharpe>=0,55): 0,3072, klart under golvet (inte ett gransfall). Samma
  Sharpe-mönster på alla tre nivåer (0,31-0,34) - ingen kapacitetsspärr-
  räddning som i vissa tidigare hypoteser.

  DIAGNOS: CAGR ar faktiskt hyfsad vid lagre kapitalnivaer (16,45%/16,72%
  vid $100k/$1M) men Sharpen dras ner av en MYCKET hog volatilitet/MaxDD
  (-66,85% till -72,64% pa alla tre nivaer, informativt men allvarligt) -
  Calmar bara 0,11-0,25. $10M-nivan visar tydlig kapacitetsdegradering pa
  CAGR (7,69% mot $100k/$1M:s ~16,5%) utan att Sharpen forbattras
  (fortfarande 0,34) eftersom bade avkastning och risk faller ungefar
  proportionellt.

  531 avslutade positioner over 64 kvartal (16 ar) - lagre omsattning an
  manga andra registerhypoteser, konsistent med att signalen ar ARSVIS
  (10-K-baserad, forward-fylld ett helt ar) snarare an kvartalsvis
  uppdaterad, sa decilens sammansattning ar relativt trog/sticky mellan
  kvartal - INTE ett tecken pa ett trasigt/tomt urval (feasibility-
  kollen fore lasning visade 117-434 kvalificerande namn/ar).

  OOS-2025: blandat och svagt - negativt vid $100k (-48,47%, varsta
  MaxDD i hela testet -70,13%), nastan noll vid $1M/$10M (+1,75%/-0,02%).
  Ingen kapitalnivakonsistens i OOS heller.

  SLUTSATS: aterkopsintensitet som RA, ohedgeAD signal ger inte
  tillrackligt riskjusterad avkastning i detta small-cap-universum - hog
  volatilitet/MaxDD ater upp en annars respektabel CAGR. Konsistent med
  ett annat monster an de flesta tidigare FAIL i registret (dar Sharpen
  oftast var lag pga svag/negativ RA avkastning) - har ar bruttoresultatet
  faktiskt högt, men riskprofilen for hog for att kvalificera. HYP-047/056
  forblir referensen, oforandrad. Ingen krasch-overlay eller riskverktyg
  testades har (samma "ra signal forst"-monster som HYP-015/017,
  HYP-024/HYP-017 osv) - om aterkop ska tas vidare kraver det en egen,
  separat last overlay-hypotes, inte en automatisk fortsattning.
