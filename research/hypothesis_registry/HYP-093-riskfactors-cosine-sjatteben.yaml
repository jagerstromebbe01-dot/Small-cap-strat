pass_fail_criterion: >
  MEKANISM (fullt specificerad, inga fria parametrar utom
  pass/fail-siffrorna som CEO fyller i nedan):

  DATAINSAMLING (KONVENTION, återanvänder HYP-091:s verifierade metod
  oförändrad): för varje bolag i universumet, vid varje 10-K-inlämning,
  hämta primärdokumentet (submissions-API + Archives-URL, samma mönster
  som HYP-072-familjen) och extrahera Item 1A-sektionen via den testade
  VERSAL-rubrik-heuristiken (html.unescape() FÖRE sökning, matcha mot
  versalt "ITEM 1A. RISK FACTORS"-mönster, avgränsa mot nästa
  versala "ITEM 1B"). Coder MÅSTE stickprovsverifiera extraktionen mot
  minst 20 slumpmässigt valda bolag/år INNAN resultat litas på - detta
  är en hård förutsättning, inte en rekommendation, given den kända
  TOC-brus-risken.

  SIGNAL: cosine-likhet på TF-IDF-viktade ordvektorer (standard
  scikit-learn-implementation, engelska stoppord borttagna, inga
  ytterligare fria val) mellan detta årets och föregående årets Item
  1A-text, SAMMA bolag. Bolag utan en föregående 10-K att jämföra mot
  exkluderas det året (inget värde, inte ett nollvärde).

  OMBALANSERING (KONVENTION, kvartalsvis - avviker MEDVETET från
  HYP-091:s skiss om "händelsestyrd" ombalansering för
  implementerbarhet/konsistens med registrets etablerade
  snap_rebalance_dates-mönster): vid varje kvartalsslut, använd det
  SENAST KÄNDA likhetsvärdet per bolag (från dess senaste 10-K, om
  filat inom de senaste 450 kalenderdagarna - annars exkluderas bolaget
  den kvartalsperioden som "för gammal data", samma stalenessprincip
  som redan används i small-cap-universumkonstruktionen).

  PORTFÖLJKONSTRUKTION (denna variant): tredjedelsindelning på
  likhetsvärdet. LÅNG den ÖVRE tredjedelen (mest STABILT riskspråk),
  SHORT den NEDRE tredjedelen (mest FÖRÄNDRAT riskspråk - akademiskt
  kopplat till sämre framtida avkastning, Cohen/Malloy/Nguyen 2020).
  Likaviktat inom varje ben, dollar-neutralt mellan benen. Fristående
  ben, testas STANDALONE här - INTE kombinerat med någon annan
  hypotes (en eventuell framtida kombination är sin egen, separat
  pre-registrerade hypotes med eget K, per spec §5b).

  FRIKTION: standardmetodiken (Corwin-Schultz halva spreaden + samma
  borrow-kostnadsmodell som resten av registret för kortbenet).

  PASS KRÄVER BÅDA, PÅ $100K-NIVÅN (huvudperioden, CEO-LÅST, enhetlig
  bar för alla 8 BATCH-004-kandidater):
  1. Sharpe (friktionsjusterad) > 0,70.
  2. MaxDD inte sämre än -30,0%.
  FAIL om något villkor faller vid $100k-nivån. $1M/$10M + OOS-2025:
  obligatorisk, icke-gating disclosure (samma mönster som HYP-089/090).
  Baseline-jämförelse (ofiltrerat universum): informativ disclosure,
  INTE ett tredje gating-villkor (CEO-LÅST beslut).
