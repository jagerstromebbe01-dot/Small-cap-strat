result_summary: >
  FAILED PÅ BÅDA VILLKOREN, KRAFTIGT, PÅ ALLA KAPITALNIVÅER. Sharpe
  -6,06/-6,06/-6,01. MaxDD -100,0% (portföljvärdet komprimerades till
  ~1,4e-20 av startkapitalet - beräkningsmässigt utplånat, inte bara
  en dålig period). CAGR -99,95%/-99,95%/-99,94%. DSR i praktiken noll.

  VIKTIGT - DETTA ÄR INTE ETT "INGEN ALFA HITTAD"-RESULTAT, det är ett
  FRIKTIONS-DOMINERAT resultat, och grundorsaken är identifierad och
  disclosad fullständigt istället för att bara rapporteras som ett
  platt FAIL:

  Under implementationen hittades OCH ÅTGÄRDADES (INNAN resultatet
  ovan beräknades, samma disclosure-standard som redan etablerad i
  detta registret för datafel) ett genuint datafel: VET (VeChain)
  hade en ~99% "engångsdrop" 2018-08-04 (VEN->VET-tokenredenomination,
  aldrig återhämtad till den gamla prisnivån) som initialt gav
  MaxDD=-100%/Sharpe=-6 rent artificiellt. Åtgärdat genom att
  ÅTERANVÄNDA (inte omimplementera) strategies/common/data_hygiene.py::
  clean_price_matrix + mask_unrecovered_price_breaks - exakt samma
  modul och policy som redan används på small-cap-sidan (SSN-fallet).
  Efter denna sanering kvarstod IDENTISKT resultat (Sharpe -6,06 mot
  -6,05 fore) - datafelet var alltså INTE huvudorsaken, bara en
  bidragande artefakt som maskerade den riktiga.

  DEN RIKTIGA ORSAKEN (verifierad via veckologgen, se
  results/weekly_log_main_100000.csv): genomsnittlig FRIKTIONSKOSTNAD
  PER VECKA låg på 5,7-12,6% ÅRET RUNT, OBEROENDE av universumets
  storlek (lika hög 2023 med 8 mynt/ben som 2019 med 2,5 mynt/ben, se
  avg_weekly_friction_cost_by_year ovan). Det betyder att tvärsnitts-
  rankingen (ny oberoende 90-dagars OLS-skattning varje veckoslut)
  omsätter NÄRA HELA benen varje vecka - väldigt lite persistens i
  vilka mynt som rankas topp/botten från en vecka till nästa. Kombinerat
  med Corwin-Schultz-spreadskattningen (som gav 1,9-7,1% enkelriktad
  kostnad för en FULL positionsstorlek på dessa mynt, se sonderingen i
  filhuvudets historik) blir detta en veckovis kostnad som ÖVERSTIGER
  vad någon rimlig veckovis mean-reversion-signal kan generera i
  bruttoavkastning - resultatet är matematiskt oundvikligt utplåning
  inom 6-9 månader, i praktiken oberoende av om den underliggande
  signalen har genuin prediktiv kraft eller inte.

  Två separata, ej ömsesidigt uteslutande förklaringskomponenter,
  INTE isärskilda i denna körning (skulle kräva egna testfall):
  (a) Corwin-Schultz är kalibrerad för aktiers bid-ask-dynamik och kan
  överskatta cryptos verkliga spread, eftersom cryptos dagliga
  high-low-intervall domineras av genuin intradagsvolatilitet snarare
  än bid-ask-studs i högre grad än aktier - en känd, dokumenterad
  begränsning hos estimatorn för denna tillgångsklass, INTE
  verifierad kvantitativt här.
  (b) veckovis FULL ombalansering (hela benet byggs om varje
  veckoslut, ingen minsta hålltid) är en ovanligt hög omsättningstakt
  för en mean-reversion-strategi och skulle med VILKEN SOM HELST
  icke-trivial friktionsmodell ge hög kostnad.

  DSR: i praktiken 0 vid alla nivåer, K=86 - konsistent med att detta
  INTE är ett nästan-lyckat resultat nära bruset, utan ett mekaniskt,
  strukturellt friktionsproblem.

  KONSEKVENS: denna hypotes, EXAKT SOM LÅST, är formellt FAILED - inget
  villkor ändras i efterhand. Om marknadsneutral crypto ska prövas
  vidare krävs en NY, separat pre-registrerad hypotes med explicit
  omprövad ombalanseringsfrekvens och/eller friktionsmetodik (t.ex.
  lägre frekvens, minsta hålltid, eller en cryptospecifik
  spreadskattning istället för Corwin-Schultz) - INTE en efterhands-
  justering av denna redan låsta och testade kriteriet.
