id: HYP-089
date_registered: '2026-08-13'
title: "Marknadsneutral crypto: tvärsnitts-residual mot rullande OLS-betahedge, dynamiskt likviditetsfiltrerat universum"
universe: >
  DYNAMISKT, inte statiskt (skiljer sig medvetet från HYP-060-064:s
  fasta 5-coin-lista). Ett mynt kvalificerar sig för handel från och med
  det första kvartalsvisa universum-omvärderingsdatumet där BÅDA gäller:
    (a) minst 730 kalenderdagars sammanhängande prishistorik i EODHD:s
        eod/{TICKER}.CC-endpoint (ingen datalucka > 5 dagar),
    (b) rullande 90-dagars genomsnittligt dollarvolym (close × volume)
        >= $5 000 000/dag (CEO-LÅST NIVÅ).
  Universumet omvärderas KVARTALSVIS (samma snap_rebalance_dates-
  konvention som strategies/common/crypto_data.py använder för
  ombalansering). Mynt som slutar uppdateras (som UNI/MATIC, se nedan)
  faller ur universumet automatiskt via villkor (a) vid nästa
  omvärdering. GOLV: om färre än 6 mynt kvalificerar vid ett givet
  omvärderingsdatum (matematiskt minimum för meningsfulla tredjedelar,
  se mechanism nedan, minst 2 per sida) genomförs INGA handlingar den
  kvartalsperioden - föregående vikter behålls oförändrade till nästa
  omvärdering. Kandidatlista att initialt kontrollera universumkraven
  mot (INTE en fast handelslista - se datasonderingen i filhuvudets
  historik): BTC, ETH, LTC, XRP, DOGE, XLM, XMR, DASH, ETC, ADA, LINK,
  BCH, TRX, EOS, VET, FIL, MANA, XTZ, ZEC, ATOM, ALGO, AAVE, AVAX, NEAR,
  SAND, ICP, SOL, DOT (28 kandidater; UNI/MATIC exkluderade, stale data
  sedan 2025-04-17 resp. 2025-03-24, verifierat i datasonderingen).
small_cap_definition: >
  N/A - crypto spot, inget market cap-baserat universum (fundamentals/
  market cap ger 403 Forbidden på denna EODHD-nivå, samma begränsning
  som HYP-060-064). Likviditet (rullande dollarvolym) ersätter storlek
  som urvalskriterium, se universe-fältet.
data_range: >
  Huvudperiod: från det första kvartalsvisa omvärderingsdatumet där
  minst 8 mynt uppfyller universumkraven (exakt datum bestäms av
  Coder vid implementation - helt determinerat av redan låsta regler
  ovan, inget fritt val) till 2024-12-31. Genuin OOS-2025 därefter,
  samma konvention som resten av registret.
pass_fail_criterion: >
  KVARTALSVIS universum-omvärdering (se universe-fältet), VECKOVIS
  ombalansering av positioner inom det då gällande universumet
  (KONVENTION: samma veckocadence som HYP-056/HYP-061:s overlay-beslut,
  "vid VARJE veckoslut").

  Vid varje veckoslut: för varje kvalificerande mynt, rullande 90-
  kalenderdagars OLS-regression av myntets dagliga avkastning mot BTC:s
  dagliga avkastning (KONVENTION: samma 90-dagarsfönster som
  likviditetsfiltret för intern konsistens) → residual för
  veckoslutsdagen. Tvärsnitts-z-score av residualerna över samtliga
  kvalificerande mynt SAMMA vecka (BTC självt exkluderas ur
  long/short-benen - det är hedge-referensen, inte ett handlat mynt).

  Rangordning i TREDJEDELAR (KONVENTION: minsta indelning som ger
  minst 2 mynt per sida vid golvet på 6 mynt; deciler som används på
  small-cap-sidan kräver fler namn än detta universum realistiskt ger):
  long den nedre tredjedelen (mest negativa residualer), short den övre
  tredjedelen (mest positiva), mellersta tredjedelen flat. LIKAVIKTAT
  inom varje ben (KONVENTION: samma "naiv, ej in-sample-optimerad
  viktning" som CLAUDE.md:s kombinationstestnings-princip föreskriver).
  DOLLAR-neutralt mellan benen (lika stort $ long som $ short, INTE
  beta-viktat neutralt - enklaste, mest naiva konstruktionen; brutto
  beta-exponering mot BTC rapporteras som disclosure, se nedan).
  Bruttoexponering 1,0x long + 1,0x short (ingen extra hävstång).

  FRIKTION (KONVENTION: återanvänder exakt strategies/common/
  crypto_data.py::transition_cost - halva Corwin-Schultz-spreaden +
  0,15% EXCHANGE_FEE - på notional som flyttas vid varje veckovis
  ombalansering, inklusive dagar då universum-omvärderingen ändrar
  vilka mynt som är kvalificerade).

  ANNUALISERING: 365 dagar, INTE 252 (KONVENTION: samma som HYP-060-064,
  crypto handlas alla kalenderdagar).

  PASS KRÄVER BÅDA, PÅ $100K-NIVÅN (huvudperioden, CEO-LÅST):
  1. Sharpe (friktionsjusterad) > 0,70.
  2. MaxDD inte sämre än -25,0%.

  FAIL om något villkor faller vid $100k-nivån.

  $1M och $10M rapporteras som OBLIGATORISK, ICKE-GATING disclosure
  (samma "avgörande nivå + disclosure övriga"-mönster som HYP-088) -
  altcoin-likviditet vid $10M är en uttalad kapacitetsoro för denna
  hypotes specifikt, se motiveringen i utkastets historik.

  OOS-2025: rapporteras informativt, ej gating.

  OBLIGATORISK DISCLOSURE (icke-gating, direkt kopplat till hypotesens
  syfte - genuin marknadsneutralitet): korrelation av strategins
  dagliga avkastning mot (a) BTC buy-and-hold, (b) SPY buy-and-hold,
  över huvudperioden. Antal kvalificerande mynt per omvärderingsdatum
  över tid (visar om universumet faktiskt växer som avsett). Genomsnittlig
  brutto BTC-beta-exponering (se ovan, eftersom konstruktionen är
  dollar- inte beta-neutral). Andel kvartal där golvet (<6 mynt) slog
  till.

  Diagnostiskt syfte: testar om en genuint marknadsneutral (till
  skillnad från HYP-060-064:s samtliga riktade konstruktioner)
  tvärsnittsstrategi på ett breddat, likviditetsfiltrerat crypto-
  universum har en egen, oberoende alfakälla - och om den håller sig
  inom en tightare MaxDD-ram (-25%) som är rimlig för en hedgad
  konstruktion, till skillnad från riktade cryptostrategiers typiska
  -50%+ drawdowns.
