result_summary: >
  PASSED PA ALLA TRE LASTA VILLKOREN PA DEN AVGORANDE $100k-NIVAN.
  Villkor 1 (Deltest A Sharpe >= 0,55): 0,7704. Villkor 2 (Deltest A MaxDD
  >= -50%): -6,18% - ett av de basta MaxDD-talen i hela registret for en
  fristaende (icke-overlay) signal. Villkor 3 (Deltest B: long-only
  "undvik aktiva shelf-anvandare" Sharpe >= long-only "hall allt"-Sharpe):
  0,6725 >= 0,4999 - PASSAR TYDLIGT, vilket avgor Kallas 2:s (extern
  AI-kalla i konvergensanalysen) uttryckliga varning om att en positiv
  brutto-L/S-Sharpe kunde vara ren borrowkostnadsarbitrage: har ar
  LONG-benet ENSAMT (utan nagon kort sida alls) tydligt battre an att
  bara halla hela universumet, sa edgen ar INTE bara en kortsidesartefakt.

  Sharpen faller med kapitalniva (0,7704/0,7299/0,5123 vid 100k/1M/10M) -
  under 0,55-golvet vid $10M, men PASS/FAIL avgors per kriteriet enbart
  pa $100k-nivan (samma konvention som HYP-049/050/054) - manstret ar
  konsistent med registrets kapacitetsbegransningstes (ADV-kapacitetsspärren
  binder alltmer vid storre kapital).

  KODBUGG UPPTACKT OCH FIXAD 2026-08-12 (samma bugg som HYP-073, fore
  denna siffra faststalldes): forsta korningen visade Sharpe 0,74/0,72/0,67
  men detta byggde pa en storlekssattningsbugg dar det korta benets
  pool storleksattes mot `cash` (som obegransat vaxer av blankningslikvider
  fran REDAN OPPNA positioner). Fixad till att storleksatta mot AVSTAENDE
  kapacitet av capital_level. SIFFRORNA OVAN AR EFTER FIXEN (forbattrade
  faktiskt MaxDD markant, -6,18% mot tidigare -46,86%, eftersom den
  tidigare overexponeringen i det korta benet drev en storre del av
  drawdownen).

  SPARCHECK (efter fixen, innan slutgiltig PASS faststalldes): det mest
  extrema enskilda tradet i $100k-korningen (BRTXD, long, +25625% over en
  manad, 2020-08) verifierades manuellt mot rå OHLCV - en AKTA, gradvis
  micro-cap-uppgang over ~6 veckor (0,40 -> 137,20) med stigande verklig
  handelsvolym (fran hundratals till 100 000+ aktier/dag), INTE en frusen
  platå eller ett engangshopp av den typ som tidigare identifierade
  databuggar (ESSA/SSN/ABWND) visade. 74 av 12191 trades (0,6%) hade
  |avkastning| > 300% - en normal fetsvans-andel for en likaviktad
  small-cap-korg, inte en anomali.

  OBLIGATORISK DISCLOSURE: andel av eligible-universumet per manad
  (medelvarde over hela perioden): 16,6% "aktiv shelf-anvandare" (SHORT),
  50,5% "ren" (LONG), 32,97% exkluderad (varken/eller) - inga av
  grupperna forsumbart sma.

  DSR ej beraknad i denna korning (utanfor detta scope, kan laggas till av
  Overfitting Detector-rollen vid nasta registergranskning, K=71 vid
  lasningstillfallet).

  TILLAGG 2026-08-12 (DSR beraknad, samma dag, mot dagens k_total=71 -
  Overfitting Detector-rollens uppgift enligt CLAUDE.md, "recomputes
  Deflated Sharpe Ratio for all still-under-consideration hypotheses
  ... after every test"): beraknad pa deltest A:s (full_ls, den
  gatande delserien) dagliga avkastning, RF=2%/ar, K=71.
    $100k:  SR(per-period)=0,0455  skew=+13,95  kurt=366,2  DSR=0,7174
    $1M:    SR(per-period)=0,0419  skew=+0,90   kurt=24,8   DSR=0,5799
    $10M:   SR(per-period)=0,0321  skew=+0,60   kurt=14,5   DSR=0,3398

  TOLKNING: DSR pa den avgorande $100k-nivan (0,7174) ar MATTLIG, INTE
  i klass med HYP-047:s 0,96-0,98 - och faller kraftigt med kapitalniva
  (0,72 -> 0,58 -> 0,34), brantare an den rada Sharpen sjalv (0,77 ->
  0,73 -> 0,51), eftersom K-korrektionen samverkar med seriens
  avvikelse fran normalfordelning. SARSKILD FORSIKTIGHETSFLAGG: $100k-
  seriens EXTREMA kurtosis (366, mot 3,0 for en normalfordelning) och
  skevhet (+13,95) drivs i hog grad av samma fatal enskilda extrema
  dagar som BRTXD-spark-checken redan identifierade (se ovan) - ett
  fatal observationer dominerar seriens hogre moment kraftigt, vilket
  gor just DENNA DSR-siffra kansligare for enskilda extremobservationer
  an en typisk, jamnare avkastningsserie i registret. Inte ett tecken
  pa ett fel (spark-checken bekraftade redan att BRTXD-radata ar akta),
  men ett skal att lasa 0,7174 som "mattligt uppmuntrande, inte
  overtygande" snarare an nara-sakert genuin edge - ANNU en anledning
  (utover den redan noterade kapacitetsnedgangen) att inte skynda pa
  ett beslut om femte ben utan ytterligare robusthetskontroll (t.ex.
  DSR pa en vinsorerad/trimmad avkastningsserie, eller uteslutning av
  de mest extrema enskilda tradesen, for att se om slutsatsen haller).

  TILLAGG 2026-08-12 (robusthetskontroll, samma dag, INGEN K-kostnad -
  diagnostisk kontroll av redan lasta resultat, samma disciplin som
  HYP-037/HYP-039:s tidigare robusthetsdiagnostik): DSR omraknad pa
  vinsoriserad/trimmad version av deltest A:s dagliga avkastningsserie,
  K=71, alla tre kapitalnivaer.

    $100k:  bas DSR=0,7174 -> winsoriserad(1/99 pctl) DSR=0,6008 ->
            winsoriserad(0,5/99,5 pctl) DSR=0,6341 -> EXKL. DE 5 MEST
            EXTREMA DAGARNA HELT: DSR=0,5007 (fran SR 0,0455 till 0,0387
            per period, kurtosis fran 366,2 till 37,0).
    $1M:    bas DSR=0,5799 -> winsoriserad(1/99) DSR=0,6045 ->
            EXKL. TOPP-5: DSR=0,4528 (UNDER myntkast-tröskeln 0,50).
    $10M:   bas DSR=0,3398 -> EXKL. TOPP-5: DSR=0,2208.

  TOPP-5 MEST EXTREMA ENSKILDA DAGAR VID $100k (alla positiva, ingen
  negativ dag i topp-5): 2020-08-31 (+15,69%), 2020-08-24 (+14,91%),
  2020-08-27 (+11,48%), 2020-08-28 (+9,21%), 2020-08-25 (+5,95%) - FYRA
  AV FEM faller inom SAMMA enda vecka (24-31 augusti 2020), samma
  fonster som BRTXD-spark-checkens dokumenterade rally. Aterstoden av
  toppen (efter dessa fem) ar spridd over hela 2010-2025-perioden utan
  liknande klustring.

  SLUTSATS (viktig nyansering, INTE en status-andring - kriteriets egna
  lasta PASS-villkor innehaller inget DSR-golv, se ovan): en
  BETYDANDE del av $100k-nivans DSR (0,72 -> 0,50, ett fall pa 0,22)
  ar koncentrerad till EN enda augusti 2020-vecka, sannolikt sammanfallande
  med en kand period av extrem small-/micro-cap-spekulation (retail-
  handelsvag mitt i pandemin) snarare an jamnt spridd genom hela
  15-arsperioden. Vid $1M faller DSR UNDER 0,50 (myntkast-nivan) nar
  samma fem dagar exkluderas - ett tydligt observandum. Detta gor INTE
  HYP-072 till en databugg (BRTXD-radata redan verifierad akta, och
  klustringen ar en genuin historisk marknadsepisod, inte ett
  datafel) - men det flyttar den praktiska tolkningen fran "sannolikt
  genuin, bred edge" till "en genuin men KONCENTRERAD edge, delvis
  beroende av en ovanlig historisk episod" - relevant bade for
  beslutet om femte ben (om den historiska episoden inte upprepas,
  kan den framtida Sharpen/DSR:n likna den trimmade snarare an den
  rapporterade) och for eventuell framtida kombinationshypotes
  (korrelationen mot ovriga ben under just den augusti 2020-veckan bor
  kollas separat innan naiv viktning antas vara representativ).

  Diagnostiskt: ANTICIPERAT, ej realiserat framtida aktieutbud (shelf-
  registreringsaktivitet) ar en genuin, per-aktie, orthogonal
  prissattningsmekanism i small-cap - till skillnad fran HYP-071:s
  REALISERADE nettoemissions-overlagg (FAILED, marknadsbred aggregat-
  signal). Forsta genuint nya, fristaende (icke-overlay, icke-momentum,
  icke-vol) avkastningskallan som PASSAR i detta register sedan HYP-047
  (bear catcher, trendfoljande). Kandidat till att bli ett FEMTE ben i
  portfoljen - kraver explicit CEO-beslut, inte gjort automatiskt har.
