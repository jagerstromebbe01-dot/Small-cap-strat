#
# MEKANISMANALOGI: när en aktie växer FRÅN micro-cap ($<100M) IN i
# small-cap-bandet ($100M-$2B) blir den nyligen behörig för visst
# institutionellt mandat/screener-synlighet - en svagare, kontinuerlig
# variant av samma "tvångsflöde vid nyupplåst tillgänglighet"-mekanism
# som HYP-052 (Russell-inklusion/-exklusion) ville testa men blockerades
# av databeroende. Denna variant kräver INGEN extern data - "graduering"
