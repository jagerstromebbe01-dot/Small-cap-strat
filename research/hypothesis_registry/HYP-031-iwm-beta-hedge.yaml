  oforandrad (0.71/0.74/0.71 mot 0.72/0.75/0.72 - marginellt lagre,
  inte statistiskt meningsfullt skilt).

  TOLKNING: den teoretiska oron (mega-cap-hedge mot micro/small-cap-book
  ger basis-risk som ar ren kostnad) visade sig INTE materialisera sig
  som en verklig fordel att fixa. Mojliga forklaringar (INTE testade
