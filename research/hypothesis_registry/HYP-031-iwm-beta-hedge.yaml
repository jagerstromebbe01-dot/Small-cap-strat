  lagre egen brus kan i praktiken ge en RENARE, mindre volatil
  hedgesignal an IWM, vilket vager tyngre an den teoretiska basis-risk-
  fordelen; (c) 126-dagars rullande beta-fonstret kanske redan
  absorberar det mesta av den systematiska skillnaden mellan mega- och
  small-cap-rorelser, sa den faktiska basis-risken var mindre an
  teorin antydde.

