title: "Naiv 80/20-kombination (kvartalsvis ombalanserad) - HYP-056 (befintlig referensportfölj) + HYP-075 (femte ben)"
universe: "N/A - portföljnivå-kombination av två REDAN KÄNDA, REDAN
  INDIVIDUELLT TESTADE avkastningsserier (HYP-056:s färdiga, vol-målsatta
  fyrabensportfölj + HYP-075:s färdiga positionstaks-variant av
  dilution pipeline-signalen). Ingen ny small-cap-signal, ingen ny
  backtest-motor - ren portföljmatematik, samma princip som
  HYP-039/041/043/044/045/046/047."
small_cap_definition: "N/A - se ovan, ingen ny small-cap-signal."
data_range: "Samma period som HYP-056/HYP-075:s redan beräknade serier
  (2010-01-01 till 2025-12-31, sammanslaget grund-/2025-utökningsuniversum),
  slicat till det gemensamma överlappande datumintervallet."
pass_fail_criterion: >
  MEKANISM (låst, inga fria parametrar kvar att välja):

  Portfölj = 80% notional i HYP-056:s redan färdiga, redan vol-målsatta
  portföljvärdesserie (oförändrad) + 20% notional i HYP-075:s
  portföljvärdesserie (oförändrad, samma kapitalnivå). Ombalanserat till
  EXAKT 80/20 VARJE KVARTAL (samma REBAL_FREQ="QE" och samma 10
  baspunkters omallokeringskostnad på det omallokerade beloppet som
  redan etablerat och identiskt återanvänt i HYP-039/041/043/044/045/
  046/047, för konsekvens).

  80/20-VIKTEN ÄR EN NAIV, EJ OPTIMERAD "EN-AV-FEM-BEN"-VIKT (per spec
  §5b:s krav på naiv likaviktning, inte in-sample-optimerade vikter):
  HYP-056 paketerar redan fyra befintliga ben (index, idio-vol+krasch,
  momentum L/S, bear catcher) tillsammans som EN enhet; HYP-075 är det
  femte, tilldelat samma vikt PER BEN (1/5 = 20%) som om alla fem
  vägdes lika var för sig - INTE en vikt vald efter att ha sett hur
  kombinationen presterar.

  PASS KRÄVER, PÅ ALLA TRE KAPITALNIVÅER:
  1. Sharpe (huvudperiod, med kombinationen) >= HYP-056:s EGEN redan
     uppmätta Sharpe (1,2228/1,2177/1,1923).
  2. MaxDD (huvudperiod, med kombinationen) BÄTTRE än HYP-056:s EGEN
     redan uppmätta MaxDD (-5,92%/-6,02%/-5,64%).

  FAIL om något villkor faller på någon nivå.

  OBLIGATORISK DISCLOSURE (icke-gating): OOS-2025 Sharpe/MaxDD för
  kombinationen jämfört med HYP-056:s egna OOS-2025-tal
  (1,7585/1,7379/1,7579), samt korrelationstalen mot leg 2/3/4 som redan
  redovisas i denna fils huvudkommentar ovan.

  Diagnostiskt syfte: testar om HYP-075 (validerad, låg-korrelerad,
  koncentrationsriskfixad variant av HYP-072) FAKTISKT förbättrar den
  redan starka referensportföljen när den läggs till naivt - inte bara
  om den ser bra ut på egen hand isolerat.
