result_summary: >
  PASSED PA BADA VILLKOREN, PA ALLA TRE KAPITALNIVAER. Sharpe
  1,3756/1,3469/1,3056 - klart over HYP-056:s egna 1,2228/1,2177/1,1923
  pa alla nivaer. MaxDD -4,20%/-4,26%/-3,98% - klart battre an HYP-056:s
  egna -5,92%/-6,02%/-5,64% pa alla nivaer. BADA matten forbattras
  SAMTIDIGT - till skillnad fran HYP-046:s tidigare fynd (dar tva
  riskreducerande ben kombinerade gav SAMRE Sharpe trots battre MaxDD),
  ar detta en akta, additiv forbattring pa bade avkastning OCH risk, INTE
  bara en riskreducering som rakar se bra ut pa ett matt.

  OOS-2025: Sharpe 1,6875/1,7256/1,8418 mot HYP-056:s egna
  1,7585/1,7379/1,7579 - jamforbart (nagot under vid 100k/1M, nagot over
  vid 10M), inte en dramatisk overprestation som bara syns i urvalet -
  stodjer att huvudperiodens forbattring inte ar en overanpassning.

  KORRELATIONSKONTROLL (fore lasning, se huvudkommentaren): HYP-075 mot
  leg 2 (HYP-037) -0,0435, leg 3 (HYP-043) +0,0134, leg 4 (HYP-047)
  +0,1129, hela HYP-056 -0,0168 - alla nara noll, konsistent med att en
  naiv tillagging faktiskt hjalper (lag korrelation ar precis den
  mekanism som gor att bade Sharpe och MaxDD kan forbattras samtidigt av
  en femte, oberoende avkastningskalla).

  Diagnostiskt: HYP-075 (den koncentrationsriskfixade varianten av
  HYP-072) FUNGERAR genuint som ett femte, additivt ben - inte bara pa
  egen hand isolerat utan aven i kombination med den redan starka
  referensportfoljen. Detta ar den STARKASTE kombinationshypotesen i
  registret sedan HYP-047 (som blev fjarde benet) - kraver dock, som
  alltid, ett explicit CEO-beslut for att faktiskt bli den nya
  referensen, inte automatiskt har.
