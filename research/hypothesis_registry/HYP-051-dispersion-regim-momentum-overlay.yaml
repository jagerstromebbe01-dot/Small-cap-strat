pass_fail_criterion: >
  MEKANISM (låst, inga fria parametrar):

  REGIMINDIKATOR: daglig tvärsnitts-standardavvikelse av samtliga eligible-
  namns dagliga avkastningar (INTE tidsserie-volatilitet för ett enskilt
  index - genuint tvärsnittsmått, beräknat separat varje handelsdag över
  hela det aktuella månadens eligible-universum). Rullande 2-års (504
  handelsdagars) percentil av detta mått.

  TRIGGER: när dagens tvärsnittsdispersion faller under sin egen 20:e
  percentil (extremt LÅG dispersion - tecken på att korrelationen mellan
  namn stigit och den idiosynkratiska drivkraften momentum L/S-sviten
  bygger på är svagare än normalt), HALVERAS nettoexponeringen (både
  long- och kortbenet) i momentum L/S-sviten tills dispersionen åter
  överstiger 20:e percentilen. Kontrolleras VARJE handelsdag, appliceras
  vid nästa handelsdag efter trigger.

  Momentum L/S-sviten i övrigt HELT OFÖRÄNDRAD (samma 12-1-månaders
  signal, decilstorlek, kvartalsvis ombalansering, friktion som HYP-043:s
  redan korrigerade, spreadinklusive variant).

  PASS KRÄVER, PÅ DEN AVGÖRANDE $100k-NIVÅN (rapporteras för alla tre):
  1. Sharpe för sviten MED overlay > sviten UTAN overlay (HYP-043:s egen
     isolerade, fullt korrigerade momentum L/S-serie, se dess DEL A/E-
     tilläggsnoter för referensvärdet).
  2. MaxDD för sviten MED overlay INTE sämre än UTAN.

  FAIL om något villkor faller vid $100k.

  Diagnostiskt syfte: testar om en tvärsnittsstruktur-baserad regimsignal
  (skiljer sig från alla redan använda pris-nivå-kraschtriggrar) kan
  skydda momentum L/S-sviten specifikt under perioder då dess grundtes
  (idiosynkratisk, aktiespecifik prisbildning) är som svagast.
