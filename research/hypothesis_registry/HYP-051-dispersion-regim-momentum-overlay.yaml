result_summary: >
  FAILED PA BADA VILLKOREN, VID ALLA TRE KAPITALNIVAER (identiskt over
  nivaerna - denna konstruktion, precis som HYP-043s egen sviten, har
  ingen ADV-kapacitetsspärr som gor resultatet kapitalnivaberoende).

  Villkor 1 (Sharpe MED overlay > Sharpe UTAN overlay): FAIL. MED
  dispersionsoverlay: Sharpe -0.1013. UTAN (HYP-043:s egen isolerade,
  fullt korrigerade momentum L/S-serie fran DEL E,
  momentum_ls_sleeve_pv.csv i results_corrected_2026-08-08/): Sharpe
  +0.0184. Overlayn gjorde sviten SAMRE, inte battre - fran ett redan
  svagt positivt tal till ett negativt.

  Villkor 2 (MaxDD MED overlay inte samre an UTAN): FAIL. MED overlay:
  -73.00%. UTAN: -72.35%. Overlayn andrade i praktiken inte den
  strukturella MaxDD:n (bada extremt djupa for den ISOLERADE,
  odiversifierade sviten - jfr HYP-043:s egen KOMBINERADE tredjedels-
  portfolj, dar samma svit bidrar till en portfolj-Sharpe pa 0.88 och en
  portfolj-MaxDD pa -15%, en helt annan risknivа nar den blandas med
  SPY/HYP-037-benen).

  Determinismkontroll: den lokalt aterberknade UTAN-overlay-serien
  (Sharpe 0.0184, MaxDD -72.35%) matchar HYP-043s egen sparade referens
  exakt - ingen skillnad, konstruktionen ar korrekt aterskapad.

  DSR (K=50, RF=2%/ar, MED overlay-serien) = 0.0039 - i praktiken noll,
  konsistent med en negativ rа Sharpe.

  OOS-2025 (informativt, ej gating): MED overlay Sharpe 1.7320 (MaxDD
  -20.66%), UTAN overlay Sharpe 1.5623 (MaxDD -29.74%) - i OOS-perioden
  hade overlayn faktiskt HJALPT (battre Sharpe OCH battre MaxDD), rakt
  motsatt monster mot huvudperioden. Overlayn var aktiv (halverad
  exponering) 593 av 3710 handelsdagar (16.0%) over hela perioden.

  DIAGNOS: tvarsnittsdispersionens 20:e percentil-trigger fångar en
  TILLRACKLIGT ovanlig regim (16% av dagarna, klart mer sällsynt an
  HYP-048s 47%-troskel) men halveringen av exponeringen visar sig i
  praktiken INTE skydda mot momentum-sviten-sarskilda risken under
  huvudperioden - konsistent med registrets etablerade monster att rena
  OMFÖRDELNINGS-/exponeringsjusterings-forsok utan en genuin regimbytes-
  mekanism (till skillnad fran HYP-017/023/037/047s prisniva-
  krasch-triggar, som alla ar PASSED) tenderar att misslyckas. Den
  omvanda OOS-2025-riktningen (dar overlayn faktiskt hjalper) understryker
  att detta INTE ar ett robust, generaliserbart skydd - bara en
  huvudperiod/OOS-diskrepans, INTE grund for att ompröva det redan
  lasta, FAILADE kriteriet i efterhand.
