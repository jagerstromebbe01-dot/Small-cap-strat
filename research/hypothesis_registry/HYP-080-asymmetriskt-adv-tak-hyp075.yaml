  MaxDD och kurtosis PASSERADE bada (-5,94% respektive 7,9).

  DIAGNOS: det striktare taket (5%/3% mot HYP-075:s 10%/10%) band redan
  vid $100k - 39 av 8582 long-entries och (mer betydande) 69 av 3849
  short-entries begransades av det NYA, striktare taket vid just denna
  lagsta kapitalniva, dar den GAMLA 10%-spärren knappt nagonsin band.
  Detta kostade avkastning vid $100k utan att ge en tillrackligt stor
  kapacitetsforbattring vid $10M for att kompensera - kvoten forbattrades
  bara marginellt (0,7945 -> 0,7975).

  SLUTSATS: hypotesen att "kapacitetsnedgangen kan losas med en
  striktare hard ADV-sparr" var FEL, atminstone vid dessa lasta
  trosklar (5%/3%) - regeln var for aggressiv redan vid den lagsta
  kapitalnivan, dar problemet den var avsedd att losa (kapacitetsforlust
  vid HOG kapitalniva) knappt existerar an. Detta stodjer indirekt
  ChatGPT:s alternativa forslag i samma brainstormrunda (kontinuerlig
  sqrt(ADV)-viktning istallet for en hard cutoff) som en mer lovande,
  men annu otestad, riktning for just kapacitetsfragan - ej byggd har,
