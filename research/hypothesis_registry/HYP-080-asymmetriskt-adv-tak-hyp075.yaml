pass_fail_criterion: >
  MEKANISM (låst, inga fria parametrar kvar att välja):

  Bygger direkt på HYP-075:s redan låsta signal, klassificering och
  positionstak (3x-trimning). ENDA ÄNDRINGEN: ersätt HYP-075:s
  befintliga, symmetriska ADV-kapacitetsspärr (MAX_ADV_PCT=10% för båda
  benen) med en STRIKTARE, ASYMMETRISK spärr:
    - LONG-benet: maximal positionsstorlek = min(likaviktad målsumma,
      5% av 20-dagars genomsnittlig dollarvolym).
    - KORT-benet: maximal positionsstorlek = min(likaviktad målsumma,
      3% av 20-dagars genomsnittlig dollarvolym) - striktare, motiverat
      av att blankning i small-cap är mer kapacitetskänsligt
      (lånekostnad, recall-risk, squeeze-risk - se D'Avolio 2002,
      redan citerad i candidate_ideas.md).
  Tillämpas identiskt vid varje månatlig ombalansering OCH vid varje
  daglig trimningsexekvering (positionstaket kan aldrig trimma UPP till
  en storlek som redan bryter mot detta kapacitetstak - trimningen
  klipper alltid NER, aldrig upp, så detta villkor kan i praktiken bara
  bli bindande vid NYA entries, inte vid trimningar, men nämns här för
  fullständighet).

  Ingen annan förändring av signal, entry/exit, hållperiod eller
  branschregler.

  MOTORKRAV: identiska med HYP-075.

  PASS KRÄVER ALLA FYRA, PÅ DEN AVGÖRANDE $100k-NIVÅN (rapporteras för
  alla tre kapitalnivåer), DÖMT MOT HYP-075:S EGNA REDAN UPPMÄTTA TAL:
  1. Sharpe (huvudperiod) >= 0,8065 (HYP-075:s egen Sharpe vid $100k).
  2. MaxDD INTE sämre än -6,05% (HYP-075:s egen MaxDD).
  3. Sharpe med HELA kalenderåret 2020 exkluderat >= 0,7737.
  4. Kurtosis för den dagliga avkastningsserien (hela huvudperioden,
     $100k) < 9,24 (samma 20%-tolerans som HYP-079, låst i förväg).

  UTÖVER DE FYRA STANDARDVILLKOREN, ETT FEMTE, RIKTAT VILLKOR (denna
  hypotes eget syfte - kapacitetsnedgången):
  5. Kvoten Sharpe($10M) / Sharpe($100k) MÅSTE VARA STÖRRE än HYP-075:s
     egen uppmätta kvot (0,6408 / 0,8065 = 0,7945) - dvs. Sharpen ska
     falla PROPORTIONELLT MINDRE med stigande kapital än i HYP-075.

  FAIL om något av de fem villkoren faller.

  OBLIGATORISK DISCLOSURE (icke-gating): andel av nya entries per ben
  som faktiskt begränsades av det nya, striktare taket (jämfört med hur
  många som skulle begränsats av HYP-075:s gamla 10%-tak).

  Diagnostiskt syfte: testar direkt om HYP-075:s fallande Sharpe med
  kapitalnivå är en likviditets-/kapacitetseffekt som kan dämpas med en
  striktare, asymmetrisk (kortbens-fokuserad) handelsstorleksregel -
  inte en signal- eller riskkoncentrationsfråga (det är HYP-079:s
  syfte).
