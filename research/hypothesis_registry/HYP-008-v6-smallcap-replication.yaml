title: "v6-kärna replikerad på small-cap-universum"
universe: "small-cap, $100M - $2B börsvärde, EODHD All-World som datakälla"
small_cap_definition: "$100M - $2B börsvärde, EODHD All-World som datakälla"
data_range: "EODHD All-World, så lång historik som täckningen tillåter (mål 2010-2024)"
# LÅST 2026-07-24 av CEO + användare tillsammans, innan någon backtest
# på small-cap-data körts. Se pass_fail_criterion nedan för fullständigt
# ordagrant kriterium.
pass_fail_criterion: >
  LÅST 2026-07-24, innan någon backtest på small-cap-data körts.
  v6-kärnan (identisk kod: beta-neutral OLS pair trading, ingen ejay,
  ingen Kelly, fast 5% positionsstorlek) körd på small-cap-universum
  ($100M-$2B börsvärde), EODHD All-World-data, så lång historik som
  täckningen tillåter (mål 2010-2024).
  PASS kräver ALLA följande på SAMTLIGA tre kapitalnivåer (100k/1M/10M):
  1. Sharpe efter borrow-kostnad och bid-ask-spread >= 0.55 (large-cap-
     basen) OCH >= 0.70 (absolut golv)
  2. Calmar >= 0.56 (large-cap-basen) OCH >= 0.60 (absolut golv)
  3. Kriteriet i (1) håller även efter att bästa enskilda traden
     exkluderats (skydd mot outlier-driven resultat)
  Om en kapitalnivå faller under: FAIL för den nivån, notera var edgen
  knäcks. Hela hypotesen = FAIL om inte alla tre nivåer klarar sig.

  FRIKTIONSMETODIK (tillägg LÅST 2026-07-26, innan någon backtest körs):
  - Bid-ask-spread: Corwin-Schultz-estimatorn (Corwin & Schultz, 2012),
    beräknad per aktie från rullande high/low-data. Applicera halva den
    skattade spreaden som kostnad vid varje trade-öppning, halva vid
    varje stängning.
  - Borrow-kostnad: fast 3% årlig ränta på det korta benets positions-
    värde, proportionellt mot faktisk hålltid per trade.
  Båda kostnaderna ska vara aktiva i ALLA backtest-körningar för denna
  hypotes - inte en valfri flagga, inte något som testas med/utan.
status: failed   # pre-registered -> tested -> passed/failed
