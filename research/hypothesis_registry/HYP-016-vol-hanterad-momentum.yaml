id: HYP-016
date_registered: '2026-07-29'
title: Volatilitets-hanterad cross-sectional momentum pa small-cap (uppfoljare till HYP-012)
universe: small-cap, $100M - $2B börsvärde, EODHD All-World som datakälla
small_cap_definition: small-cap, $100M - $2B börsvärde, EODHD All-World som datakälla
data_range: EODHD All-World, samma period som HYP-008/012 (2011-2024)
pass_fail_criterion: 'Samma universum/friktion/hedge/kapacitetsspärr, samma 12-1-manaders momentumsignal
  och samma manatliga ombalansering (ME) som HYP-012 (ga lang i toppdecilen). Enda metodskillnaden:
  positionsstorleken (bruttoexponeringen) skalas OMVANT mot momentumportfoljens EGEN nyligen realiserade
  volatilitet (Barroso & Santa-Clara 2015), i stallet for konstant fullinvesterad exponering varje manad.

  Volatilitets-skalning, exakt specificerad (INTE valfri, ingen efterhandsjustering av parametrar tillaten
  efter att resultat setts):
  - Realiserad volatilitet: rullande 126-handelsdagars (ca 6 manader) std av momentumportfoljens EGNA
    dagliga avkastningar (fore skalning), annualiserad (*sqrt(252)).
  - Malvolatilitet: FAST 20% annualiserat (valt a priori som ett runt, i litteraturen vanligt forekommande
    tal for aktie-long/short-strategier - INTE skattat fran denna backtests egna fullsampel-Sharpe, for
    att undvika minsta antydan till framatblick).
  - Skalningsfaktor_t = malvolatilitet / realiserad_volatilitet_(t-1), klippt till intervallet [0.2, 2.0]
    (forhindrar bade extrem hävstang och extrem avriskning).
  - Bruttoexponeringen (andelen kapital som allokeras till momentumpositionerna den manaden) multipliceras
    med denna faktor. Overskjutande/underskjutande kapital star i kassa till RF_ANNUAL (samma som ovriga
    hypoteser), tas INTE ut som separat hävstang.

  Friktion: Corwin-Schultz-spread + 3% arlig borrow-kostnad, identiskt med HYP-008/012 - AKTIV fran dag
  ett, inte valfri.

  MOTORKRAV (LOCKAT som en del av detta kriterium, inte valfritt - se granskningen 2026-07-29 som hittade
  dessa tre defekter delade med HYP-012/014):
  1. Ombalanseringsdatum SKA snappas till narmaste faktiska handelsdag via strategies/common/rebalancing.py
     (snap_rebalance_dates) - INTE rakt av kalender-periodslutsetiketter fran resample().last().index,
     vilket tystnar ~29% av alla manatliga ombalanseringar.
  2. Avkastnings-/momentumberakning SKA anvanda adjusted_close-kolumnen (redan i cachen, tidigare oanvand),
     INTE ra close, for att undvika falska momentumspikar fran ojusterade aktiesplitar (se ARDMQ-fallet,
     +3923% pa en manad, som visade sig vara en icke split-justerad 1-for-40 omvand split). Positionsvarde/
     exekvering far fortsatta anvanda ra close.
  3. strategies/common/data_hygiene.py:s flag_implausible_liquidity() SKA anvandas (max_market_cap=2_000_000_000,
     window=20, multiplier=1.0) for att maska ticker-dagar med leverantors-datafel av ESSA-typ.

  PASS kraver BADA:
  1. Sharpe (efter friktion) >= 0.55 pa SAMTLIGA tre kapitalnivaer (100k/1M/10M).
  2. Maxdrawdown battre (mindre negativ) an -50% pa SAMTLIGA tre kapitalnivaer - detta ar INTE godtyckligt
     tillagt i efterhand, utan den direkta, forhandsspecificerade testen av om vol-skalning faktiskt
     tamjer den specifika kraschrisk (-72% till -78% MaxDD) som var HYP-012:s dokumenterade felorsak.
     Ett resultat som klarar (1) men inte (2) ar FAIL - hela poangen med denna hypotes ar att adressera
     just svansrisken, inte bara medelavkastningen.
  FAIL om nagon niva faller under nagotdera villkoret.

  Diagnostiskt syfte: HYP-012 hade en svagt positiv ra Sharpe vid lagre kapitalnivaer men kraschade pa
  maxdrawdown - en kand, dokumenterad "momentum crash"-signatur (Daniel & Moskowitz 2016). Barroso &
  Santa-Clara (2015) visar att just denna svansrisk, inte den genomsnittliga avkastningen, ar det som
  vol-skalning adresserar. Detta testar om den mekanismen racker for att fa small-cap-momentum over
  trosklen pa en korrigerad motor (adjusted_close + snappade ombalanseringsdatum + liquiditetsfilter),
  inte om momentum "fungerar" i nagon ny mening.'
status: failed   # pre-registered -> tested -> passed/failed
