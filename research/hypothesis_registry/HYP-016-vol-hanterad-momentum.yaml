result_summary: >
  FAILED på BÅDA villkoren (Sharpe och MaxDD) på samtliga tre
  kapitalnivåer. Sharpe 0.13/0.13/-0.08 - långt under 0.55-tröskeln.
  MaxDD -76.1%/-71.9%/-71.5% - vol-skalningen (Barroso & Santa-Clara)
  FÖRÄNDRADE KNAPPT MAXDRAWDOWN ALLS jämfört med den oskalade baslinjen
  (-78.0%/-76.2%/-71.3% utan skalning) - genomsnittlig bruttoexponering
  skalades ner till ~82-91% (mean_exposure_scale), men det räckte inte
  för att tämja kraschrisken. Slutsats: mekanismen som fungerade i
  Barroso & Santa-Claras ursprungliga (stor-cap) studie överför INTE till
  detta small-cap-universum - kraschperioderna här verkar inte
  föregås av tillräckligt förhöjd realiserad portföljvolatilitet för att
  126-dagars-fönstret ska hinna skala ner exponeringen i tid.

  VIKTIGT metodologiskt fynd (jämfört med HYP-012:s ursprungliga,
  buggiga resultat): på den KORRIGERADE motorn (adjusted_close
  genomgående, snappade ombalanseringsdatum, likviditetsfilter) är
  baslinjens (oskalade) Sharpe nu 0.13/0.12/-0.05 - INTE HYP-012:s
  ursprungliga 0.16/0.12/-0.01. Skillnaden är liten vid dessa nivåer
  eftersom ARDMQ-artefakten (den tidigare dominerande tradade) nu bokar
  en normal -16% förlust i stället för +3923% (bekräftat i trade_log) -
  men resultatet visar ändå kvarvarande extrem skevhet (skew 26-30,
  kurtosis 1170-1395 vid 100k/1M) fran andra, ej djupare undersökta
  enskilda trades - se noter.
