notes: >
  calmar_excl_best_trade är null (NaN) vid $100k/$1M - artefakt av
  best_trade_excluded_metrics() på en redan djupt stressad serie
  (MaxDD -76%): att subtrahera den bästa tradens dollar-P&L kan ge ett
  negativt portföljvärde vid någon tidpunkt i den justerade serien,
  vilket ger en odefinierad CAGR (bråkdels-potens av ett negativt tal).
  Paverkar inte huvudslutsatsen (Sharpe/MaxDD-kriterierna, som ar
  raknade pa den ojusterade serien). Kvarvarande hog skevhet/kurtosis i
  trade-fordelningen (se result_summary) ar EJ djupare undersokt -
  mojlig kandidat for en framtida data-hygien-granskning av samma typ
  som ESSA/ARDMQ/COL, men paverkar inte FAIL-slutsatsen har (bada
  kriterierna faller med bred marginal aven om en enskild trade skulle
  visa sig vara ytterligare en artefakt).
