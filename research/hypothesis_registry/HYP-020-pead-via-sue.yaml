title: PEAD via SUE (Standardized Unexpected Earnings) pa small-cap
universe: small-cap, $100M - $2B börsvärde, EODHD All-World som datakälla
small_cap_definition: small-cap, $100M - $2B börsvärde, EODHD All-World som datakälla
data_range: EODHD All-World for pris/friktion, SEC EDGAR companyfacts for EPS/filingsdatum, samma period 2011-2024
pass_fail_criterion: 'Aterananvander HYP-015:s motor (universum, friktion, SPY-hedge, kapacitetsspärr, de
  tre motorfixarna) - RENT SIGNALTEST, ingen krasch-overlay/stop-loss/vol-skalning, i linje med principen
  att utvardera en kandidatsignals egen edge FORE nagon riskoverlay (se konversationen 2026-07-30).

  Signal: SUE = (EPS denna kvartal - EPS samma kvartal foregaende ar) / std(de senaste 8 kvartalens
  motsvarande overraskning), Foster/Olsen/Shevlin (1984) "saisong-random-walk"-varianten - KRAVER INGEN
  analytikerkonsensus. Anvander URSPRUNGLIGA rapportens filingsdatum (tidigaste "filed"-varde per
  (fiskalar, fiskalkvartal), INTE periodens slutdatum och INTE senare omrakningar/andringar) for att
  undvika framatblick - signalen "blir kand" av marknaden forst da, snappad till FORSTA FAKTISKA
  HANDELSDAG PA ELLER EFTER filingsdatumet.

  Berattigande vid ombalansering: en ticker maste (a) vara i small-cap-universumet den manaden OCH
  (b) ha ett SUE-varde vars filingsdatum ligger inom de senaste ~63 handelsdagarna (~3 manader) - annars
  raknas signalen som inaktuell och tickern ar inte berattigad den manaden. Ga LANG i HOGSTA SUE-decilen
  (mest positiva earnings-overraskning), manatlig ombalansering (PEAD ar en snabbare-roterande signal
  an lagvol/storlek, samma konvention som HYP-012:s momentum anvander).

  Friktion: Corwin-Schultz-spread + 3% arlig borrow-kostnad, identiskt med HYP-008/012/015 - AKTIV fran
  dag ett. SPY-beta-hedge, samma kapacitetsspärr (MAX_ADV_PCT=0.10) som HYP-015.

  MOTORKRAV (samma tre som HYP-015/016/017/018/019, redan byggda i strategies/common/): snappade
  ombalanseringsdatum, adjusted_close genomgaende, flag_implausible_liquidity().

  PASS kraver Sharpe (efter friktion) >= 0.55 pa SAMTLIGA tre kapitalnivaer (100k/1M/10M). FAIL om
  nagon niva faller under.

  Diagnostiskt syfte: PEAD ar en av de mest robusta, replikerade anomalierna i den akademiska
  litteraturen (Bernard & Thomas 1989 och hundratals uppfoljande studier) - testar om den overlever
  i small-cap efter realistisk friktion, med en analytiker-oberoende SUE-definition som undviker
  EODHD:s Fundamentals-blockering helt.'
