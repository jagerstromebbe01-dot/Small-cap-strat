id: HYP-015
date_registered: '2026-07-29'
title: Idiosynkratisk volatilitet pa small-cap (uppfoljare till HYP-014)
universe: small-cap, $100M - $2B börsvärde, EODHD All-World som datakälla
small_cap_definition: small-cap, $100M - $2B börsvärde, EODHD All-World som datakälla
data_range: EODHD All-World, samma period som HYP-008/012/014 (2011-2024)
pass_fail_criterion: 'Samma universum/friktion/hedge/kapacitetsspärr och kvartalsvisa ombalansering som HYP-014.
  Signal: IDIOSYNKRATISK volatilitet i stallet for total volatilitet - dvs std av REGRESSIONSRESIDUALEN
  (daglig aktieavkastning minus beta*daglig SPY-avkastning, med beta fran den redan befintliga
  compute_beta()-funktionen, 126-dagars fonster, klippt till [-5,5]) over samma 120-dagars trailing-fonster
  som HYP-014 anvande for total std (Ang, Hodrick, Xing & Zhang 2006). Ga lang i LAGSTA idiosynkratiska-vol-decilen,
  kvartalsvis ombalansering (QE), samma som HYP-014.

  Friktion: Corwin-Schultz-spread + 3% arlig borrow-kostnad, identiskt med HYP-008/012/014 - AKTIV fran
  dag ett, inte valfri.

  MOTORKRAV (LOCKAT som en del av detta kriterium, inte valfritt - se granskningen 2026-07-29 som hittade
  dessa tre defekter delade med HYP-012/014):
  1. Ombalanseringsdatum SKA snappas till narmaste faktiska handelsdag via strategies/common/rebalancing.py
     (snap_rebalance_dates) - INTE rakt av kalender-periodslutsetiketter fran resample().last().index, vilket
     tystnar ~32% av alla kvartalsvisa ombalanseringar (se ESSA-fallet i HYP-014).
  2. Avkastnings-/volatilitetsberakning SKA anvanda adjusted_close-kolumnen (redan i cachen, tidigare oanvand),
     INTE ra close, for att undvika falska volatilitetsspikar fran ojusterade aktiesplitar (se ARDMQ-fallet
     i HYP-012). Positionsvarde/exekvering far fortsatta anvanda ra close.
  3. strategies/common/data_hygiene.py:s flag_implausible_liquidity() SKA anvandas (max_market_cap=2_000_000_000,
     window=20, multiplier=1.0) for att maska ticker-dagar dar leverantors-datafel (tickerkollisioner av
     ESSA-typ) ger orimlig dollarvolym relativt universumets marknadsvardesband - clean_price_matrix() ensam
     fangar INTE detta monster (se granskningen 2026-07-29).

  PASS kraver Sharpe (efter friktion) >= 0.55 pa SAMTLIGA tre kapitalnivaer (100k/1M/10M). FAIL om nagon
  niva faller under.

  Diagnostiskt syfte: HYP-014 visade en svag men matbar edge fran institutionella hävstångs-/
  benchmarkbegransningar via TOTAL volatilitet, men foll under trosklen och hade dessutom en dokumenterat
  overskattad Sharpe (ESSA-artefakten, en enda felaktig trade som stod for halva den rapporterade Sharpen).
  Idiosynkratisk volatilitet ar den i litteraturen starkare, renare formen av samma anomali (Ang et al. 2006)
  - detta testar om en mer prеcis signal, pa en korrigerad motor, tar sig over trosklen dar total-vol-varianten
  inte gjorde det.'
