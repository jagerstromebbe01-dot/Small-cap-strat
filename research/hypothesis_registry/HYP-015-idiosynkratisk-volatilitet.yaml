date_tested: 2026-07-29
result_summary: >
  FAILED på samtliga tre kapitalnivåer, men det BÄSTA resultatet av alla
  hypoteser testade hittills i projektet (över K=15 försök): Sharpe
  0.45/0.46/0.52, DSR 0.47/0.49/0.58 (samtliga högre än HYP-014:s
  ursprungliga 0.39/0.39/0.21 och DSR 0.35/0.37/0.18). Ovanligt mönster
  (delat med HYP-014): Sharpe OKAR med kapitalnivå (0.45 -> 0.52) snarare
  än att falla, motsatsen till nästan alla andra hypoteser i registret -
  sannolikt eftersom kapacitetsspärren (MAX_ADV_PCT) vid högre kapital
  tvingar bort de minst likvida/mest volatila namnen ur decilen, vilket
  händelsevis minskar just den typ av risk idiosynkratisk volatilitet
  ska fånga. Trade-ekonomin är stark (win rate 61%, profit factor 2.27,
  bättre än HYP-014:s redan goda 2.31... nästan identisk). Körd på en
  motor med TRE fixar jämfört med HYP-014: (1) ombalanseringsdatum
  snappade till faktisk handelsdag (ingen tyst överhoppning), (2)
  adjusted_close använd genomgående - även för positionsvärdering, INTE
  bara signalen (en kvarvarande split-artefakt, ticker "COL" +1362% i en
  första körning, upptäcktes och fixades innan detta slutresultat), (3)
  likviditets-rimlighetsfilter (488 ticker-dagar maskade totalt, inkl.
  ESSA som nu korrekt säljs 2023-06-30, FÖRE datafelet 2023-12-15, i
  stället för att rida igenom det som i HYP-014).
