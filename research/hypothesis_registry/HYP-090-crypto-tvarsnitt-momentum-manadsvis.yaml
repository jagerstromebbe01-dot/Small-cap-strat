result_summary: >
  FAILED PÅ BÅDA VILLKOREN, PÅ ALLA KAPITALNIVÅER - men MARKANT mindre
  katastrofalt än HYP-089. Sharpe -1,93/-1,93/-1,94 (mot HYP-089:s
  -6,06/-6,06/-6,01). MaxDD -99,97% (mot -100,00% - fortfarande i
  praktiken en total utplåning, bara marginellt mindre extremt). CAGR
  -73,70%/-73,70%/-73,79% (mot -99,95%). DSR i praktiken noll (K=87).
  OOS-2025 Sharpe -0,83 (avkastning -36,7%) - fortfarande klart
  negativt, men inte lika extremt som huvudperioden.

  DIAGNOS (jämfört mot HYP-089:s friktions-per-tillfälle, se dess
  registerpost): frekvensen sänktes framgångsrikt från ~52 till 73
  ombalanseringar över hela perioden (faktiskt 73 månatliga tillfällen
  över 6 år, mot HYP-089:s ~313 veckovisa) - en riktig ~4,3x minskning
  i ANTAL tillfällen friktion betalas. MEN genomsnittlig friktionskostnad
  PER TILLFÄLLE förblev nästan OFÖRÄNDRAD (9,4% snitt per månad, mot
  HYP-089:s 9,0% snitt per vecka - se avg_monthly_friction_cost_by_year
  ovan, konsekvent 6-13% varje år, ingen förbättrande trend över tid
  trots växande universum). Det betyder att 30-dagars-snittningen av
  residualen INTE gav den förväntade ökningen i rangordningens
  persistens månad till månad - benen byggs fortfarande om nästan i
  sin helhet varje ombalanseringstillfälle, oavsett om det sker
  veckovis eller månadsvis. Nettoeffekten: total friktionskostnad över
  hela perioden sjönk (färre tillfällen vann över nästan oförändrad
  kostnad per tillfälle), vilket förklarar varför resultatet är
  betydligt MINDRE extremt än HYP-089 (Sharpe -1,93 mot -6,06) - men
  inte tillräckligt för att komma i närheten av de låsta villkoren
  (Sharpe>1,00, MaxDD>=-25%).

  SLUTSATS: att bara sänka ombalanseringsfrekvensen adresserar
  ANTALET friktionstillfällen, inte TURNOVER PER TILLFÄLLE - dessa är
  två separata problem, och denna körning löste bara det förra. Den
  bakomliggande instabiliteten i tvärsnittsrangordningen (vilka mynt
  som hamnar i topp/botten-tredjedelen) verkar bestå även vid en
  30-dagars-utjämnad signal och månadsvis hålltid, inte bara vid
  HYP-089:s enskilda-dags/veckovisa konstruktion.

  KONSEKVENS: denna hypotes, EXAKT SOM LÅST, är formellt FAILED. En
  eventuell tredje uppföljningshypotes skulle behöva adressera TURNOVER
  PER TILLFÄLLE direkt (t.ex. en minsta hålltid/hysteresbrand som
  hindrar en position från att bytas ut om inte signalen flyttat sig
  förbi en tydlig marginal, inte bara lägre frekvens) - INTE ännu en
  ren frekvenssänkning, och INTE en efterhandsjustering av denna redan
  låsta och testade kriteriet.
