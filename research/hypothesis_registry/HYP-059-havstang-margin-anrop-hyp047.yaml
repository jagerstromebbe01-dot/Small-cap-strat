result_summary: >
  PASSED PA ALLA TRE VILLKOR, PA ALLA TRE KAPITALNIVAER (inte bara den
  avgorande $100k-nivan). Sharpe 1.0348/1.0348/1.0041 (villkor 1, >=1.0),
  CAGR 11.01%/10.92%/10.07% mot HYP-047:s egna 8.56%/8.52%/7.95% + 2.0pp-
  kravet (10.56%/10.52%/9.95%) - PASS pa alla tre, om an $10M med minsta
  marginalen (0.12pp). MaxDD -13.12%/-12.80%/-12.40%, klart innanfor
  -20%-taket (villkor 3).

  KRITISK, OPPET REDOVISAD NYANS: pa den LASTA gating-konfigurationen
  (1,5x, konservativ spread) TRIGGADE MARGINALANROPS-MEKANISMEN ALDRIG
  (0 anrop, 0.0% av dagarna under malhafstangen, PA ALLA TRE NIVAER).
  Detta PASS ar darfor i praktiken IDENTISKT med vad en ren statisk-
  spread-modell (utan marginalanrop) skulle ha gett vid 1,5x - den
  extra friktionsmekanismen som byggdes for detta test bidrog INGET
  till just detta resultat. Marginalanropen borjar bara trigga (0-2
  ganger) vid 1,75x-2,0x, INTE vid den lasta 1,5x-nivan - se disclosure
  nedan. Detta ar EXAKT den kanda reservation som redan stod i
  registerpostens header innan lasning (mekanismen kraver en djupare
  drawdown an HYP-047:s diversifierade bok historiskt haft, aven med
  1,5x hafstang pa toppen) - bekraftad, inte motbevisad, av resultatet.

  DISCLOSURE (icke-gating, alla nivaer):
  - Stressad spread (4,5%/ar totalt, samma 1,5x): Sharpe faller UNDER
    1,0 pa ALLA TRE nivaer (0.9467/0.9459/0.9089) - resultatet ar
    kansligt for finansieringsspread-antagandet, INTE robust mot en
    dyrare lanekostnad.
  - 1,25x (bagge spreadantaganden): Sharpe 1.02-1.07, CAGR 8.6-9.8%,
    0 marginalanrop - lagre risk, lagre lyft.
  - 1,75x: Sharpe 0.88-1.01, CAGR 10.4-12.1%, 0-1 marginalanrop
    (8.0-8.5% av dagarna under mal vid $100k/$1M, 0% vid $10M).
  - 2,00x: Sharpe 0.83-0.98, CAGR 10.1-12.6%, 1-2 marginalanrop
    (10.6-19.7% av dagarna under mal) - hogsta CAGR men Sharpe under
    1,0 i tre av fyra spread/nivakombinationer.

  DSR vid K=58: 0.9311/0.9313/0.9145 - hogt, konsistent med ett genuint
  positivt resultat snarare an en slumptraff, trots ett redan hogt K.

  SLUTSATS MOT CEO:s UTTALADE MAL (CAGR>15%, gärna >20%, Sharpe>1,0):
  INTE UPPNATT. Bästa gating-CAGR (11,0% vid $100k) och till och med
  bästa disclosure-CAGR (12,6% vid 2,0x) ligger langt under 15%-golvet.
  Detta bekraftar, formellt och pre-registrerat (inte bara diagnostiskt),
  den slutsats diagnostiken redan indikerade: hävstång på HYP-047 ger en
  genuin, DSR-hog, men MATTLIG forbattring (~2-4pp CAGR-lyft over
  baslinjen med Sharpe bevarad vid mattliga nivaer) - inte en losning pa
  gapet till det ultimata CAGR-malet. HYP-047 (ohavstangad) forblir
  referensimplementationen - denna hypotes lager INTE automatiskt till
  ny referens (kraver eget CEO-beslut, samma monster som HYP-047/056),
  och givet hur langt fran malet resultatet ligger ar det oklart om ett
  sadant beslut ens ar motiverat.
