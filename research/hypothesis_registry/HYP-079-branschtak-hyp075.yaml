pass_fail_criterion: >
  MEKANISM (låst, inga fria parametrar kvar att välja):

  Bygger direkt på HYP-075:s redan låsta signal, klassificering och
  positionstak (3x-trimning). NY REGEL, tillämpad VID VARJE MÅNATLIG
  OMBALANSERING, separat för long- och kortbenet:

  1. Gruppera respektive bens namn efter SIC-2-siffergrupp (SEC:s
     tvåsiffriga branschkod, samma källa som redan använts för
     kvalitetskontroll 2026-07-31).
  2. Om en SIC-2-grupps andel av benets totala namnantal överstiger 25%,
     tilldela den gruppen EXAKT 25% av benets kapitalpool (likaviktat
     inom gruppen), och fördela resterande 75% likaviktat över benets
     ÖVRIGA namn.
  3. Om detta enda steg skulle göra att en ANNAN grupp nu överstiger 25%
     av den DÅ återstående, ej redan hardcapped poolen, upprepa steg 2
     iterativt (samma princip, tillämpad på den krympande återstående
     poolen) tills ingen grupp överstiger 25% av sin då tillgängliga
     andel.
  4. Om inget SIC-2 överstiger 25% alls: identiskt med HYP-075:s
     befintliga likaviktade fördelning, oförändrad.

  Positionstaket (3x-trimning, dagligen) körs OFÖRÄNDRAT efter denna
  justering. Ingen annan förändring av signal, entry/exit eller
  hållperiod.

  MOTORKRAV: identiska med HYP-075.

  PASS KRÄVER ALLA FYRA, PÅ DEN AVGÖRANDE $100k-NIVÅN (rapporteras för
  alla tre kapitalnivåer), DÖMT MOT HYP-075:S EGNA REDAN UPPMÄTTA TAL
  (samma jämförande konvention som HYP-075/076/077 använde mot HYP-072):
  1. Sharpe (huvudperiod) >= 0,8065 (HYP-075:s egen Sharpe).
  2. MaxDD INTE sämre än -6,05% (HYP-075:s egen MaxDD).
  3. Sharpe med HELA kalenderåret 2020 exkluderat >= 0,7737 (HYP-075:s
     egen ex-2020-Sharpe).
  4. Kurtosis för den dagliga avkastningsserien (hela huvudperioden,
     $100k) < 9,24 (20% tolerans ovanför HYP-075:s egen redan mycket
     låga kurtosis på 7,7 - en strikt "måste bli ännu lägre"-tröskel
     vore orimligt hård på en redan nära-normalfördelad serie; toleransen
     är låst här, i förväg, inte tillagd efter att ha sett resultatet).

  FAIL om något villkor faller vid $100k.

  OBLIGATORISK DISCLOSURE (icke-gating): andel av namnen per ben som
  faktiskt träffade 25%-taket per månad, samt antal iterativa
  omfördelningsrundor (steg 3) som någonsin krävdes.

  Diagnostiskt syfte: testar om HYP-075:s redan låga kurtosis (7,7,
  redan nära normalfördelningsnivå) ändå döljer en kvarvarande,
  bransch-koncentrerad svansrisk som inte syns på enskild-ticker-nivå -
  en strukturell riskregel, inte ännu en pris-baserad trimningsvariant.
