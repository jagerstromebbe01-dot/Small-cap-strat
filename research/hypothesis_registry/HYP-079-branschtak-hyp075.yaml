  synligt pa ren ticker-niva - konsistent med Geminis konvergerande
  varning om att shelf-aktivitet kan klunga sig i specifika branscher
  (t.ex. bioteknik) under kapitalanskaffningsperioder.

  Diagnostiskt: en ren portfoljstrukturell regel (ingen andring av
  signal eller entry/exit) fann och fixade en kvarvarande koncentrations-
  risk pa BRANSCHNIVA som varken HYP-075:s positionstak (ticker-niva)
  eller den gratis sektor-exkluderingskontrollen (som visade att INGEN
  enskild bransch dominerade TOTALRESULTATET, men inte testade
  branschbalans INOM kortbenet) fangade. Ny starkaste variant i
  HYP-072-familjen - kandidat att ersatta HYP-075 som forsta prioritet
  for ett femte-bens-beslut, eller testas i kombination (HYP-078-monster)
  med referensportfoljen.

