pass_fail_criterion: >
  MEKANISM (låst, inga fria parametrar kvar att välja):

  Bygger direkt på HYP-072:s redan låsta klassificering och månatliga
  ombalansering (deltest A:s full_ls-läge). Kortbenet är HELT OFÖRÄNDRAT
  mot HYP-072 (ingen vinsthemtagningsregel där - se motivering ovan).

  NY REGEL (endast LONG-benet, kontrolleras VARJE handelsdag): för varje
  long-position, övervaka från entry/senaste ombalansering. FÖRSTA
  gången (en gång per sammanhängande hållperiod - inte upprepat) en
  positions marknadsvärde når >= 2,0x sitt värde vid entry/senaste
  ombalansering (dvs. positionen har DUBBLATS), sälj nästa handelsdag
  EXAKT 50% av då kvarvarande antal aktier till aktuellt pris (med
  Corwin-Schultz-spread), banka in likviden som kontanter fram till
  nästa ombalansering. Ingen ytterligare åtgärd sker för den
  kvarvarande positionen under resten av hållperioden, oavsett hur
  mycket den sedan rör sig i endera riktningen - en engångshändelse,
  inte ett återkommande tak (till skillnad från HYP-075).

  MOTORKRAV: identiska med HYP-072.

  PASS KRÄVER ALLA FYRA, PÅ DEN AVGÖRANDE $100k-NIVÅN (rapporteras för
  alla tre kapitalnivåer):
  1. Sharpe (huvudperiod) >= 0,55.
  2. MaxDD INTE sämre än -50%.
  3. Sharpe med HELA kalenderåret 2020 exkluderat >= 0,4894 (HYP-072:s
     egen ex-2020-Sharpe vid $100k).
  4. Kurtosis för den dagliga avkastningsserien (hela huvudperioden,
     $100k) < 366,2 (HYP-072:s egen baskurtosis).

  FAIL om något villkor faller vid $100k.

  OBLIGATORISK DISCLOSURE (icke-gating): antal vinsthemtagningshändelser
  totalt och per kapitalnivå, genomsnittlig avkastning för den sålda
  50%-andelen vid händelsetillfället (för att verifiera att regeln
  faktiskt triggar på starka vinnare, inte brus), samt
  Sharpe/MaxDD/kurtosis-jämförelse rad för rad mot HYP-072:s redan
  rapporterade tal.

  Diagnostiskt syfte: testar om en riktad, engångs-vinsthemtagning på
  just de mest extrema uppgångarna (spegelbilden av en stop-loss, men
  mot motsatt svans av fördelningen) räcker för att dämpa
  kurtosis/skevhet utan att bygga ett strukturellt tak som kan klippa
  legitim, upprepad vinsttillväxt (den risk HYP-075:s upprepbara regel
  bär).
