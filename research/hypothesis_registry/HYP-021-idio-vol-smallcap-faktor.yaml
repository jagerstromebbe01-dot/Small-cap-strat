pass_fail_criterion: 'Identisk bas som HYP-017 (kvartalsvis decil-strategi, SPY-krasch-overlay OFORANDRAD
  - samma 10-dagars/-10%/40%-mekanism - samma friktion/kapacitetsspärr, samma tre motorfixar). Enda
  tillagget: SIGNALEN (idiosynkratisk volatilitet) beraknas mot ett ANNAT referensindex an tidigare.

  Motivering: HYP-015/017:s idio-vol-signal residualiserar mot SPY (ett stor-cap-dominerat index) - men
  "idiosynkratisk" bor rimligen betyda "vad som inte forklaras av den egna peer-gruppens gemensamma
  rorelse", inte "vad som inte forklaras av ett annat marknadssegment". Denna hypotes ersatter SPY med
  ett likaviktat small-cap-kompositfaktor (medelvardet av dagliga avkastningar over HELA small-cap-
  universumet, samma prisdata som redan laddas) SOM REFERENS FOR SIGNALBERAKNINGEN (residual =
  aktieavkastning - beta*kompositfaktor-avkastning, samma beta-metod som HYP-015/017).

  VIKTIGT: PORTFOLJENS FAKTISKA HEDGE (SPY-beta-hedgen som neutraliserar marknadsexponering, samma
  kod som HYP-017) AR OFORANDRAD - fortfarande SPY, eftersom det ar ett riktigt, likvitt, blankningsbart
  instrument man faktiskt kan hedga med i verkligheten. Bara SIGNALENS referens andras (vilket index
  aktien jamfors mot for att rakna ut vad som ar "idiosynkratiskt"), inte hedgeinstrumentet. Krasch-
  overlayen (som bevakar SPY:s egen rorelse, INTE small-cap-kompositfaktorn) ar ocksa helt oforandrad.

  PASS kraver Sharpe (efter friktion) >= 0.55 pa SAMTLIGA tre kapitalnivaer (100k/1M/10M). FAIL om
  nagon niva faller under.

  Diagnostiskt syfte: testar om en mer relevant peer-grupps-referens for signalen (small-cap-komposit
  i stallet for SPY) ger en renare idiosynkratisk-vol-rangordning och darmed hogre Sharpe an HYP-017:s
  0.72/0.75/0.72 - samma typ av "gratis" signalforbattring (utan ny risk) som redan fungerade en gang
  nar HYP-015 ersatte total-vol med idio-vol.'
