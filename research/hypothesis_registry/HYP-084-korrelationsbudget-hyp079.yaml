id: HYP-084
date_registered: '2026-08-12'
title: "Pairwise korrelationsbudget (crowding-viktning) på HYP-079"
universe: "N/A - samma engine/signal som HYP-079 (inklusive dess
  branschtak), oförändrad."
small_cap_definition: "N/A - se HYP-072:s redan låsta definition, oförändrad."
data_range: "Samma period som HYP-079. Ingen ny data - ren OHLCV-baserad regel."
pass_fail_criterion: >
  MEKANISM (låst, inga fria parametrar kvar att välja):

  Bygger direkt på HYP-079:s redan låsta signal, klassificering,
  branschtak OCH positionstak (3x-trimning) - ALLA oförändrade. NY,
  YTTERLIGARE REGEL, tillämpad vid varje månatlig ombalansering, EFTER
  branschtaksviktningen, separat per ben:

  1. För varje NY entry-kandidat, beräkna 60-handelsdagars trailing
     Pearson-korrelation (dagliga totalreturns, adjusted_close) mot
     VARJE ANNAN samtidig ny entry-kandidat på SAMMA ben. Namn med
     färre än 60 giltiga observationer får "crowding_i = 0" (ingen
     justering).
  2. "Crowding-score" för namn i = medelvärdet av dess POSITIVA
     pairwise-korrelationer mot övriga kandidater på samma ben (negativa
     korrelationer sätts till 0 innan medelvärdesberäkningen - en
     korrelation på -0,3 bidrar allts0 med 0, inte -0,3).
  3. Vikt_i (efter branschtaket, före denna regel) multipliceras med
     (1 - crowding_i). Namn med crowding_i = 1 (perfekt positivt
     korrelerade mot allt annat i snitt) får alltså noll vikt.
  4. Normalisera om benets vikter till att summera till 1 (bland de nya
     entries som fortfarande har positiv vikt efter steg 3) innan
     kapitalpoolen fördelas.

  Positionstaket (3x-trimning) körs OFÖRÄNDRAT efter denna justering.

  MOTORKRAV: identiska med HYP-079.

  PASS KRÄVER ALLA FYRA, PÅ DEN AVGÖRANDE $100k-NIVÅN, DÖMT MOT
  HYP-079:S EGNA REDAN UPPMÄTTA TAL:
  1. Sharpe (huvudperiod) >= 0,8433 (HYP-079:s egen Sharpe).
  2. MaxDD INTE sämre än -5,82% (HYP-079:s egen MaxDD).
  3. Sharpe med HELA kalenderåret 2020 exkluderat >= 0,8043 (HYP-079:s
     egen ex-2020-Sharpe).
  4. Kurtosis för den dagliga avkastningsserien (hela huvudperioden,
     $100k) < 10,56 (20% tolerans ovanför HYP-079:s egen kurtosis på 8,8,
     samma princip som HYP-079:s egen tolerans mot HYP-075).

  FAIL om något villkor faller vid $100k.

  OBLIGATORISK DISCLOSURE (icke-gating): genomsnittlig crowding-score
  per ben och månad, andel namn som fick vikt nära noll (crowding > 0,9).

  Diagnostiskt syfte: testar om DOLD samvariation (namn i olika
  branscher men med likartad small-cap-/finansieringsrisk) är en
  kvarvarande koncentrationsrisk som branschtaket (en exogen
  klassificering) missar - en empirisk, inte kategori-baserad,
  diversifieringsregel.
status: failed   # pre-registered -> tested -> passed/failed
