result_summary: >
  FAILED - Sharpe (0.69/0.71/0.67) klarar fortfarande 0.55-golvet pa alla
  tre nivaer, MEN MaxDD-forbattringsvillkoret (strikt battre an HYP-017:s
  EGET resultat pa samma niva) haller BARA vid $100k (-23.68% mot -26.96%,
  en verklig forbattring). Vid $1M blir MaxDD SVAGT SAMRE (-20.12% mot
  -19.77%), och vid $10M i praktiken oforandrat (-13.42% mot -13.39%).
  Kriteriet kravde forbattring pa SAMTLIGA tre nivaer, sa hypotesen ar
  FAILED trots ett tekniskt friskt Sharpe-tal.

  MEKANISMEN FUNGERAR EXAKT SOM DIAGNOSTISERAD FOR MALFALLET - detta ar
  INTE ett implementationsfel: de fem regionbanks-positionerna som
  motiverade hypotesen (BHLB/EBSB/HTBK/GWB/BRKL_old) stoppas nu ut i
  mars-maj 2020 vid -21% till -30%, i stallet for att rida till
  kvartalsutgangen 2020-06-30 och sluta pa -33% till -66% (bekraftat i
  trade_log_100000.csv). Den ursprungliga, konkreta risk-luckan ar
  faktiskt tappt.

  VARFOR DET ANDA INTE RACKER I AGGREGAT: 282 stop_loss_exit-trades
  totalt over 13 ar (snittavkastning -25%, 0% win rate per definition -
  alla trades under -20% nar de triggar). -20%-trosklen ar for los for
  small-cap-volatilitet i allmanhet - den kapar forlust pa massor av
  helt NORMALA, tillfalliga nedgangar som annars hade aterhamtat sig,
  inte bara de sallsynta katastrofala fallen (som motiverade hypotesen).
  Den kumulativa "forsakringspremien" fran alla dessa falska larm ater
  upp (och vid hogre kapitalnivaer nagot overstiger) vinsten fran att
  ratt fanga de riktiga blow-ups:en - samma dynamik som redan sags i
  HYP-017:s egen krasch-overlay (overlay-trades hade -7.9% snitt/31%
  win rate DAR ocksa), men har vager kostnaden tyngre an nyttan i
  aggregat, till skillnad fran HYP-017 dar den vagde ratt.

  MOJLIG FRAMTIDA FORFINING (ej byggd har, skulle krava en ny
  pre-registrerad hypotes): en snavare eller mer selektiv trigger (t.ex.
  ett djupare trosklevarde, eller ett krav pa flera dagars sammanhangande
  nedgang i stallet for en punktkontroll) skulle kunna minska antalet
  falska larm utan att tappa formagan att fanga genuina blow-ups - men
  detta far INTE trimmas i efterhand mot just denna backtests resultat
  (det vore precis den typ av facit-anpassning projektet finns till for
  att undvika) - det skulle behova sin egen, oberoende motivering och
  lasta kriterium.
