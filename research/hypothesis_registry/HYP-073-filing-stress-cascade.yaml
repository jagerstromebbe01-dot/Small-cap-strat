id: HYP-073
date_registered: '2026-08-12'
title: "Filing Stress Cascade - organisatorisk rapporteringsfriktion som andraordnings-eventsignal"
universe: small-cap, $100M - $2B börsvärde, EODHD All-World som datakälla (HYP-008:s
  redan låsta definition, filed-datum-korrigerat universum)
small_cap_definition: small-cap, $100M - $2B börsvärde, EODHD All-World som datakälla
data_range: EODHD All-World för priser, 2010-01-01 till 2024-12-31 (huvudperiod) +
  genuin blind OOS-2025. SEC EDGAR submissions-API (form+items+filingDate) för
  hela samma period per ticker (delad ny datamodul med HYP-072).
pass_fail_criterion: >
  MEKANISM (låst, inga fria parametrar kvar att välja):

  STRESS-HÄNDELSER (fyra binära flaggor, var och en detekterad rent via
  formtyp/item-kod i SEC submissions-API:et, EN gång per DISTINKT typ inom
  fönstret, inte per förekomst):
  1. NT 10-K eller NT 10-Q filad (sen inlämning).
  2. 10-K/A eller 10-Q/A filad (omarbetning/ändring av tidigare rapport).
  3. 8-K filad med item "4.01" (revisorsbyte).
  4. 8-K filad med item "4.02" (non-reliance på tidigare finansiella
     rapporter - den mest direkta strukturerade proxyn för en kommande
     omräkning/restatement).

  SCORE: vid varje handelsdag, räkna antalet DISTINKTA stress-händelsetyper
  (0-4, inte antal förekomster) som inträffat för tickern under de
  senaste 12 kalendermånaderna (rullande fönster).

  TRIGGER OCH POSITION: när score för en ticker första gången når >= 2 inom
  fönstret (dvs. minst två OLIKA stress-händelsetyper inom 12 månader), gå
  SHORT nästa handelsdag efter den händelse som fällde avgörandet. Likaviktat
  över samtliga namn triggade samma kalendervecka (undviker
  överkoncentration i en enskild triggerdag, samma konvention som HYP-050).
  Håll FAST 60 handelsdagar (låst - motiverat som en avvägning mellan att ge
  den organisatoriska friktionstesen tid att spela ut och att undvika
  kontamination med redan testad 6-12-månaders momentumdrift). Ingen lång
  sida (ett stress-score är inget informativt LÅGT-score-tecken i sig, till
  skillnad från ett HÖGT score - samma asymmetriska hantering som redan
  etablerad för HYP-035/HYP-054).

  MOTORKRAV: samma tre grundfixar (filed-datum-universum, maskad
  adjusted_close-kvot, flag_implausible_liquidity()) samt
  mask_unrecovered_price_breaks() (byggd 2026-08-09), borrow_cost 3%/år samt
  Corwin-Schultz-spread på entry/exit - friktion inbyggd från start.

  PASS KRÄVER, PÅ DEN AVGÖRANDE $100k-NIVÅN (rapporteras för alla tre):
  1. Sharpe (efter friktion) >= 0.55.
  2. MaxDD INTE sämre än -50% (samma explicita tak som HYP-050/HYP-072,
     motiverat av registrets upprepade small-cap-short-katastrofer).

  FAIL om något villkor faller vid $100k, ELLER om
  datafeasibility-kontrollen (körs FÖRST, innan backtest) visar att
  `items`-fältet eller formtyp-historiken är opålitligt gles för ett giltigt
  stickprov över hela 2010-2024-perioden - i så fall avbryts hypotesen innan
  backtest körs, redovisas öppet som ett feasibility-FAIL (samma disciplin
  som HYP-052).

  OBLIGATORISK DISCLOSURE (icke-gating): fördelning av triggade positioner
  efter exakt score vid triggertillfället (score=2 vs score=3 vs score=4) -
  för att verifiera om "kaskad"-effekten är monoton eller bara driven av de
  mest extrema fallen; samt andel triggade positioner som redan var i
  finansiell distress vid triggertillfället (samma postmortem-kontroll som
  HYP-050 fick).

  Diagnostiskt syfte: testar om en FÖRSTA rapporteringsstörning ökar
  sannolikheten för en KEDJA av framtida kostnader/kapitalproblem som
  marknaden underskattar - en organizational-friction-mekanism som varken
  kräver ett pristrend, en volatilitetspremie eller en index-/
  regimexponering, och som skiljer sig från ett isolerat revisorsbyte genom
  att kräva SAMVERKAN mellan minst två oberoende administrativa
  varningssignaler.
status: failed   # pre-registered -> tested -> passed/failed
k_total_hypotheses_before_this: 68
