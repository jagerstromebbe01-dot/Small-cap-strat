result_summary: >
  FAILED - INTE NARA GRANSEN. Sharpe 0.14/0.19/0.09 mot 0.55-golvet,
  DSR 0.07/0.11/0.05 vid K=23 (i praktiken brus - samma nivå som
  HYP-020:s PEAD-fiasko). MaxDD -74%/-61%/-65% ar bland de samsta i
  hela projektet, jamforbart med HYP-019:s misslyckade kapacitetstest.

  DIAGNOS (innan detta rapporterades): tva separata problem identifierade.

  (1) Datakvalitet 2010-2012: OperatingIncomeLoss/Assets-tackningen fran
  SEC EDGAR XBRL ar mycket gles fore ~2012 (SEC:s XBRL-krav for mindre
  bolag infordes stegvis runt 2011) - forsta ombalanseringen (2010-09-30)
  hade bara 9 kandidater totalt, vilket gav en 1-aktie-portfolj (n_top=1)
  under flera kvartal, och tackningen nadde inte en stabil, anvandbar
  niva (700+ av ~950 berattigade namn) forran runt 2012-06.

  (2) MEN detta FORKLARAR INTE resultatet: aven med start FORST 2012-06-30
  (efter att tackningen stabiliserats) forblir Sharpe 0.10 och TOTALAVKASTNINGEN
  AR NEGATIV (-13% over 12 ar) - detta ar INTE en tidig-data-artefakt,
  utan ett genuint utebliven/negativ ra edge. MaxDD-toppen (2014-01-13)
  till botten (2020-03-24, covid) visar en strategi som redan var i
  langvarig nedgang i flera ar INNAN covid-kraschen - konsistent med att
  signalen helt enkelt inte bar nagon anvandbar information i denna
  implementation, inte att den "rakade" ha otur med en enskild kris.

  MOJLIGA FORKLARINGAR (INTE testade har, skulle krava egna
  pre-registrerade hypoteser om de nagonsin foljs upp): arsvis
  uppdaterande bokslutsdata (bara en ny observation per bolag och ar)
  kan vara for trog for en kvartalsvis ombalanserad small-cap-strategi
  jamfort med akademisk praxis (Fama-French RMW ombalanserar arsvis i
  juni, inte kvartalsvis); ELLER sa ar rorelselonsamhet specifikt (till
  skillnad fran t.ex. bruttovinst) helt enkelt en svagare/annorlunda
  signal i just detta small-cap-band; ELLER sa ar den etablerade
  lonsamhetspremien (Novy-Marx 2013, Fama-French RMW) genuint svag eller
  frånvarande i just denna small-cap-datakalla/period - konsistent med
  projektets ovriga fynd att IMPORTERADE klassiska faktorer (momentum,
  storlek, PEAD) genomgaende misslyckas, och att bara idiosynkratisk
  volatilitet (HYP-015/017/023-linjen) nagonsin visat en riktig signal.

  ROBUSTHET (innan detta rapporterades): sharpe_excl_best_trade forblir
  0.127/0.187/0.090 - i praktiken oforandrat fran huvudresultatet, sa
  det svaga resultatet ar INTE en artefakt av att en enskild bra trade
  saknas - signalen ar genomgaende svag, inte "nastan bra men olycklig".

  SLUTSATS: kvalitet/lonsamhet-faktorn (den sista mekaniskt distinkta,
  otestade klassiska faktorn i projektet) ger INGEN anvandbar ra edge i
  denna small-cap-datakalla/period, med denna specifika implementation
  (rorelselonsamhet, arsvisa bokslut, topp-decil). HYP-023 forblir
  projektets enda referensimplementation. Foljer samma monster som
  HYP-016/019/020: varje importerad klassisk faktor utom
  (idiosynkratisk) volatilitet har hittills misslyckats i denna
  datamiljo.
