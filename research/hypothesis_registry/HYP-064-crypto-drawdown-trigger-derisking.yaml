  ANNUALISERING: 365 dagar/år - se HYP-060:s identiska notering.

  JÄMFÖRELSEPUNKT: BASELINE_BASKET (Calmar 1,705 i diagnostiken - det
  FORMELLA, friktionsjusterade talet beräknas om i denna körning för
  exakt samma fönster som strategin, kan skilja sig marginellt).

  PASS KRÄVER ALLA TRE (huvudperioden):
  1. Sharpe >= 0,55.
  2. Calmar > BASELINE_BASKET:s egen Calmar (slå att bara hålla korgen,
     inte bara en absolut nivå).
  3. Calmar > 1,5 (absolut golv).

  FAIL om något villkor faller.

  OOS-2025: rapporteras informativt, ej gating.

  OBLIGATORISK DISCLOSURE (icke-gating): antal triggningar/återinträden,
  andel dagar i defensivt läge, exakta triggerdatum - för att synliggöra
  reservation #2 (se header) konkret i resultatet, inte bara i texten
