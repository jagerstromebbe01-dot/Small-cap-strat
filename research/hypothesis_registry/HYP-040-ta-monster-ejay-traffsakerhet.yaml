    perioden - en positiv beta borde ha HJALPT, inte stjalpt,
    resultatet, vilket forstarker att den negativa avkastningen kommer
    fran signalen/urvalet sjalvt, inte fran marknadsriktningen).

  SLUTSATS: CEO:s hypotes ("teknisk analys ar inte dod i small-cap, bara
