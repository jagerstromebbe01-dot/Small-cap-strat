result_summary: >
  FAILED RENT PA VILLKOR 1 OCH 2, PA ALLA TRE KAPITALNIVAER - inget
  gransfall, katastrofalt tydligt.

  Villkor 1 (Sharpe >= 0.55): Sharpe -0.50/-0.88/-0.91 (ejay-viktad) -
  djupt NEGATIV, inte bara under golvet. MaxDD -78.1%/-78.2%/-77.1% -
  bland de sämsta enskilda resultaten i hela registrets historia
  (jamforbart med HYP-019:s -78%/-69%/-45% och HYP-030:s
  -86%/-83%/-74%, de tva tidigare varsta misslyckandena). DSR vid K=39:
  0.001/0.000/0.000 - i praktiken noll sannolikhet att detta ar en
  dold, genuin edge maskerad av brus; tvärtom, en entydig avsaknad av
  edge.

  Villkor 2 (Ejay-viktad Sharpe >= likaviktad Sharpe for SAMMA pool):
  TEKNISKT PASS pa $100k (-0.505 mot -0.491 - Ejay-viktad AR marginellt
  SAMRE, inte battre, men skillnaden ar forsumbar), FAIL pa $1M/$10M
  (-0.883 mot -0.874 vid $1M, -0.9086 mot -0.9088 vid $10M - i praktiken
  identiska, ingen meningsfull skillnad at nagot hall). DETTA AR DEN
  VIKTIGASTE ENSKILDA SLUTSATSEN: Ejay-viktningen tillfor INGENTING,
  varken positivt eller negativt, jamfort med att bara handla alla
  monster som passerar kvartilfiltret lika viktat. Exakt samma
  dodsmonster som redan observerats i de 8 tidigare Ejay/Kelly-varianterna
  ("ingen forbattring efter att ha kontrollerat for signalstyrka; hog
  korrelation mellan viktad/oviktad variant") - AVEN i denna mekaniskt
  annorlunda tillampning (TA-traffsakerhet snarare an signalstyrka pa
  en redan vald decil). Ejay/Kelly-linjen ar SALEDES INTE unikt kopplad
  till just idio-vol-decil-viktning - monstret verkar generalisera till
  "att vikta positioner efter ett historiskt traffsakerhets-/
  konfidensmatt tillfor inte matbart varde i det har universumet",
  oavsett vad matten sjalva mater.

  Villkor 3 (friktion): uppfyllt kodmassigt (Corwin-Schultz-spread
  anvand pa in-/utgang, se validate_friction_usage.py).

  OOS-2025: EJ KORD - CEO-BESLUT, sparat pa samma grund som HYP-035/
  HYP-019/HYP-030 (villkor 1 var redan ett sa entydigt, extremt fail
  pa ALLA TRE nivaer att en dyr fullstandig 2010-2025-OOS-korning inte
  skulle andra slutsatsen). Redovisat oppet, ingen tyst avvikelse fran
  tested_capital_levels-atagandet (som galler kapitalnivaer, inte
  OOS-steget specifikt).

  DIAGNOS (kort, ingen vidare felsokning gjord - kriteriet var redan
  entydigt uppfyllt for FAIL, ingen anledning att "raddan" resultatet):
  - Winrate 42.0-42.2% pa alla nivaer/varianter - SAMRE an myntkast.
    Breakout-/momentum-monster i small-cap markerar sannolikt ofta
    lokala toppar (utbrott som atergar) snarare an fortsattningar,
    ett kant fenomen i illikvida aktier.
  - I snitt 594 "eldade" ticker-dagar/dag av ett universum pa ~700-900
    eligible namn - extremt lag selektivitet (15 monster som triggar
    dagligen pa de flesta aktier over tid). Ett sa vanligt forekommande
    "monster" narmar sig per definition brus, inte en sallsynt,
    informativ handelse.
  - Profit Factor 0.79-0.85 (under 1.0 pa alla varianter/nivaer) -
    forlusterna oversteg vinsterna i dollartermer, inte bara i antal.
  - Beta mot SPY 0.31-0.34 (positiv, ej gated av kriteriet men
    rapporterad enligt punkt 8) - som vantat for en long-only strategi
    utan hedge, men bidrar INTE till forklaringen av det negativa
