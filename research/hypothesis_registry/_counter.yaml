note: "HYP-036 (sektorneutral idiosynkratisk-volatilitets-rankning pa HYP-023, FAILED 2026-08-01 PA BADA villkoren pa alla tre nivaer - Sharpe 0.51/0.54/0.55 missade 0.55-golvet aven vid $10M, MaxDD -28.5%/-28.5%/-26.7% SAMRE an HYP-023:s -25.46%/-19.29%/-13.16% pa alla tre, forsamringen VAXTE dramatiskt med kapitalniva (13.55pp samre vid $10M, MER AN DUBBELT sa daligt), DSR 0.42/0.46/0.48 vid K=35. Motiverad av ett NYTT, KVANTIFIERAT fynd fran scripts/attribution.py (byggt samma dag): HYP-023 hade 5.6x overexponering mot statliga affarsbanker (SIC 60), HYP-008 hade 9.0x. OBLIGATORISK DIAGNOSTIK BEKRAFTADE att mekanismen GJORDE sitt jobb: SIC 60-overrepresentationen foll till 1.3x/1.2x/0.8x (i praktiken eliminerad) - men detta LOSTE INTE huvudproblemet, Sharpe/MaxDD blev SAMRE. Diagnos: bankexponeringen ar en STABILISERANDE FEATURE i HYP-023, inte bara en riskkalla - tredje oberoende bekraftelsen efter HYP-022 (statiskt tak, FAILED med samre MaxDD) och HYP-023:s egen sektor-krasch-trigger (medvetet design att behalla bankexponering i lugna perioder). Faktorregressionen visade varfor: MOM-loading blev starkt signifikant NEGATIV (t=-5.2 till -6.1, mot HYP-023:s ej signifikanta t=-0.9 till -1.8) - tvingad spridning over fler sektorer (min 1 namn/sektor) drog in mer forlorar-momentum-exponering, en redan kand riskfaktor (HYP-012/016/030). Friktionsdraget okade ocksa (0.42pp/trade mot 0.34pp, 2991 trades mot 2253). HYP-023 forblir referensen, oforandrad. Viktig metodologisk lardom: attributionsverktygets egen varningsklausul bekraftades - ett tekniskt uppnatt diagnostiskt mal (mindre koncentration) garanterar inte battre resultat.) + HYP-035 (insiderkop via SEC Form 4 kod P, ra signal utan overlay, forsta genuint NYA alfasignalen sedan HYP-023 - INTE en HYP-023-variant, FAILED RENT 2026-08-01 pa den enda testade nivan: Sharpe 0.29 vid $100k mot 0.55-golvet (missade med nastan halva), MaxDD -74.9%, DSR 0.12 vid K=34. CEO gav explicit instruktion att avbryta efter $100k istallet for att kora $1M/$10M ocksa, eftersom missen var sa entydig (jmf HYP-032 dar $100k missade men $1M/$10M klarade - den typen av gransfall hade motiverat fullstandig korning) - redovisat oppet i registerposten, INTE en tyst avvikelse fran tested_capital_levels-atagandet. Extrem skevhet (12.8) och kurtosis (425.8) i avkastningsserien tyder pa att resultatet domineras av ett fatal extrema enskilda trades - konsistent med den redan kanda signalglesheten (endast namn med minst en insidertransaktion i 63-dagarsfonstret konkurrerar om en redan liten decil, se feasibility-checken 2026-08-01 som visade 11-18% deltagande per kvartal). HYP-023 forblir referensen. Insiderkop-signalen ar INTE nodvandigtvis helt utesluten (samma monster som idio-vol som ocksa FAILADE ra innan en krasch-overlay raddade den i HYP-017) men kraver en ny, separat lasning innan en overlay-uppfoljare testas - ingen automatisk fortsattning.) + HYP-034 (stale-price/nolldags-filter (>12/120 dagar) fore idio-vol-rankning i HYP-023, FAILED RENT PA ALLA TRE NIVAER 2026-08-01 - Sharpe 0.72/0.74/0.72 klarade golvet, men MaxDD blev SAMRE an HYP-023:s egna PA ALLA TRE nivaer: -32.28%/-26.58%/-13.59% mot -25.46%/-19.29%/-13.16% (6.82pp/7.28pp/0.44pp forsamring), DSR 0.73/0.76/0.73 vid K=33. Filtret bet REELLT (34.3 exkluderade av 672.4 forfilter-kandidater per ombalansering, decilen krympte fran ~67 till 63.4) - inte en no-op. Forsta av tre AI-foreslagna likviditets-atgarder (5-AI-brainstorm 2026-07-31) - avsedd att motverka HYP-023:s diagnostiserade kapitalnivaberoende OOS-avklingning genom att exkludera aktier vars matta laga volatilitet sannolikt ar en artefakt av stale/ohandlade priser snarare an genuin stabilitet. FORNYAD BLIND OOS-2025-KORNING (paper_trading/HYP-034/oos_backtest_2025.py, diagnostik, ingen K-kostnad): isolerat till 2025 blev Sharpen 0.265/0.052/-0.022 - SAMRE an HYP-023:s egna 0.39/0.17/0.08 pa alla tre nivaer, rentav NEGATIV vid $10M. Malet (mildra kapitalnivaberoende avklingning) uppnaddes INTE - det blev VARRE. Diagnos: manga 'stale-liknande' namn ar sannolikt genuint lagvolatila mikrobolag, inte matningsfelsartefakter - att ta bort dem forskjuter decilen mot mer aktivt handlade men OCKSA mer volatila namn, samma monster som HYP-018/022/025-029 (riskverktyg som skadar i praktiken trots rimlig teori). HYP-023 forblir referensen, oforandrad. De tva atervarande AI-forslagen (villkorat overlay-aterintrade, likviditetsviktad allokering) kravs egen lasning innan de testas.) + HYP-033 (book-to-market vardefaktor, topp-decilen, FAILED KRAFTIGT 2026-07-31 - Sharpe 0.33/0.18/-0.18 (negativ vid $10M), MaxDD katastrofal -56%/-65%/-91%, DSR 0.08/0.07/0.003 vid K=32. KRITISK BEGRANSNING: bara 475/5162 tickers (9%) hade matchbar equity+aktieantal fran SAMMA 10-K, decilstorlek bara 1-6 namn genom HELA perioden (aldrig i narheten av idio-vol-testernas 50-76) - extrem underdiversifiering, INTE ett lika rent svar som ovriga faktormisslyckanden pa om B/M genuint saknar edge i small-cap. HYP-023 forblir referensen, oforandrad.) + HYP-032 (traditionell Kelly-sizing med signalstyrka inom HYP-023:s idio-vol-decil, FAILED 2026-07-31 MEN NYANSERAT - MaxDD FORBATTRADES pa alla tre nivaer (upp till 5.4pp vid $1M), och Sharpe klarade faktiskt golvet vid $1M (0.64) och $10M (0.68), bara $100k foll (0.40) - DSR 0.28/0.63/0.68 vid K=31. Diagnos: vid lag kapitalniva binder INTE kapacitetsspärren, sa Kelly-koncentrationen (upp till 3x likaviktad andel) far fullt genomslag och skadar Sharpen; vid hog kapitalniva TVINGAR kapacitetsspärren tillbaka mot narmare likaviktning. INTE samma dodsorsak som de 7 ursprungliga Ejay-varianterna (cirkularitet) - en ny, informativ lardom. Ejay/Kelly-linjen ater STANGD, 8 misslyckade varianter totalt, kraver nytt explicit CEO-beslut. HYP-023 forblir referensen, oforandrad.) + HYP-031 (beta-hedge mot IWM i stallet for SPY pa HYP-023, FAILED 2026-07-31 - Sharpe oforandrat 0.71/0.74/0.71, men MaxDD SAMRE pa ALLA tre nivaer (-25.9%/-19.6%/-15.0% mot