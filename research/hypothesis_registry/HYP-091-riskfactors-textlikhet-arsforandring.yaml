mechanism_sketch: >
  ATT DISKUTERAS/LÅSAS, EJ en färdig mekanism-spec:

  1. För varje bolag i universumet, vid varje ny 10-K-inlämning: hämta
     primärdokumentet (samma submissions-API+Archives-URL-mönster som
     redan verifierat för 8-K-signalen), extrahera Item 1A-sektionen
     via den testade VERSAL-rubrik-heuristiken ovan (kräver bredare
     stickprovsverifiering innan tillit).
  2. Beräkna textlikhet mellan detta års Item 1A-text och FÖREGÅENDE
     års Item 1A-text (samma bolag) - kandidatmått: cosine-likhet på
     TF-IDF-viktade ord-vektorer, eller enklare Jaccard-likhet på
     ordmängder/n-gram-shingles. VAL EJ GJORT HÄR - cosine/TF-IDF är
     den vanligare akademiska konstruktionen (Cohen, Malloy & Nguyen
     2020, "Lazy Prices", Journal of Finance) och rekommenderas, men
     Jaccard är enklare att implementera och granska manuellt.
  3. LÅG likhet (stor förändring i riskspråk år-över-år) - akademiskt
     kopplat till SÄMRE framtida avkastning (marknaden underreagerar
     på förändringen). Kandidat-konstruktion: kort/undvik bolag i den
     lägsta likhets-decilen, long (eller neutral) resten - exakt
     tröskel/konstruktion INTE avgjord här.
  4. Ombalansering: HÄNDELSESTYRD (varje ny 10-K uppdaterar det bolagets
     signal omedelbart, samma "kontinuerlig" stil som redan används i
     HYP-072/077), INTE en fast kalenderfrekvens - eftersom 10-K:er
     lämnas utspritt över året per bolags egna räkenskapsårsslut.

  ÖPPEN FRÅGA TILL CEO: long/short-konstruktion (kort låg-likhet-decilen
  som ett fristående alfa-ben, eller undvikande-filter i en redan
  existerande long-bok) - inte avgjord här, påverkar om detta blir ett
  nytt SJÄTTE ben eller en modifierare av ett befintligt.
