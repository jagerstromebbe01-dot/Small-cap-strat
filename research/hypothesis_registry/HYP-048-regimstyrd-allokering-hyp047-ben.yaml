  TVÅ TILLSTÅND (binärt, samma princip som redan använda kraschtriggrar
  - ingen kontinuerlig/fritt vald funktion):
  - LUGNT (dagens 20-dagars vol <= 2-års rullande median): 25% SPY /
    25% HYP-037 / 35% momentum L/S / 15% bear catcher.
  - STRESS (dagens 20-dagars vol > 2-års rullande median): 25% SPY /
    25% HYP-037 / 15% momentum L/S / 35% bear catcher.

  Tillståndet kontrolleras och vikterna sätts om VARJE kvartalsvis
  ombalansering (ingen daglig omviktning - portföljen driver mellan
  ombalanseringarna precis som HYP-039/041/043 redan gör). SPY- och
  HYP-037-benens vikt är FASTA (25% vardera, alltid) - bara fördelningen
  mellan momentum L/S och bear catcher (tillsammans alltid 50%) växlar
  med regimen.

  KORRELATION: samtliga fyra bens parvisa dagliga korrelationer
  redovisas FÖRE låsning (redan tillgängliga avkastningsserier från
  HYP-047:s egen, senast korrigerade körning - kostar inget extra att
  beräkna nu, se separat diagnostikanteckning innan pre-registrering
  slutförs).

  PASS KRÄVER ALLA TRE, PÅ DEN AVGÖRANDE $100k-NIVÅN (rapporteras för
  alla tre nivåer):
  1. Sharpe (2010-2024, friktionskorrekt) > HYP-047:s egen korrigerade
     Sharpe (1.126/1.127/1.102 vid 100k/1M/10M).
  2. MaxDD BÄTTRE (mindre negativ) än HYP-047:s egen korrigerade MaxDD
