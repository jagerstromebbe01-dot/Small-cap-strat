  DIAGNOS (efter alla fixar, kvarstående resultat): den long-only-
  filtrerade decilen presterar KONSEKVENT sämre än att bara äga hela
  universumet likaviktat. Sannolik förklaring, INTE slutgiltigt
  bevisad här: Sloans (1996) accrual-anomali dokumenterades på stora,
  etablerade bolag där låga/negativa accruals oftast speglar
  bokföringsmässig FÖRSIKTIGHET hos i övrigt friska bolag. I detta
  registrets faktiska micro-/small-cap-band ($100M-$2B) tycks en stor
  NEGATIV accrual-kvot oftare spegla en genuin GOING-CONCERN-
  nedskrivning (distress) snarare än konservativ redovisning hos ett
  friskt bolag - se trade-loggen (results/trade_log_100000.csv):
  medianhandel -14,6%, nedre kvartil -52,6%, flera enskilda positioner
  ner mot -97 till -99,9% (BXRX, VENGD, QUESD, SASI m.fl. - mönster
  som ser ut som distressade/utraderade mikro-cap-namn, inte
  "konservativt redovisande kvalitetsbolag"). En känd typ av
  universum-mismatch mellan varifrån en anomali ursprungligen
  dokumenterades och var den appliceras här - samma kategori
  observation som redan noterad för Do & Faff (2010) i
  candidate_ideas.md.

