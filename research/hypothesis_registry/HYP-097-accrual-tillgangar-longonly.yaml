pass_fail_criterion: >
  MEKANISM (fullt specificerad):

  DATAINSAMLING: för varje bolag i universumet, vid varje 10-K, hämta
  NetIncomeLoss, NetCashProvidedByUsedInOperatingActivities OCH Assets
  (companyfacts-XBRL-API - de två förstnämnda taggarna verifierade
  närvarande för ett testbolag i HYP-092:s sondering, Assets-taggens
  täckning EJ verifierad, Coder MÅSTE kontrollera täckningsgrad över
  ett brett urval innan resultat litas på - om täckningen är för låg,
  RAPPORTERA detta explicit istället för att tyst falla tillbaka på
  en annan nämnare).

  SIGNAL: Accruals_t = (NetIncomeLoss_t - NetCashFromOps_t) /
  ((Assets_t + Assets_{t-1}) / 2) - genomsnittliga totala tillgångar
  över året, Sloans (1996) originalkonstruktion exakt.

  OMBALANSERING (KONVENTION, kvartalsvis, samma staleness-princip som
  HYP-093 - senast kända Accruals-värde om filat inom 450 dagar,
  annars exkluderad den perioden).

  PORTFÖLJKONSTRUKTION (denna variant): decilrangordning på Accruals.
  LONG-ONLY den LÄGSTA decilen (lägst accruals - vinst mest
  kassaflödesstödd, akademiskt kopplat till BÄTTRE framtida
  avkastning). Likaviktat. Ingen short. Testas standalone mot en
  likaviktad, ofiltrerad universum-baseline (obligatorisk disclosure,
  icke-gating).

  FRIKTION: standardmetodiken, ingen short-lånekostnad relevant.

  PASS KRÄVER BÅDA, PÅ $100K-NIVÅN (CEO-LÅST, enhetlig bar för hela
  BATCH-004, se HYP-093):
  1. Sharpe (friktionsjusterad) > 0,70.
  2. MaxDD inte sämre än -30,0%.
  FAIL om något villkor faller. $1M/$10M + OOS-2025 + baseline-
  disclosure (ofiltrerat universum): obligatorisk, icke-gating.
