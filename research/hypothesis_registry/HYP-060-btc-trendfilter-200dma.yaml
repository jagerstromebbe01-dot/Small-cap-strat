pass_fail_criterion: >
  MEKANISM (låst, inga fria parametrar kvar att välja):

  Daglig stängningskurs (close) jämförs mot ett 200-dagars glidande medel
  (SMA_WINDOW=200, samma konvention som bear catcher/HYP-047). close >
  SMA_200 -> 100% BTC. close <= SMA_200 -> 100% kontant (RF_ANNUAL=2%/år).

  FRIKTION (utöver spreaden): vid VARJE övergång in i/ut ur BTC-positionen,
  halva Corwin-Schultz-spreaden (på BTC:s egen high/low) + 0,15%
  exchange-avgift, på den notional som flyttas.

  ANNUALISERING: 365 dagar/år (crypto handlas alla kalenderdagar, INTE
  252 handelsdagar som resten av registret - se strategies/common/crypto_data.py).
  Sharpe/CAGR i denna hypotes är INTE direkt jämförbara med registrets
  övriga (252-dagars) tal.

  JÄMFÖRELSEPUNKT: naiv buy-and-hold BTC (rå avkastning, ingen friktion,
  samma tidsfönster som strategin - från första dag SMA_200 kan beräknas).

  PASS KRÄVER ALLA TRE (huvudperioden 2010-2024, ingen kapitalnivåuppdelning
  - se small_cap_definition):
  1. Sharpe (365-dagars annualiserad, friktionsjusterad) >= 0,55.
  2. Sharpe (strategin) > Sharpe (buy-and-hold BTC, samma fönster).
  3. MaxDD inte sämre än -50%.

  FAIL om något villkor faller.

  OOS-2025: rapporteras informativt (Sharpe, MaxDD, total avkastning mot
  buy-and-hold BTC samma period), ej gating.

  Diagnostiskt syfte: testar den klassiska frågan (trendföljning vs
  buy-and-hold på ett enskilt, extremt volatilt tillgångsslag) med en
  mekanism som redan är validerad i sin ursprungliga (managed futures/
  aktiekrasch-timing) tillämpning i detta register.
