  FAILED - RENT, PA DEN ENDA TESTADE NIVAN. $1M/$10M kordes INTE - CEO
  gav explicit instruktion att avbryta efter $100k, eftersom golvet
  missades med bred marginal (Sharpe 0.29 mot kravet 0.55, ungefar
