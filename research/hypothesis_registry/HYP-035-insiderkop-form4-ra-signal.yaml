  KANDA, ACCEPTERADE BEGRANSNINGAR (redovisas, fixas INTE i efterhand om de materialiseras):
  1. Rollagnostiskt - alla Form 4-filers (styrelse, ledning, 10%-agare) raknas lika, ingen
