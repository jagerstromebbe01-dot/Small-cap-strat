  monster som HYP-012:s rena momentum-misslyckande (-72/-78%), inte ett
  gransfall dar en niva-effekt rimligen kunde vanda utfallet (jmf
  HYP-032:s Kelly-nyans, dar $100k missade men $1M/$10M klarade sig -
  den situationen hade motiverat en fullstandig korning). Detta ar ett
  avsteg fran projektets normala "rapportera alla tre niva alltid"-
  disciplin, gjort medvetet och redovisat har (INTE tyst utelamnat) -
  se feedback-minnesanteckning 2026-08-01.

  Sharpe 0.29 (golv 0.55) och sharpe_excl_best_trade 0.30 - den svaga
  Sharpen ar INTE en enskild-trade-artefakt, den ar strukturellt lag.

  DSR vid K=34: 0.12 - mycket lagt, konsistent med FAIL, INTE ett
  gransfall som DSR skulle kunna radda.

  DIAGNOSTISKT INTRESSANT (redovisas, inte doljs): avkastningsseriens
  skevhet 12.8 och kurtosis 425.8 ar EXTREMA (en normalfordelning har
  skevhet 0/kurtosis 3) - tyder pa att resultatet domineras av ett fatal
  extremt stora enskilda vinsttrades, konsistent med den kanda
  signalglesheten (decilstorleken av delpopulationen med insiderkop
  varierar kraftigt kvartal till kvartal, kan bli mycket liten/
  koncentrerad vissa kvartal - se pass_fail_criterions kanda
  begransning 3). En koncentrerad portfolj i tunt handlade
  small-cap-namn med sallsynta, extrema utfall ar exakt den typ av
  svansrisk kapacitetsspärren och friktionsmotorn INTE ensamma loser -
  MaxDD -74.9% bekraftar bilden.

  TOLKNING: 5/5 externa AI:ers oberoende forslag om insiderkop som ny
  small-cap-signal fick INTE stod i en ra, overlayfri backtest. Detta
  utesluter INTE nodvandigtvis signalen helt (en krasch-overlay eller
  liknande riskbegransning skulle kunna tamja svansrisken, samma monster
  som idio-vol-signalen som ocksa FAILADE ra (HYP-015, Sharpe 0.45-0.52)
  innan SPY-krasch-overlayen (HYP-017) gjorde den till projektets forsta
  PASS) - men det kraver en ny, separat, oberoende lasning innan det
  testas, INTE nagot som ska antas fungera per automatik. Med den redan
  extrema koncentrationen/skevheten har ar det dessutom en svagare
  kandidat for en sadan uppfoljare an idio-vol var - glesheten i sjalva
  signalen (inte bara volatiliteten hos de valda namnen) ar en annan typ
  av problem an det en krasch-overlay adresserar.

  SLUTSATS: HYP-023 forblir referensimplementationen. Insiderkop (rutt
