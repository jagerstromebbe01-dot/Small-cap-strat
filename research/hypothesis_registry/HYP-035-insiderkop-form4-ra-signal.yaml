pass_fail_criterion: 'NY, OBEROENDE hypotes (INTE en HYP-023-variant) - signal, universum,
  motor allt nytt specificerat har, INTE en tillaggsmekanism pa en befintlig referens.

  SIGNAL, exakt specificerad (INTE fri, INTE anpassad efter resultat - vald INNAN nagon
  backtest kors):
  - Kalla: SEC:s kvartalsvisa strukturerade Form 3/4/5-dataset (NONDERIV_TRANS.tsv join
    SUBMISSION.tsv pa ACCESSION_NUMBER) - EN ANNAN endpoint an companyfacts-XBRL:n som
    redan anvands for lonsamhet/varde/EPS.
  - Filter pa transaktionsniva: TRANS_CODE == "P" (oppet marknads-/privatkop) OCH
    TRANS_FORM_TYPE == 4 (Form 4 - INTE Form 5, haller signalen aktuell/snabb) OCH
    TRANS_ACQUIRED_DISP_CD == "A" (bekraftar forvarv) OCH TRANS_PRICEPERSHARE inte null.
  - Transaktionsvarde = TRANS_SHARES x TRANS_PRICEPERSHARE. BRUTTO KOPVARDE - INTE nettat
    mot forsaljningar (kod S). Motivering: insiderforsaljningar har manga informationslosa
    skal (diversifiering, skatt, likviditetsbehov) medan kop ar den renare signalen i
    litteraturen (Lakonishok & Lee 2001) - en medveten forenkling av "netto insiderkop" fran
    den ursprungliga AI-brainstormens ordalydelse, explicit vald av CEO vid lasningen.
  - LOOK-AHEAD-SAKERHET: signalens synlighetsdatum ar FILING_DATE (ALDRIG TRANS_DATE).
    Om FILING_DATE inte ar en handelsdag, blir transaktionen synlig forsta handelsdagen
    DÄREFTER (aldrig tidigare).
  - Fonster: rullande summa av kvalificerande transaktionsvarden over TRAILING 63
    handelsdagar (~90 kalenderdagar, ~ett kvartal - matchar den kvartalsvisa
    ombalanseringen), min_periods=1 (kraver INTE ett fullt fonster - en enskild transaktion
    tidigt i en tickers historik raknas anda, medvetet val for att inte forvarra den redan
    kanda glesheten).
  - Normalisering: dividerat med borsvarde vid samma ombalanseringsdatum (aterananvander
    data/cache/market_cap_by_ticker_month.csv, redan byggd for universumbandet - ingen ny
    berakning).

  RANKNING (adresserar signalglesheten fran feasibility-checken - 80-90% av universumet
  saknar insiderkop nagot enskilt kvartal):
  - Endast namn i manadens eligible-universum MED MINST EN kvalificerande transaktion i
    fonstret konkurrerar om plats - namn utan aktivitet EXKLUDERAS HELT fran rankningen
    (delar INTE en nollpott med varandra).
  - Topp-decilen (10%) av DENNA delpopulation (INTE av hela universumet) kops lang,
    n_top = max(1, int(len(scores) * 0.10)) av delpopulationen, hogst normaliserat
    kopvarde forst.
  - Om NOLL namn har kvalificerande signal ett ombalanseringstillfalle: portfoljen gar till
    kontant (inga nya positioner) till nasta ombalansering - accepterad, INTE patchad med
    en konstgjord miniminiva.

  MOTOR (aterananvander SAMMA bas-motor som HYP-008/012/015, INTE HYP-017/023:s
  overlay-lager): kvartalsvis ombalansering, snappade ombalanseringsdatum
