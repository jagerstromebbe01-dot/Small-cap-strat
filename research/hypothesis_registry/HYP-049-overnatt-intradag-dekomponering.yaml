pass_fail_criterion: >
  MEKANISM (låst, inga fria parametrar):

  Dela varje akties dagliga avkastning (på adjusted_close) i två delar:
  ÖVERNATT = dagens open / föregående dags close - 1, INTRADAG = dagens
  close / dagens open - 1. Beräkna rullande 20-handelsdagars kumulativ
  övernattavkastning minus kumulativ intradagsavkastning per aktie.

  Kvartalsvis ombalansering (samma snappade datum som resten av
  registret): rangordna eligible-universumet efter detta mått. LONG
  toppdecilen (övernatt dominerar kraftigt över intradag), KORT
  bottendecilen (intradag dominerar kraftigt över övernatt),
  likaviktat inom vardera benet, dollarneutralt (50/50 long/kort av
  benets egen allokering).

  MOTORKRAV: adjusted_close genomgående, filed-datum-korrigerat
  universum, maskad adjusted_close/close-kvot (samma tre fixar som
  redan portade till hela registret 2026-08-08), flag_implausible_liquidity(),
  Corwin-Schultz-spread + borrow_cost på kortbenet (samma 3%/år som
  resten av registret) - friktion inbyggd FRÅN START, inte tillagd i
  efterhand (lärdomen från HYP-043:s DEL A-fynd).

  PASS KRÄVER, PÅ DEN AVGÖRANDE $100k-NIVÅN (rapporteras för alla tre):
  Sharpe (efter friktion) >= 0.55 - samma standardgolv som projektets
  övriga fristående signaltest (HYP-015/017 osv).

  FAIL om golvet inte nås vid $100k.

  Diagnostiskt syfte: testar om institutionell/informerad handel lämnar
  ett mätbart spår i VAR PÅ DYGNET en akties avkastning uppstår
  (mikrostrukturlitteratur, Lou/Polk m.fl.) - en helt annan dimension
  än pris-nivå-momentum eller reversal, aldrig testad i detta register.
