  innan det nagonsin kan flagga - en "kallstart"-fordrojning som
  tillsammans med (1) slappte igenom cirka de forsta 24 handelsdagarna
  av den trasiga regimen, inklusive exakt den dag en HYP-049-kvartals-
  ombalansering rakade halla SSN.

  FIX: ny, DELAD, ADDITIV funktion mask_unrecovered_price_breaks()
  byggd i strategies/common/data_hygiene.py (andrar INTE
  clean_price_matrix()s eller flag_implausible_liquidity()s befintliga
