pass_fail_criterion: 'Identisk bas som HYP-023 (idiosynkratisk volatilitet, lagsta decilen, kvartalsvis
  ombalansering, SPY-krasch-overlay OFORANDRAD, sektor-krasch-trigger pa bank-/finanskomposit
  OFORANDRAD - samma friktion/hedge/kapacitetsspärr, samma tre motorfixar). Enda tillagget: ett
  FILTER som korsimplementeras FORE idio-vol-rankningen vid varje kvartalsvis ombalansering.

  Filter, exakt specificerat (INTE fritt, INTE anpassat efter denna eller nagon annan kandidats
  resultat - vald INNAN nagon backtest kors, den "vassaste" av tre AI-forslag fran 2026-07-31-
  brainstormen):
  - Vid varje ombalanseringstillfalle, for varje kandidat i manadens eligible-universum: rakna
    antalet dagar med adjusted_close.pct_change() == 0.0 (genuint noll, ingen prisrorelse alls -
    tecken pa att aktien inte handlades och vendorn upprepade forra stangningskursen) inom det
    TRAILING 120-dagarsfonster som redan matar idio-vol-signalen (VOL_LOOKBACK_DAYS, oforandrat).
  - Om antalet nolldagar > 12 (av upp till 120): kandidaten EXKLUDERAS HELT fran rankningen den
    ombalanseringen, oavsett dess idio-vol-rank.
  - Filtret paverkar ENDAST kandidatpoolen vid ombalansering (motsvarande "eligible"-listan i
    strategies/HYP-023/backtest.py, fore scores.sort()) - INGEN effekt mellan ombalanseringar,
    redan hallna namn saljs INTE ut for att de blir stale mitt i kvartalet (samma asymmetri-
    princip som overlayernas ateruppbyggnad redan anvander).
  - Sjalva idio-vol-BERAKNINGEN (VOL_LOOKBACK_DAYS=120, residual mot SPY-beta) AR OFORANDRAD -
    filtret paverkar bara VILKA namn som far tavla om decilplatserna, inte hur volen raknas.

  MOTORKRAV (samma som HYP-015/017/022/023): snappade ombalanseringsdatum, adjusted_close
  genomgaende, flag_implausible_liquidity().

  PASS kraver BADA:
  1. Sharpe (efter friktion) >= 0.55 pa SAMTLIGA tre kapitalnivaer - samma golv som hela projektet.
  2. Maxdrawdown INTE samre (inte mer negativ) an HYP-023:s EGET redan uppnadda resultat pa SAMMA
     kapitalniva (100k: -25.46%, 1M: -19.29%, 10M: -13.16%) - samma "maste inte skada"-standard
     som HYP-023 sjalv holls till mot HYP-017, och som BATCH-001 (HYP-025-029) foll pa vid $1M.
  FAIL om nagon niva faller under nagotdera villkoret.

  UTOVER PASS/FAIL-grinden (diagnostik, rapporteras oavsett utfall, GATAR INTE resultatet):
  (a) genomsnittligt antal kandidater exkluderade av filtret per ombalanseringstillfalle, och hur
      decilstorleken (n_top) paverkas - for att verifiera att filtret faktiskt bits pa den
      historiska decilen och inte ar en no-op.
  (b) en fornyad blind OOS-2025-korning (samma metod och samma motiv-for-genuin-blindhet som
      HYP-023:s redan gjorda OOS-test, paper_trading/HYP-023/oos_backtest_2025.py - HYP-034:s
      oforandrade, redan lasta kod korfd over samma utokade 2025-universum) for att se om just
      DEN diagnostiserade kapitalnivaberoende avklingningen (HYP-023: Sharpe 0.39/0.17/0.08
      isolerat till 2025) mildras. Detta GATAR INTE PASS/FAIL - samma statistiska reservation som
      redan dokumenterad i HYP-023 (ett enda ars Sharpe-skattning har hog standardosakerhet) - men
      rapporteras fullstandigt, INTE cherry-pickat.

  Diagnostiskt syfte: testar om en ren matningsfels-korrigering (exkludera aktier vars matta
  "laga volatilitet" sannolikt ar en artefakt av att de inte handlades, inte av genuin stabilitet)
  forbattrar eller atminstone inte skadar HYP-023, och om den mildrar den redan diagnostiserade
  kapitalnivaberoende OOS-avklingningen - den forsta av tre AI-foreslagna likviditets-atgarder,
  vald for att den kraver ingen ny data och ar billigast att testa forst.'
