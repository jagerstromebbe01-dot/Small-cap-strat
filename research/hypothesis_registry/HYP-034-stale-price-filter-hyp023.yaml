  ombalansering under 2025 - fran en redan kraftigt utunnad pool
  (202->66 bolag under aret, kand konfound fran HYP-023:s eget
  OOS-test). Detta AR den diagnostiserade kapitalnivaberoende
  avklingningen filtret var avsett att motverka, och den blev VARRE,
  inte battre.

  TOLKNING: hypotesen att stale/ohandlade priser mekaniskt trycker ner
  matt volatilitet och darigenom smygler in falskt "stabila" namn i
  lagvol-decilen fick INTE stod i praktiken - att ta bort dem skadade
  bade huvudbacktesten och den specifika OOS-svagheten filtret siktade
  pa. Mest sannolika forklaring: manga av de exkluderade "stale-
  liknande" namnen ar sannolikt INTE matningsfelsartefakter utan
  genuint lagvolatila, tunt handlade mikrobolag vars stillastaende pris
  reflekterar verklig affarsmassig stabilitet snarare an ett vendor-fel
  - att ta bort dem fran den konkurrerande poolen forskjuter den
  overlevande decilen mot namn som handlas mer aktivt men OCKSA ar
  objektivt mer volatila, vilket OKAR den realiserade svansrisken
  snarare an att minska den. Detta ar samma monster som redan setts i
  HYP-018/022/025-029: ett riskverktyg motiverat av en rimlig teori kan
  anda skada i praktiken, nar den specifika sammansattningen av just
  denna decil inte matchar det forenklade antagandet bakom teorin.

  SLUTSATS: HYP-023 forblir referensimplementationen OFORANDRAD. Den
