# LÅST 2026-08-01 av CEO i chatt, innan denna hypotes sätts pre-registered
# eller nagon backtest kors. Foljd av 5-AI-brainstormen 2026-07-31 (se
# minnesanteckning/session samma datum): alla 5 externa AI:er flaggade
# oberoende likviditet/mikrostruktur som trolig forklaring till att
# HYP-023:s genuina OOS-test over 2025 visade en Sharpe-nedgang som var
# STORRE vid hogre kapitalniva (motsatt vad kapacitetstesen skulle onska).
# Detta ar den forsta, billigaste av tre foreslagna atgarder (ingen ny
# data, ren matningsfels-fix): stale/ohandlade priser (vendorn upprepar
# samma stangningskurs flera dagar i rad) trycker mekaniskt ner den matta
# volatiliteten utan att aktien genuint ar lagrisk - en sadan aktie kan
# felaktigt hamna i den lagsta idio-vol-decilen bara for att den inte
# handlades, inte for att den ar stabil.
#
# Byggd PA HYP-023 (nuvarande referensimplementation), INTE en ny
# mekanism - ett FILTER som korsimplementement fore idio-vol-rankningen
# vid varje ombalansering. Allt annat (signal, universum, friktion,
# hedge, kapacitetsspärr, SPY-krasch-overlay, sektor-krasch-trigger)
# AR OFORANDRAT.
# status: pre-registered -> tested -> passed/failed

