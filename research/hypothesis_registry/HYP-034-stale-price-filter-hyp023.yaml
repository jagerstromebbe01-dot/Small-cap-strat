  DIAGNOSTIK (a) - filtrets faktiska bett: i genomsnitt 34.3 kandidater
  (av ett forfilter-genomsnitt pa 672.4, ~5.1%) exkluderades per
  ombalansering, vilket krympte den genomsnittliga decilstorleken fran
  en implicit ~67 (HYP-023, ofiltrerad) till 63.4 - ett REELLT, INTE
  forsumbart, filterbett, sa resultatet ar inte en no-op-artefakt.

  DIAGNOSTIK (b) - fornyad blind OOS-2025-korning
  (paper_trading/HYP-034/oos_backtest_2025.py, HYP-034:s egna
  ofrandrade kod, identisk metod som HYP-023:s motsvarande test):
  isolerat till 2025 blev Sharpe 0.265/0.052/-0.022 vid 100k/1M/10M -
  SAMRE an HYP-023:s egna 0.39/0.17/0.08 PA ALLA TRE NIVAER, och Sharpen
