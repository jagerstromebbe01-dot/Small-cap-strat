pass_fail_criterion: >
  MEKANISM (låst, inga fria parametrar kvar att välja):

  Var och en av de 5 coins får sin EGEN 200-dagars trendkoll (samma
  SMA_WINDOW=200-konvention som HYP-060, oberoende per coin - egen close
  vs egen 200-dagars SMA). Portföljen har 5 lika stora "slots" (1/5
  notional var). En slot investeras i sin coin OM den coinen är i trend
  (close > egen SMA_200), annars hålls slotten i kontanter (RF 2%/år).
  Total exponering varierar därmed dagligen mellan 0% och 100% beroende
  på hur många av de 5 som är i trend samtidigt.

  FRIKTION: halva Corwin-Schultz-spreaden (per coin, egen high/low) +
  0,15% exchange-avgift, på den enskilda coinens slot-notional (1/5 av
  totalen) vid VARJE trend-övergång för just den coinen.

  ANNUALISERING: 365 dagar/år - se HYP-060:s identiska notering.

  JÄMFÖRELSEPUNKT: BASELINE_BASKET (samma delade, friktionsjusterade
  5-coin likaviktade kvartalsvisa referenskorg som HYP-061/062 använder,
  se strategies/common/crypto_data.py::build_baseline_basket).

  PASS KRÄVER ALLA TRE (huvudperioden, ingen kapitalnivåuppdelning):
  1. Sharpe >= 0,55.
  2. Sharpe > Sharpe (BASELINE_BASKET).
  3. MaxDD inte sämre än -50%.

  FAIL om något villkor faller.

  OOS-2025: rapporteras informativt, ej gating.

  Diagnostiskt syfte: testar om HYP-060:s enskilda-tillgångs-trendfilter
  generaliserar till en diversifierad multi-asset-tillämpning (samma
  mekanism, bredare tillgångsbas) - en distinkt fråga från HYP-062:s
  relativa-styrka-rotation, som testar OM man ska äga en coin relativt
  de andra, inte om man ska äga den alls.
