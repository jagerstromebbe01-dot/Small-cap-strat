pass_fail_criterion: 'Identisk bas som HYP-037 (idiosynkratisk volatilitet, global rankning,
  SPY-krasch-overlay MED dess egen villkorade aterintrades-mekanism OFORANDRAD, sektor-
  krasch-trigger OFORANDRAD - samma friktion/hedge/kapacitetsspärr, samma tre motorfixar).
  Enda tillagget: dollarallokeringen over NYA positioner vid varje ombalansering byts fran
  likaviktat till likviditetsviktat.

  Mekanism, exakt specificerad (INTE fri, INTE anpassad efter resultat - vald INNAN nagon
  backtest kors):
  - For varje NY position (namn som gar in i portfoljen vid en ombalansering, INTE redan
    hallna namn): vikt_i PROPORTIONELL mot roten ur 20-dagars dollar-ADV (samma ADV-matt
    som redan anvands for kapacitetsspärren) - INTE linjart mot ADV, en medveten daming mot
    det mest likvida namnet, standardkonvention i marknadspaverkansmodeller.
  - Om ett enskilt namns ADV ar NaN eller <=0: dess vikt ERSATTS med MEDELVARDET av de
    OVRIGA giltiga namnens roten-ur-ADV-vikter i SAMMA ombalansering (INTE noll - ett namn
    som redan klarat idio-vol-rankningen ska inte straffas till en obefintlig position pga
    ett enskilt datahal).
  - Om SAMTLIGA namn i en given ombalanserings nya-namn-grupp saknar giltig ADV: fallback
    till REN LIKAVIKTNING (samma beteende som HYP-023/037:s redan befintliga default).
  - Vikterna normaliseras att summera till 1 over samtliga nya namn den ombalanseringen,
    multipliceras med tillgangligt cash for att ge malbelopp per namn.
  - Kapacitetsspärren (10% av ADV normalt, 5% under HYP-037:s capacity_restricted-
    tillstand) gäller FORTFARANDE som ett HART TAK per namn, TILLAMPAD EFTER
    viktberakningen - SAMMA ordning och SAMMA spärr-varden som HYP-037, oforandrat.

  MOTORKRAV (samma som HYP-015/017/022/023/037): snappade ombalanseringsdatum,
  adjusted_close genomgaende, flag_implausible_liquidity().

  PASS kraver ALLA TRE:
  1. Sharpe (efter friktion) >= 0.55 pa SAMTLIGA tre kapitalnivaer.
  2. Maxdrawdown INTE samre an HYP-037:s EGET redan uppnadda resultat pa SAMMA kapitalniva
     (100k: -23.10%, 1M: -19.12%, 10M: -13.11%) - HYP-037 ar den aktuella
     referensimplementationen, INTE HYP-023.
  3. En fornyad blind OOS-2025-korning (samma metod som HYP-023/034/037:s egna,
     paper_trading/HYP-038/oos_backtest_2025.py, HYP-038:s ofrandrade lasta kod) maste visa
     Sharpe VID $10M ISOLERAT TILL 2025 SOM INTE AR SAMRE an HYP-037:s egna 0.083 pa samma
     matt (uppdaterad jamforelsepunkt mot den nya referensen, INTE HYP-023:s 0.08).
  FAIL om nagot av de tre villkoren faller pa nagon niva.

  Diagnostiskt syfte: testar om likviditetsviktning inom decilen (mekaniskt skild fran den
  redan testade Kelly/signalstyrke-viktningen i HYP-032) specifikt adresserar den
  diagnostiserade kapitalnivaberoende kapacitetsbindningen genom att systematiskt allokera
  mer kapital till de mest likvida namnen inom den redan valda decilen, utan att andra
  sjalva urvalslogiken.'
