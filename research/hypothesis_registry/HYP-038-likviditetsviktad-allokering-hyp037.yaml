result_summary: >
  FAILED - PA VILLKOR 2, PA ALLA TRE NIVAER (villkor 1 klarades, villkor
  3 kordes INTE - se motivering nedan).

  VIKTIG METODOLOGISK NOT INNAN RESULTATET (redovisas oppet, INTE dold):
  den forsta implementationen av denna hypotes hade en ICKE-DETERMINISTISK
  BUGG - malbeloppet per namn beraknades som weight_i * DEN LOPANDE
  (redan krympande) cash-variabeln inuti kopsloopan, istallet for en
  FRUST ogonblicksbild av cash FORE loopen. Eftersom target_tickers ar en
  Python-mangd (set) med hash-randomiserad iterationsordning mellan
  processkorningar, gjorde detta HELA allokeringen beroende av i vilken
  SLUMPMASSIG ordning namnen racknades upp - samma kommando gav TRE OLIKA
  MaxDD-varden (-20.2%, -15.99%, -16.8%) i tre korningar av "identisk"
  kod innan buggen hittades. FIXAD (se strategies/HYP-038/backtest.py,
  "rebalance_cash"-ogonblicksbilden) och verifierad deterministisk
  (tva efterfoljande korningar av samma kommando gav IDENTISKT resultat)
  INNAN nagot av nedanstaende resultat togs som giltigt. Detta ar en
  allvarlig kodkvalitetslardom - flaggad har for framtida hypoteser som
  inkluderar viktad (icke-likaviktad) allokering: TESTA ALLTID
  determinism (kor samma kommando minst tva ganger) INNAN resultat
  rapporteras, eftersom Python-mangders iterationsordning inte ar
  garanterat stabil mellan processer.

  Villkor 1 (Sharpe >= 0.55): 0.66/0.67/0.70 - PASS pa alla tre, men
  TYDLIGT LAGRE an HYP-037:s 0.73/0.75/0.70 vid 100k/1M.

  Villkor 2 (MaxDD inte samre an HYP-037:s -23.10%/-19.12%/-13.11%):
  FAIL PA ALLA TRE NIVAER, och forsamringen VAXER MED KAPITALNIVA -
  motsatt den avsedda effekten (likviditetsviktning skulle specifikt
  hjalpa vid HOG kapitalniva dar kapacitetsspärren binder hardast):
  -23.88% (100k, 0.78pp samre), -21.44% (1M, 2.32pp samre), -16.11%
  (10M, 3.00pp samre - den STORSTA forsamringen ar just dar mekanismen
  skulle hjalpa mest).

  Villkor 3 (OOS-2025-gate): KORDES INTE. Eftersom villkor 2 redan
  FAILAR entydigt pa alla tre nivaer (inte ett gransfall - forsamringen
  ar konsekvent och vaxande, samma typ av tydlig, ej tvetydig miss som
  motiverade att hoppa over extra nivaer i HYP-035) skulle en
  OOS-2025-omkorning (kostsam - kraver omladdning av hela det utokade
  2025-universumet) inte andra den redan avgjorda FAIL-slutsatsen.
  Redovisat oppet har, INTE en tyst avvikelse.

  ATTRIBUTIONSRAPPORT: alfat forblir signifikant (13.4%/13.6%/10.7%
  arligt, t=3.5-3.6). Sektorexponeringen SKIFTAR pa ett diagnostiskt
  intressant satt: bankoverrepresentationen (SIC 60) MINSKAR nagot
  (4.3x/4.2x/3.2x mot HYP-037:s 5.6x/5.0x/3.5x - likviditetsviktningen
  nedviktar alltsa banker nagot, sannolikt for att de i snitt ar mindre
  likvida), MEN REIT-overrepresentationen (SIC 67) OKAR (2.0x/2.0x/2.4x
  mot 1.6x/1.7x/2.1x) - likviditetsviktningen omfordelar exponering
  fran banker till REITs (troligen mer likvida i snitt), utan att detta
  forbattrar den samlade riskbilden.

  ROBUSTHET: sharpe_excl_best_trade nara headline-Sharpen (0.66/0.67/0.70),
  inte en enskild-trade-artefakt. DSR vid K=37: 0.63/0.65/0.68 - matligt,
  konsistent med FAIL men inte ren brus (alfat existerar fortfarande,
  mekanismen bara skadar riskprofilen).

  SLUTSATS: HYP-037 forblir referensimplementationen, oforandrad.
  Likviditetsviktning inom decilen (roten-ur-ADV) hjalpte INTE den
  diagnostiserade kapacitetsbindningen - tvartom, forsamringen vaxte
  precis dar mekanismen var avsedd att hjalpa mest. Mekaniskt skild fran
  den redan FAILADE Kelly-sizingen (HYP-032), men delar samma
  overgripande lardom: att omfordela vikt INOM en redan vald decil
  (oavsett om det sker efter signalstyrka eller likviditet) har nu
  FAILAT TVA GANGER i denna strategifamilj, medan exponeringstimings-
  mekanismer star pa 3/3 PASSED. Denna urskillning (VILKA namn/vikter
  vs NAR exponering aterstalls) ar nu val etablerad over atta oberoende
  tester.
