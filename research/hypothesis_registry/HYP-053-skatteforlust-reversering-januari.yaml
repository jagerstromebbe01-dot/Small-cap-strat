  spread på entry/exit.

  PASS KRÄVER, RAPPORTERAT ÖVER DE AKTIVA HANDELSFÖNSTREN (annualiserat
  mått från en ~1-månads aktiv period per år, redovisas explicit som
  sådant):
  1. Sharpe >= 0.55 på samtliga tre kapitalnivåer.
  2. MaxDD för NÅGOT enskilt års fönster INTE sämre än -40% (explicit
     tak i förväg, samma motivering som HYP-050: undviker att en enskild
     genuin-distress-position (samma dödsmönster som HYP-042) tillåts
     dominera resultatet okontrollerat).

  FAIL om något villkor faller.

  OBLIGATORISK DISCLOSURE (icke-gating): avkastning per enskilt år
  redovisas separat, för att verifiera att resultatet inte domineras av
  ett eller två enskilda år.

  Diagnostiskt syfte: testar en KLASSISK, väldokumenterad kalender-
  anomali med en MEKANISK (skatteregeldriven försäljning i december),
  inte överreaktionsbaserad, motivering - skiljer sig explicit från
  HYP-042:s misslyckade kortsiktiga reversal genom att signalen är
  tidsstyrd av en extern, känd händelse snarare än av prisrörelsen
  själv.
