  1000000: {sharpe: 0.7537, cagr: 0.0730, max_drawdown: -0.1094, sharpe_ex2020: 0.6757, kurtosis: 34.8, deflated_sharpe_ratio: 0.5607}
  10000000: {sharpe: 0.5000, cagr: 0.0546, max_drawdown: -0.1312, sharpe_ex2020: 0.5420, kurtosis: 70.3, deflated_sharpe_ratio: 0.2568}
  avg_n_eligible_per_month: 696.5
