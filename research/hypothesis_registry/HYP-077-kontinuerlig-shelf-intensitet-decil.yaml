result_summary: >
  FAILED PA VILLKOR 4 (kurtosis) PA DEN AVGORANDE $100k-NIVAN, TROTS ATT
  VILLKOR 1-3 PASSERADE (Sharpe 0,7006 >= 0,55; MaxDD -11,96% >= -50%;
  Sharpe ex-2020 0,4994 >= 0,4894 - en MARGINELL passering, bara 0,01
  over tröskeln). Villkor 4: kurtosis 536,6, HOGRE an HYP-072:s egen
  366,2 - alltsa VARRE, inte battre, trots hypotesens uttryckliga syfte
  att minska koncentration genom bredare deciler.

  DIAGNOS: bottendecilen bestar till 100% av score=0-namn (tie-break-
  fordelningen slog igenom fullt ut - se disclosure), dvs. i praktiken
  SAMMA "rena"-population som HYP-072:s befintliga klassificering, men
  nu begransad till EXAKT 10% (~70 namn/manad) istallet for HYP-072:s
  bredare "ren"-grupp (~50,5% av universumet, se HYP-072:s disclosure).
  En SMALARE long-korg (70 istallet for ~350 namn) okar - inte minskar -
  enskild-namn-koncentrationen, rakt motsatt den avsedda effekten. Detta
  ar en direkt, forklarad konsekvens av konstruktionen (tie-break pa
  alfabetisk ordning bland tusentals identiska score=0-namn slumpar i
  praktiken fram en GODTYCKLIG, smal delmangd av den redan breda "rena"-
  gruppen), inte en bugg eller ett datafel.

  MaxDD forsamrades ocksa (-11,96% mot HYP-072:s -6,18%) - konsistent
  med samma diagnos (smalare korg = mer koncentrerad risk, inte mindre).

  DSR (K=74) = 0,6044/0,5607/0,2568 - mattlig vid $100k men irrelevant
  har eftersom Villkor 4 redan avgor FAIL.

  Diagnostiskt: den kontinuerliga tidsviktningen i sig (exponentiellt
  avtagande shelf_score) var INTE problemet - problemet var att
  DECILRANGORDNING pa en signal dar en majoritet av universumet delar
  samma (noll-)varde oavsiktligt SMALNAR AV long-benet jamfort med
  HYP-072:s binara "alla score=0-namn"-regel. En framtida variant som
  vill behalla den kontinuerliga poangen men undvika denna fallgrop
  skulle behova en annan LONG-regel (t.ex. "alla score=0-namn", som i
  HYP-072, snarare an "bottendecilen av score") - men det vore en ny,
  separat hypotes, inte en efterhandsjustering av denna.
