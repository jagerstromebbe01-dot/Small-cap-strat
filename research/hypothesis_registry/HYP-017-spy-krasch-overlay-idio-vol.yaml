id: HYP-017
date_registered: '2026-07-29'
title: SPY-krasch-overlay pa idiosynkratisk volatilitet (uppfoljare till HYP-015)
universe: small-cap, $100M - $2B börsvärde, EODHD All-World som datakälla
small_cap_definition: small-cap, $100M - $2B börsvärde, EODHD All-World som datakälla
data_range: EODHD All-World, samma period som HYP-008/015 (2011-2024)
pass_fail_criterion: 'Identisk bas som HYP-015 (idiosynkratisk volatilitet, lagsta decilen, kvartalsvis
  ombalansering, samma friktion/hedge/kapacitetsspärr, samma tre motorfixar - snappade ombalanseringsdatum,
  adjusted_close genomgaende, likviditetsfilter). Enda tillagget: en DAGLIG (INTE bara vid kvartalsvis
  ombalansering) krasch-overlay pa SPY-niva, riktad direkt mot den diagnostiserade felorsaken i HYP-015.

  Krasch-overlay, exakt specificerad (INTE valfri, inga fria parametrar att justera efter att resultat
  setts - trosklarna ar valda som runda, forsvarbara varden INNAN nagon backtest kors, inte anpassade
  efter covid-episodens exakta magnitud):
  - Trigger: SPY:s EGEN kumulativa avkastning over de senaste 10 handelsdagarna. Kontrolleras VARJE
    handelsdag, inte bara vid kvartalsslut.
  - Om SPY:s 10-dagars-avkastning < -10%: skar bruttoexponeringen (alla befintliga innehav) till 40%
    av det varde de annars skulle haft DEN DAGEN - saljs PRO RATA over alla innehav samma dag, med
    samma friktion (halva Corwin-Schultz-spreaden) som en vanlig ombalanserings-exit. Utfors bara EN
    gang per aktiverings-episod (upprepas inte varje dag triggern forblir aktiv, for att undvika att
    saljas ner under 40% flera ganger i rad).
  - Overlayen ATERSTALLER INTE exponeringen automatiskt nar SPY aterhamtar sig - normal exponering
    (100%) aterkommer forst vid NASTA ordinarie kvartalsvisa ombalansering (samma mekanik som redan
    finns for vanlig decil-omval). Detta ar en medveten forenkling: overlayen ar asymmetrisk (snabb
    att skara ner, normal hastighet att aterstalla) for att undvika en andra uppsattning fria
    tidsparametrar for aterinträde, vilket skulle oka risken for i efterhand anpassade val.
  - Kapacitetsspärr, friktion (Corwin-Schultz + 3% borrow), SPY-beta-hedge: ALLA oforandrade och
    AKTIVA fran HYP-015, INTE ersatta av denna overlay - overlayen ar ett TILLAGG ovanpa, inte en
    ersattning.

  MOTORKRAV (samma tre som HYP-015/016, redan byggda i strategies/common/): snappade
  ombalanseringsdatum, adjusted_close genomgaende (bade signal och positionsvardering),
  flag_implausible_liquidity().

  PASS kraver BADA:
  1. Sharpe (efter friktion) >= 0.55 pa SAMTLIGA tre kapitalnivaer (100k/1M/10M).
  2. Maxdrawdown battre (mindre negativ) an -30% pa SAMTLIGA tre kapitalnivaer - valt som HYP-015:s
     REDAN OBSERVERADE basta resultat (10M-nivan, dar kapacitetsspärren raka tvingade in mer likvida
     namn och dampade covid-skadan till -30.5%) - kravet ar alltsa att uppna vid VARJE kapitalniva
     vad som redan hander av en slump vid EN niva, inte ett godtyckligt tal.
  FAIL om nagon niva faller under nagotdera villkoret.

  Diagnostiskt syfte: testar om en snabb, marknadsniva-baserad krasch-brytare (som reagerar pa SPY:s
  EGEN realiserade rorelse, inte en langsam 126-dagars trailing-beta eller portfoljens egen volatilitet
  - den senare visade sig redan i HYP-016 knappt paverka MaxDD) kan tamja den specifika, diagnostiserade
  svansrisken i HYP-015 utan att forstora den underliggande edgen.'
status: passed   # pre-registered -> tested -> passed/failed
