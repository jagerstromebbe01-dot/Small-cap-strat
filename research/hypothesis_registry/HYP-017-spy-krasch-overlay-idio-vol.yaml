result_summary: >
  PASSED på SAMTLIGA tre kapitalnivåer och BÅDA villkoren - FÖRSTA
  GODKÄNDA HYPOTESEN i projektets historia (K=16, efter 7 döda
  ejay-varianter + 8 tidigare FAILED small-cap-hypoteser). Sharpe
  0.72/0.75/0.72 (tröskel 0.55), MaxDD -27.0%/-19.8%/-13.4% (tröskel
  bättre än -30%), CAGR 11.9%/12.2%/9.7% (högre än HYP-015:s ~8%, inte
  bara lägre risk utan även högre avkastning). DSR 0.82/0.85/0.83 vid
  K=16 - klart starkast av alla hypoteser testade hittills, om än
  fortfarande under en strikt 0.95-tröskel.

  Robusthetskontroller (innan detta rapporterades som PASS):
  1. sharpe_excl_best_trade förblir 0.667/0.698/0.716 - alla fortfarande
     över 0.55 även utan den enskilt bästa traden - INTE en artefakt av
     en dominerande outlier (samma kontroll som avslöjade ESSA/ARDMQ/COL
     i tidigare hypoteser).
  2. Krasch-overlayen triggade på 10 dagar fördelade över 5 OBEROENDE,
     välkända marknadsstressperioder över hela 2011-2024 - inte bara
     covid-kraschen som motiverade hypotesen: 2011-08-04 (amerikanska
     skuldtakskrisen/S&P-nedgraderingen), 2015-08-24 ("Black Monday",
     Kinas devalvering), 2018-12-24 ("julafton-massakern"), 2020-02-27
     till 2020-03-16 (covid, flera triggningar), 2022-06-16 och
     2022-09-26 (2022 års björnmarknad). Detta minskar (men eliminerar
     inte helt - se KÄND METODOLOGISK RESERVATION nedan) risken att
     mekanismen bara är en tunad engångslösning för den ena kända
     covid-episoden.
  3. Overlay-trades har i ISOLATION negativ förväntad avkastning
     (genomsnitt -7.9%, win rate 31%, mot rebalance-exits genomsnitt
     +7.6%, win rate 61%) - konsistent med hur en genuin
     krasch-/svansriskskyddsmekanism FÖRVÄNTAS bete sig (kostar lite i
     normala/skakiga perioder, betalar sig i svansutfall). Det är INTE
     ett tecken på fel - det är signaturen av att mekanismen fungerar
     som avsedd.

  KÄND METODOLOGISK RESERVATION (för protokollet, inte löst här):
  mekanismens EXAKTA parametrar (SPY 10-dagars-avkastning, -10%-tröskel,
  40%-nedskärning) valdes som runda, ej facit-anpassade tal - men
  BESLUTET att bygga en marknadsnivå-krasch-brytare över huvud taget var
  direkt informerat av att ha diagnostiserat covid-kraschen som HYP-015:s
  konkreta felorsak i just denna data. Detta är en mildare form av
  samma risk pre-registreringssystemet finns till för att skydda mot.
  Robusthetskontroll 2 ovan (5 oberoende krascher, inte bara covid)
  väger emot att detta är ren efterhandsanpassning, men elimnerar den
  inte helt - flaggat explicit för framtida granskning/replikering
  (t.ex. out-of-sample-test pa data efter 2024 nar sådan finns
  tillgänglig).

  UPPDATERING 2026-07-30 ("lamna-en-kris-ute"-robusthetstest, diagnostik
  - INGEN K-kostnad, INGEN andring av status/kriterium): kort om
  scripts/diagnostic_hyp017_leave_one_crisis_out.py kor om HYP-017:s
  exakta backtest 5 ganger, en gang per krisepisod, med overlayen
  FORHINDRAD att trigga just under DEN episoden (men aktiv for de andra
  4). Resultat: PASS haller pa ALLA SEX scenarier (fullt resultat + 5
  lamna-ute-varianter) pa alla tre kapitalnivaer. Covid ar, vantat, mest
  paverkande - utan covid-skydd blir MaxDD vid $1M -23.8% (mot -19.8%
  fullt) - men aven DA passerar alla tre nivaer fortfarande bade
  Sharpe- och MaxDD-kriteriet. Detta ar den starkaste robusthetssignal
  som gar att fa utan riktig out-of-sample-data: resultatet ar INTE
  skort av att ha "tur" med en enda kand historisk handelse. Loser inte
  HELT den metodologiska reservationen ovan (parametrarna las fortfarande
  med vetskap om vilken TYP av handelser som skulle behova fangas) men
  ett rejalt styrkebesked.

  UPPDATERING 2026-07-30 (friktions-stresstest + skeptisk granskning,
  diagnostik - INGEN K-kostnad): tva separata fynd, ett positivt och ett
  allvarligt negativt.

  (a) POSITIVT - friktions-stresstest (scripts/diagnostic_hyp017_friction_stress_test.py):
  aven vid kraftigt pessimistiska antaganden (2x Corwin-Schultz-spread,
  9% arlig borrow-kostnad - 3x baslinjens 3%) hall Sharpe sig over
  0.55-golvet pa alla tre nivaer (0.633/0.674/0.654 mot baslinjens
  0.716/0.750/0.724), och MaxDD rorde sig knappt. Strategin ar INTE skor
  mot att friktionsmodellen underskattar verkliga kostnader.

  (b) ALLVARLIGT NEGATIVT - branschkoncentration: en granskning av
  ALLA 696 unika tickers som nagonsin handlats visar att 27.3% har ett
  bank-/finansrelaterat namn (bancorp, savings, bank, thrift, financial,
  trust) - mot bara 7.0% i HELA small-cap-basuniversumet (5162 tickers).
  En ~4x overrepresentation. Forklaringen ar begriplig (reglerade banker/
  sparbanker har typiskt mycket stabila, lagvolatila kurser, vilket en
  lagst-volatilitet-siktning naturligt plockar upp) - men det betyder att
  strategins verkliga risk INTE ar generell aktiemarknadsrisk minus lite,
  utan i hog grad bankspecifik risk (ranteneto, kreditcykel, regulatorisk
  risk, korrelerad bankpanik).

  Detta ar INTE hypotetiskt - det hande i var egen data: den amerikanska
  regionbankskrisen mars 2023 (SVB/Signature Bank) gav portfoljen en
  -14.8% nedgang (2023-02-01 till 2023-05-01, $100k-nivan) MEDAN SPY VAR
  +1.5% SAMMA PERIOD. Krasch-overlayen (som bara bevakar SPY:s egen
  rorelse) triggade ALDRIG under denna period, eftersom SPY sjalv knappt
  paverkades - kraschen var sektorspecifik, inte marknadsbred. Detta ar
  exakt den typ av handelse strategins koncentrerade bankexponering gor
  den mest sarbar for, och det enda befintliga skyddsverktyget ar
  strukturellt blint for just den.

  SJALVKRITIK: det tidigare "lamna-en-kris-ute"-testet (2026-07-30,
  ovan) missade detta helt, eftersom det bara undersokte de 5 datum dar
  overlayen FAKTISKT triggade - inte perioder dar portfoljen tog skada
  UTAN att overlayen nagonsin reagerade. Marsdrawdown 2023 foll dessutom
  kronologiskt inom en langre, redan "crash_related"-klassificerad
  drawdown-episod (2022-03-30 till 2023-05-12) i en tidigare, for grov
  episod-dekomponering - vilket felaktigt dolde att just mars 2023-delen
  av den episoden var HELT oskyddad. En battre metodik hade kollat
  overlay-status dag-for-dag under HELA episoden, inte bara klassificerat
  hela episoden som "skyddad" for att ETT av flera kanda krisdatum rakade
  falla nagonstans inom dess langa tidsspann.

  ATGARDAT: INTE HAR. Kraver antingen ett branschtak i decilvalet eller
  en andra, sektorspecifik krasch-trigger (t.ex. en regionbanksindex-
  baserad signal i stallet for/utover SPY) - flaggat som en konkret,
  val motiverad nasta atgard, inte byggt i denna session.

  UPPDATERING 2026-07-30 (CEO-BESLUT - REFERENSSTATUS OVERFORD):
  branschkoncentrationen adresserades i tva uppfoljande hypoteser.
  HYP-022 (statiskt 15%-tak pa bank-/finansinnehav) FAILED - loste
  mars 2023 men forsamrade MaxDD vid $1M/$10M genom att ta bort
  banksektorns stabiliserande roll under en langre, icke-bankrelaterad
  2022-bjornmarknad. HYP-023 (dynamisk, handelsetriggad sektor-krasch-
  trigger pa ett bank-/finanskompositindex, samma arkitektur som denna
  hypotes SPY-overlay) PASSED - loser mars 2023-sarbarheten (mars
  2023-episoden -14.0%/-8.2%/-2.3% mot denna hypotes -14.8%) UTAN att
  ge upp nagot pa Sharpe eller MaxDD (MaxDD battre pa alla tre nivaer,
  om an marginellt vid $1M/$10M). CEO har DARFOR UTSETT HYP-023 TILL
  DEN NYA REFERENSIMPLEMENTATIONEN. Denna hypotes (HYP-017) FORBLIR
  PASSED och kvarstar i registret som forsta godkanda hypotesen och
  grunden HYP-023 byggde vidare pa - men ar INTE langre den aktiva
  referensen for framtida jamforelser/utveckling. Se
  research/hypothesis_registry/HYP-023-sektor-krasch-trigger-hyp017.yaml.
