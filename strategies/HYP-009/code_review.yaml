coder_b_notes: >
  Diffade strategies/HYP-009/backtest.py rad-för-rad mot
  strategies/HYP-008/backtest.py (diff -u). Enda funktionella skillnader:
  (1) BORROW_ANNUAL_RATE = 0.0 istället för 0.03 (rad 75), borrow_cost()
  anropas fortfarande identiskt (rad 385) - inte hoppats över. (2) Ny
  konstant SPREAD_COST_MULTIPLIER = 0.0 (rad 76-79) som multiplicerar
  spread-kostnadstermen vid både exit (rad 314, "proceeds -= proceeds *
  (exit_spread / 2) * SPREAD_COST_MULTIPLIER") och entry (rad 369,
  "effective_entry = cp * (1 + entry_spread / 2 * SPREAD_COST_MULTIPLIER)")
  - corwin_schultz_spread()-beräkningen själv (compute_spread_matrix,
  rad 259-263) är orörd och körs identiskt med HYP-008, bara
  kostnadseffekten nollställs, exakt som kriteriet kräver. Alla övriga
  rader som skiljer sig är kommentarer/docstrings som beskriver
  ablationen - ingen ändring av par-identifiering, z-score, beta,
  entry/exit-logik, positionsstorlek (FIXED_FRAC), MAX_POS,
  kapacitetsspärren (MAX_ADV_PCT, oförändrad rad 81), universum,
  datakälla eller period (FULL_START/FULL_END identiska med HYP-008).
  RF_ANNUAL/2/252-hedgefinansieringstermen i hedge_pnl (rad 386) är
  också oförändrad mot HYP-008 - korrekt, spec §3/kriteriet nämner bara
  borrow_cost och spread som friktionstermer att nollställa.

  Körde scripts/validate_hypothesis.py mot
  research/hypothesis_registry/HYP-009-friction-ablation.yaml -> exit 0
  ("validly pre-registered hypothesis"). Körde
  scripts/validate_friction_usage.py mot strategies/HYP-009/backtest.py
  -> exit 0 (bekräftar AST-nivå att både corwin_schultz_spread och
  borrow_cost importeras OCH anropas, inte bara nollställda genom att
  tas bort - vilket är precis vad kriteriet och spec §3 kräver för att
  ablationen ska bevisa något).

  Kontrollerade att pass_fail_criterion, status och
  tested_capital_levels i HYP-009-friction-ablation.yaml är orörda
  (Coder har inte skrivit till dem) och att implementationen matchar
  kriteriets ordagranna beskrivning (annual_rate=0.0,
  spread-kostnadstermen multiplicerad med 0, båda funktionerna
  fortfarande anropade). Inga avvikelser hittade. Godkänd.
